<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Upload Video - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:50px; }
        .hdr { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid #222; position:sticky; top:0; background:#0f0f0f; z-index:10; }
        .hdr-left { display:flex; align-items:center; gap:16px; }
        .btn-back { background:none; border:none; color:#fff; cursor:pointer; }
        .btn-back svg { width:22px; height:22px; fill:#fff; }
        .btn-pub { background:#e50914; color:#fff; border:none; padding:8px 22px; border-radius:20px; font-weight:700; cursor:pointer; font-size:13px; }

        .container { padding:16px; max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
        .dropzone { border:2px dashed #333; border-radius:12px; padding:30px 16px; text-align:center; background:#141414; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px; }
        .dropzone svg { width:42px; height:42px; fill:#e50914; }

        .inp-grp { display:flex; flex-direction:column; gap:6px; }
        .inp-grp label { font-size:12px; color:#aaa; font-weight:600; }
        .inp-grp input, .inp-grp textarea, .inp-grp select { background:#181818; border:1px solid #333; border-radius:10px; padding:12px; color:#fff; font-size:14px; outline:none; }
        .inp-grp input:focus, .inp-grp textarea:focus { border-color:#e50914; }
    </style>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>
    <header class="hdr">
        <div class="hdr-left">
            <button class="btn-back" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span style="font-size:17px; font-weight:700;">Upload video</span>
        </div>
        <button class="btn-pub" id="btnUpload" onclick="publishVideo()">Upload</button>
    </header>

    <div class="container">
        <div class="dropzone" onclick="document.getElementById('fileInp').click()">
            <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            <span style="font-weight:700;" id="fileLabel">Select Video from Phone</span>
            <span style="font-size:11px; color:#777;">Supports 16:9 Long Form MP4 / WebM</span>
            <input type="file" id="fileInp" accept="video/*" style="display:none;" onchange="onPicked(event)">
        </div>

        <div class="inp-grp">
            <label>Title</label>
            <input type="text" id="vTitle" placeholder="e.g. BTube Official Platform Launch">
        </div>

        <div class="inp-grp">
            <label>Description</label>
            <textarea id="vDesc" rows="3" placeholder="Tell viewers about this video..."></textarea>
        </div>

        <div class="inp-grp">
            <label>Category</label>
            <select id="vCat">
                <option value="Features">BTube Features</option>
                <option value="Policy">Policy & Guidelines</option>
                <option value="Chhattisgarhi">Chhattisgarhi</option>
                <option value="Music">Music</option>
                <option value="Vlogs">Vlogs</option>
            </select>
        </div>
    </div>

    <script>
        function onPicked(e) {
            const f = e.target.files[0];
            if (f) {
                document.getElementById('fileLabel').innerText = f.name;
                const t = document.getElementById('vTitle');
                if (!t.value) t.value = f.name.replace(/\.[^/.]+$/, "");
            }
        }

        async function publishVideo() {
            const title = document.getElementById('vTitle').value.trim() || 'BTube Official Video';
            const btn = document.getElementById('btnUpload');
            btn.disabled = true;
            btn.innerText = 'Publishing...';

            try {
                await window.BTubeAPI.saveVideo({
                    title: title,
                    name: title,
                    description: document.getElementById('vDesc').value.trim(),
                    category: document.getElementById('vCat').value,
                    type: 'video',
                    videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
                    thumb: 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800',
                    channel: 'BTube',
                    visibility: 'Public',
                    duration: '04:15'
                });

                alert('Video uploaded successfully!');
                window.location.href = 'your-videos.html';
            } catch(e) {
                alert('Upload fail: ' + e.message);
                btn.disabled = false;
                btn.innerText = 'Upload';
            }
        }
    </script>
</body>
</html>
