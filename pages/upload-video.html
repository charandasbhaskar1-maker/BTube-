<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f0f0f">
<title>Upload Video - BTube</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:#fff;padding-bottom:30px}
header{height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292929;position:sticky;top:0;background:#0f0f0f;z-index:5}
button,.choose{border:0;cursor:pointer;font-weight:700}
.back{background:none;color:#fff;font-size:25px}
.publish,.choose{background:#3ea6ff;color:#07111b;padding:11px 20px;border-radius:24px}
.publish:disabled{opacity:.5;cursor:not-allowed}
main{max-width:650px;margin:auto;padding:16px}
.pick{text-align:center;padding:70px 10px;display:flex;align-items:center;flex-direction:column;gap:18px}
.pick-icon{font-size:48px;background:#202020;border:1px dashed #555;border-radius:50%;width:90px;height:90px;display:grid;place-items:center}
.muted{font-size:13px;color:#999;line-height:1.5}
.editor{display:none}
.preview{background:#181818;padding:12px;border-radius:12px;margin-bottom:22px}
video{width:100%;max-height:300px;background:#000;border-radius:8px}
.field{margin:18px 0}
label.title{display:block;color:#bbb;font-size:13px;margin-bottom:8px}
input[type=text],textarea,select{width:100%;background:#1b1b1b;border:1px solid #383838;color:#fff;padding:13px;border-radius:9px;font-size:15px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#3ea6ff}
textarea{min-height:110px;resize:vertical}
select{color-scheme:dark}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.note{padding:13px;background:#191919;border-radius:9px;margin:14px 0;color:#aaa;font-size:13px;line-height:1.5}
.status{display:none;margin:16px 0;padding:14px;background:#1b1b1b;border-radius:10px;line-height:1.5;overflow-wrap:anywhere}
.progress{height:5px;background:#333;border-radius:5px;overflow:hidden;margin-top:12px}
.progress span{display:block;height:100%;width:35%;background:#3ea6ff;animation:move 1.2s ease-in-out infinite alternate}
@keyframes move{from{transform:translateX(-20%)}to{transform:translateX(190%)}}
.error{color:#ff8b8b}.success{color:#8ee8ad}
@media(prefers-reduced-motion:reduce){.progress span{animation:none}}
</style>
</head>

<body>
<header>
  <div class="row">
    <button class="back" onclick="goBack()" aria-label="Back">‹</button>
    <strong style="margin-left:12px">Upload Video</strong>
  </div>
  <button class="publish" id="publishBtn" style="display:none" onclick="publishVideo()">Publish</button>
</header>

<main>
  <section class="pick" id="picker">
    <div class="pick-icon">↑</div>
    <h3>अपना वीडियो चुनें</h3>
    <p class="muted">अपने फोन या डिवाइस से वीडियो चुनें। कोई डेमो वीडियो इस्तेमाल नहीं होगा।</p>
    <label class="choose" for="videoFile">Choose Video</label>
    <input id="videoFile" type="file" accept="video/*" hidden>
  </section>

  <section class="editor" id="editor">
    <div class="preview">
      <video id="videoPreview" controls playsinline preload="metadata"></video>
      <p class="muted" id="fileInfo" style="margin-top:8px"></p>
    </div>

    <div class="field">
      <div class="row">
        <label class="title" for="videoTitle">वीडियो का नाम *</label>
        <span class="muted" id="titleCount">0/100</span>
      </div>
      <input id="videoTitle" type="text" maxlength="100" placeholder="वीडियो का शीर्षक लिखें">
    </div>

    <div class="field">
      <label class="title" for="videoDescription">वीडियो का विवरण</label>
      <textarea id="videoDescription" maxlength="5000" placeholder="अपने वीडियो के बारे में लिखें"></textarea>
    </div>

    <div class="field">
      <label class="title" for="visibility">वीडियो कौन देख सकता है?</label>
      <select id="visibility">
        <option value="Public">Public — सभी देख सकते हैं</option>
        <option value="Unlisted">Unlisted — लिंक रखने वाले</option>
        <option value="Private">Private — निजी</option>
      </select>
    </div>

    <div class="field">
      <label class="title" for="audience">क्या यह वीडियो बच्चों के लिए बनाया गया है?</label>
      <select id="audience">
        <option value="no">नहीं</option>
        <option value="yes">हाँ</option>
      </select>
    </div>

    <div class="note">
      <strong>अपलोड से जुड़ी जानकारी</strong>
      <p style="margin-top:6px">वीडियो Firebase Storage में और उसका विवरण Firestore में सेव किया जाएगा। इसके लिए Firebase Storage की सेटिंग और सही सुरक्षा नियम आवश्यक हैं।</p>
    </div>

    <div class="status" id="statusBox" role="status" aria-live="polite"></div>
    <button class="publish" id="publishBtnBottom" style="width:100%" onclick="publishVideo()">वीडियो Publish करें</button>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<script src="../assets/js/api-client.js"></script>

<script>
"use strict";

let selectedFile = null;
let previewUrl = null;
let isUploading = false;

const fileInput = document.getElementById("videoFile");
const titleInput = document.getElementById("videoTitle");
const descriptionInput = document.getElementById("videoDescription");
const visibilityInput = document.getElementById("visibility");
const statusBox = document.getElementById("statusBox");
const publishBtn = document.getElementById("publishBtn");
const publishBtnBottom = document.getElementById("publishBtnBottom");

function showStatus(message, type = "") {
  statusBox.style.display = "block";
  statusBox.className = "status " + type;
  statusBox.textContent = message;
}

function goBack() {
  if (isUploading) {
    alert("अपलोड पूरा होने तक कृपया पेज बंद न करें।");
    return;
  }
  if (selectedFile && !confirm("क्या आप अपलोड पेज से बाहर जाना चाहते हैं?")) return;
  window.location.href = "upload.html";
}

fileInput.addEventListener("change", function(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  if (!file.type || !file.type.startsWith("video/")) {
    alert("कृपया सही वीडियो फाइल चुनें।");
    fileInput.value = "";
    return;
  }

  selectedFile = file;

  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(file);

  const player = document.getElementById("videoPreview");
  player.src = previewUrl;

  document.getElementById("fileInfo").textContent =
    file.name + " • " + formatSize(file.size);

  if (!titleInput.value.trim()) {
    titleInput.value = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
  }

  document.getElementById("picker").style.display = "none";
  document.getElementById("editor").style.display = "block";
  publishBtn.style.display = "block";
  statusBox.style.display = "none";
  updateTitleCount();
});

function formatSize(bytes) {
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

function updateTitleCount() {
  document.getElementById("titleCount").textContent =
    titleInput.value.length + "/100";
}
titleInput.addEventListener("input", updateTitleCount);

function setBusy(busy) {
  isUploading = busy;
  publishBtn.disabled = busy;
  publishBtnBottom.disabled = busy;
  publishBtn.textContent = busy ? "Uploading…" : "Publish";
  publishBtnBottom.textContent = busy ? "अपलोड हो रहा है…" : "वीडियो Publish करें";
}

async function publishVideo() {
  if (isUploading) return;

  if (!selectedFile) {
    showStatus("पहले अपने डिवाइस से वीडियो चुनें।", "error");
    return;
  }

  const title = titleInput.value.trim();
  if (!title) {
    showStatus("वीडियो का शीर्षक लिखना ज़रूरी है।", "error");
    titleInput.focus();
    return;
  }

  if (!window.BTubeAPI || typeof window.BTubeAPI.uploadVideo !== "function") {
    showStatus(
      "BTube API लोड नहीं हुई। Firebase SDK और assets/js/api-client.js का पाथ जाँचें।",
      "error"
    );
    return;
  }

  if (!window.firebase || !firebase.apps || firebase.apps.length === 0) {
    showStatus(
      "Firebase शुरू नहीं हुआ। api-client.js में Firebase configuration जाँचें।",
      "error"
    );
    return;
  }

  if (!firebase.storage) {
    showStatus(
      "Firebase Storage SDK उपलब्ध नहीं है। पेज को रीफ्रेश करके दोबारा कोशिश करें।",
      "error"
    );
    return;
  }

  setBusy(true);
  showStatus("वीडियो Firebase Storage पर अपलोड हो रहा है। फाइल के आकार और इंटरनेट के अनुसार समय लग सकता है।");

  const timeoutMessage =
    "अपलोड पूरा नहीं हो पाया। इंटरनेट, Firebase Storage और Firebase सुरक्षा नियम जाँचें।";

  try {
    const user = firebase.auth ? firebase.auth().currentUser : null;

    if (!user) {
      throw new Error("वीडियो अपलोड करने से पहले BTube में लॉग इन करें।");
    }

    const result = await window.BTubeAPI.uploadVideo({
      file: selectedFile,
      title: title,
      description: descriptionInput.value.trim(),
      type: "video",
      thumb: "",
      channel: user.displayName || user.email || "BTube Creator",
      visibility: visibilityInput.value
    });

    if (!result || !result.id) {
      throw new Error("अपलोड का रिकॉर्ड नहीं मिला। वीडियो सूची में सेव होने की पुष्टि नहीं हुई।");
    }

    showStatus("वीडियो सफलतापूर्वक अपलोड और सेव हो गया। आपकी वीडियो सूची खोली जा रही है।", "success");

    setTimeout(function() {
      window.location.href = "your-videos.html";
    }, 900);

  } catch (error) {
    console.error("BTube video upload failed:", error);
    showStatus(error && error.message ? error.message : timeoutMessage, "error");
  } finally {
    setBusy(false);
  }
}

window.addEventListener("beforeunload", function() {
  if (previewUrl) URL.revokeObjectURL(previewUrl);
});
</script>
</body>
</html>
