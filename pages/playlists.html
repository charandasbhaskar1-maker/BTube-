<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Playlists - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:70px; }

        .pl-header { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid #222; position:sticky; top:0; background:#0f0f0f; z-index:100; }
        .hdr-left { display:flex; align-items:center; gap:16px; }
        .btn-back { background:none; border:none; color:#fff; cursor:pointer; display:flex; }
        .btn-back svg { width:22px; height:22px; fill:#fff; }

        .create-pl-bar { padding:14px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #1a1a1a; }
        .btn-new-pl { background:#222; border:1px solid #333; color:#fff; padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; cursor:pointer; }
        .btn-new-pl svg { width:18px; height:18px; fill:#e50914; }

        .pl-list { display:flex; flex-direction:column; padding:8px 0; }
        .pl-item { display:flex; gap:14px; padding:12px 16px; border-bottom:1px solid #161616; cursor:pointer; text-decoration:none; color:#fff; align-items:center; }
        
        .pl-thumb-box { width:120px; height:68px; border-radius:8px; overflow:hidden; background:#222; position:relative; flex-shrink:0; }
        .pl-thumb-box img { width:100%; height:100%; object-fit:cover; }
        .pl-badge-count { position:absolute; bottom:0; right:0; top:0; width:40%; background:rgba(0,0,0,0.75); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; font-weight:800; backdrop-filter:blur(2px); }
        .pl-badge-count svg { width:14px; height:14px; fill:#fff; }

        .pl-info { flex:1; display:flex; flex-direction:column; gap:4px; min-width:0; }
        .pl-name { font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .pl-sub { font-size:12px; color:#888; }

        .bottom-nav { position:fixed; bottom:0; left:0; width:100%; height:52px; background:#0f0f0f; display:flex; align-items:center; justify-content:space-around; border-top:1px solid #222; z-index:1000; }
        .nav-btn { display:flex; flex-direction:column; align-items:center; font-size:10px; color:#aaa; text-decoration:none; gap:2px; }
        .nav-btn.active { color:#fff; font-weight:700; }
        .nav-btn svg { width:22px; height:22px; fill:currentColor; }
    </style>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <header class="pl-header">
        <div class="hdr-left">
            <button class="btn-back" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span style="font-size:18px; font-weight:700;">Playlists</span>
        </div>
    </header>

    <div class="create-pl-bar">
        <span style="font-size:13px; color:#aaa;">Your custom collections</span>
        <button class="btn-new-pl" onclick="createNewPlaylist()">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span>New playlist</span>
        </button>
    </div>

    <div class="pl-list" id="playlistsContainer">
        <!-- 1. Liked Videos Default Playlist -->
        <a href="liked-videos.html" class="pl-item">
            <div class="pl-thumb-box">
                <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600" alt="Liked Videos">
                <div class="pl-badge-count">
                    <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                    <span>Auto</span>
                </div>
            </div>
            <div class="pl-info">
                <div class="pl-name">Liked videos</div>
                <div class="pl-sub">Private • Auto Playlist</div>
            </div>
        </a>

        <!-- 2. Watch Later Default Playlist -->
        <a href="watch-later.html" class="pl-item">
            <div class="pl-thumb-box">
                <img src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800" alt="Watch Later">
                <div class="pl-badge-count">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.2 3.15.8-1.23-4.5-2.67z"/></svg>
                    <span>Auto</span>
                </div>
            </div>
            <div class="pl-info">
                <div class="pl-name">Watch later</div>
                <div class="pl-sub">Private • Save for later</div>
            </div>
        </a>

        <!-- Dynamic User Playlists Container -->
        <div id="userPlaylists"></div>
    </div>

    <!-- Navigation -->
    <nav class="bottom-nav">
        <a href="../frontend/index.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
        <a href="shorts.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg><span>Shorts</span></a>
        <a href="upload.html" class="nav-btn" style="color:#e50914;"><svg viewBox="0 0 24 24" style="fill:#e50914;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Create</span></a>
        <a href="subscriptions.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg><span>Subscriptions</span></a>
        <a href="profile.html" class="nav-btn active"><div style="width:20px; height:20px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff;">BT</div><span>You</span></a>
    </nav>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            renderStoredPlaylists();
        });

        function renderStoredPlaylists() {
            const list = JSON.parse(localStorage.getItem('btube_custom_playlists') || '[]');
            const container = document.getElementById('userPlaylists');
            container.innerHTML = '';

            list.forEach(p => {
                const item = document.createElement('div');
                item.className = 'pl-item';
                item.onclick = () => alert(`Opening playlist: ${p.title}`);
                item.innerHTML = `
                    <div class="pl-thumb-box">
                        <img src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800">
                        <div class="pl-badge-count">
                            <svg viewBox="0 0 24 24"><path d="M19 9H2v2h17V9zm0-4H2v2h17V5zM2 15h11v-2H2v2zm13-2v6l5-3-5-3z"/></svg>
                            <span>${p.count || 0}</span>
                        </div>
                    </div>
                    <div class="pl-info">
                        <div class="pl-name">${p.title}</div>
                        <div class="pl-sub">Custom • ${p.visibility || 'Public'}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function createNewPlaylist() {
            const name = prompt("Nayi Playlist ka naam likhein:");
            if (!name || !name.trim()) return;

            let list = JSON.parse(localStorage.getItem('btube_custom_playlists') || '[]');
            list.push({ title: name.trim(), count: 0, visibility: 'Public' });
            localStorage.setItem('btube_custom_playlists', JSON.stringify(list));
            renderStoredPlaylists();
        }
    </script>
</body>
</html>
