<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Create Short - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:50px; }
        .hdr { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid #222; position:sticky; top:0; background:#0f0f0f; z-index:10; }
        .hdr-left { display:flex; align-items:center; gap:16px; }
        .btn-back { background:none; border:none; color:#fff; cursor:pointer; }
        .btn-back svg { width:22px; height:22px; fill:#fff; }
        .btn-pub { background:#e50914; color:#fff; border:none; padding:8px 22px; border-radius:20px; font-weight:700; cursor:pointer; font-size:13px; }

        .container { padding:16px; max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
        .dropzone { border:2px dashed #e50914; border-radius:12px; padding:30px 16px; text-align:center; background:#141414; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px; }
        .dropzone svg { width:42px; height:42px; fill:#e50914; }

        .inp-grp { display:flex; flex-direction:column; gap:6px; }
        .inp-grp label { font-size:12px; color:#aaa; font-weight:600; }
        .inp-grp input { background:#181818; border:1px solid #333; border-radius:10px; padding:12px; color:#fff; font-size:14px; outline:none; }
        .inp-grp input:focus { border-color:#e50914; }
    </style>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>
    <header class="hdr">
        <div class="hdr-left">
            <button class="btn-back" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span style="font-size:17px; font-weight:700;">Create a Short</span>
        </div>
        <button class="btn-pub" id="btnPublish" onclick="publishShort()">Upload Short</button>
    </header>

    <div class="container">
        <div class="dropzone" onclick="document.getElementById('fileInp').click()">
            <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
            <span style="font-weight:700;" id="fileLabel">Select 9:16 Short Video</span>
            <span style="font-size:11px; color:#777;">Under 60 seconds</span>
            <input type="file" id="fileInp" accept="video/*" style="display:none;" onchange="onShortPicked(event)">
        </div>

        <div class="inp-grp">
            <label>Caption / Title</label>
            <input type="text" id="sTitle" placeholder="e.g. BTube Short Updates #shorts">
        </div>
    </div>

    <script>
        function onShortPicked(e) {
            const f = e.target.files[0];
            if (f) {
                document.getElementById('fileLabel').innerText = f.name;
                const t = document.getElementById('sTitle');
                if (!t.value) {
                    const clean = f.name.replace(/\.[^/.]+$/, "");
                    t.value = `${clean} #shorts`;
                }
            }
        }

        async function publishShort() {
            let title = document.getElementById('sTitle').value.trim() || 'BTube Short';
            if (!title.toLowerCase().includes('#short')) title += ' #shorts';

            const btn = document.getElementById('btnPublish');
            btn.disabled = true;
            btn.innerText = 'Publishing...';

            try {
                await window.BTubeAPI.saveVideo({
                    title: title,
                    name: title,
                    type: 'short',
                    videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
                    thumb: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600',
                    channel: 'BTube',
                    visibility: 'Public',
                    duration: '0:30'
                });

                alert('Short uploaded successfully!');
                window.location.href = 'your-videos.html?tab=shorts';
            } catch(e) {
                alert('Upload fail: ' + e.message);
                btn.disabled = false;
                btn.innerText = 'Upload Short';
            }
        }
    </script>
</body>
</html>
