<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>History - BTube</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            padding-bottom: 75px;
            overflow-x: hidden;
        }

        /* 1. TOP HEADER */
        .history-header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            background: #0f0f0f;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-back {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-back svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
        }

        .header-right-tools {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .tool-btn {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .tool-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* 2. IN-HISTORY SEARCH BOX */
        .history-search-row {
            padding: 10px 16px;
            display: none;
            background: #141414;
            border-bottom: 1px solid #222222;
        }

        .history-search-row.open {
            display: flex;
        }

        .search-inner-box {
            width: 100%;
            background: #222222;
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            height: 38px;
            gap: 10px;
        }

        .search-inner-box input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 13px;
        }

        .search-inner-box svg {
            width: 16px;
            height: 16px;
            fill: #888888;
        }

        /* 3. SECTION TIMELINE LABELS */
        .timeline-section-title {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            padding: 14px 16px 6px;
        }

        /* 4. HISTORY ITEMS FEED */
        .history-feed-list {
            display: flex;
            flex-direction: column;
        }

        .history-card-row {
            display: flex;
            align-items: flex-start;
            padding: 10px 16px;
            gap: 12px;
            text-decoration: none;
            color: #ffffff;
            transition: background 0.15s;
            position: relative;
            cursor: pointer;
        }

        .history-card-row:active {
            background: #181818;
        }

        .history-thumb-box {
            width: 130px;
            aspect-ratio: 16 / 9;
            background: #202020;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        .history-thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .duration-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.85);
            font-size: 10px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 4px;
        }

        .watch-progress-line {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: #e50914;
        }

        .history-details-col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .history-video-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .history-sub-meta {
            font-size: 11px;
            color: #aaaaaa;
        }

        .btn-more-card {
            background: none;
            border: none;
            color: #888888;
            cursor: pointer;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-more-card svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* 5. EMPTY STATE */
        .empty-history-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
            gap: 12px;
        }

        .empty-history-box svg {
            width: 56px;
            height: 56px;
            fill: #444444;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 700;
        }

        .empty-sub {
            font-size: 13px;
            color: #888888;
            max-width: 260px;
            line-height: 1.4;
        }

        .btn-explore {
            margin-top: 6px;
            background: #e50914;
            color: #fff;
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        /* 6. BOTTOM DRAWERS */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 2500;
            display: none;
            align-items: flex-end;
        }

        .drawer-overlay.open {
            display: flex;
        }

        .drawer-sheet-card {
            width: 100%;
            background: #212121;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.8);
        }

        .drawer-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid #2d2d2d;
            margin-bottom: 6px;
        }

        .drawer-title-txt {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85%;
        }

        .drawer-close-btn {
            background: none;
            border: none;
            color: #aaaaaa;
            font-size: 20px;
            cursor: pointer;
        }

        .drawer-row-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 6px;
            color: #ffffff;
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            border-radius: 8px;
            text-decoration: none;
        }

        .drawer-row-btn:active {
            background: #2a2a2a;
        }

        .drawer-row-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* Toast */
        .toast-pop {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(33, 33, 33, 0.95);
            border: 1px solid #444;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 3000;
            display: none;
        }

        /* 7. BOTTOM NAVIGATION */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 52px;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid #222;
            z-index: 1000;
        }

        .nav-tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #aaaaaa;
            text-decoration: none;
            gap: 2px;
        }

        .nav-tab-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-plus-circle {
            color: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .nav-plus-circle svg {
            width: 24px;
            height: 24px;
            fill: #e50914;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <!-- 1. TOP HEADER -->
    <header class="history-header">
        <div class="header-left">
            <button class="btn-back" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span class="header-title">History</span>
        </div>

        <div class="header-right-tools">
            <button class="tool-btn" onclick="toggleSearchRow()">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button class="tool-btn" onclick="openHistoryControlsDrawer()">
                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
    </header>

    <!-- 2. SEARCH IN HISTORY BAR -->
    <div class="history-search-row" id="searchRow">
        <div class="search-inner-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="histSearchInput" placeholder="Search watch history..." oninput="filterHistory(this.value)">
        </div>
    </div>

    <!-- 3. TIMELINE FEED -->
    <main class="history-feed-list" id="historyFeed"></main>

    <!-- 4. EMPTY HISTORY STATE -->
    <div class="empty-history-box" id="emptyState">
        <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        <span class="empty-title">This list has no videos</span>
        <span class="empty-sub">Videos that you watch on BTube will show up here.</span>
        <a href="../frontend/index.html" class="btn-explore">Explore videos</a>
    </div>

    <!-- 5. DRAWER: SINGLE ITEM OPTIONS -->
    <div class="drawer-overlay" id="itemDrawer" onclick="closeDrawerOnBackdrop(event, 'itemDrawer')">
        <div class="drawer-sheet-card">
            <div class="drawer-header-row">
                <span class="drawer-title-txt" id="itemDrawerTitle">Options</span>
                <button class="drawer-close-btn" onclick="closeDrawer('itemDrawer')">✕</button>
            </div>
            <button class="drawer-row-btn" onclick="removeFromHistory()">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                <span>Remove from watch history</span>
            </button>
            <button class="drawer-row-btn" onclick="saveToWatchLater()">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.48 10-10S17.5 2 12 2zm4.2 14.2L11 13V7h1.5v5.2l4.5 2.7-.8 1.3z"/></svg>
                <span>Save to Watch later</span>
            </button>
            <button class="drawer-row-btn" onclick="shareHistoryVideo()">
                <svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
                <span>Share</span>
            </button>
        </div>
    </div>

    <!-- 6. DRAWER: GLOBAL HISTORY CONTROLS -->
    <div class="drawer-overlay" id="historyControlsDrawer" onclick="closeDrawerOnBackdrop(event, 'historyControlsDrawer')">
        <div class="drawer-sheet-card">
            <div class="drawer-header-row">
                <span class="drawer-title-txt">History controls</span>
                <button class="drawer-close-btn" onclick="closeDrawer('historyControlsDrawer')">✕</button>
            </div>
            <button class="drawer-row-btn" onclick="clearAllHistory()" style="color:#ff4e4e;">
                <svg viewBox="0 0 24 24" style="fill:#ff4e4e;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                <span>Clear all watch history</span>
            </button>
            <button class="drawer-row-btn" onclick="togglePauseHistory()">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                <span id="pauseHistoryTxt">Pause watch history</span>
            </button>
        </div>
    </div>

    <!-- Toast Bubble -->
    <div class="toast-pop" id="histToast"></div>

    <!-- 7. BOTTOM NAVIGATION -->
    <nav class="bottom-nav-fixed">
        <a href="../frontend/index.html" class="nav-tab-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="shorts.html" class="nav-tab-item">
            <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
            <span>Shorts</span>
        </a>
        <a href="upload.html" class="nav-plus-circle">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </a>
        <a href="subscriptions.html" class="nav-tab-item">
            <svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg>
            <span>Subs</span>
        </a>
        <a href="profile.html" class="nav-tab-item active">
            <div style="width:20px; height:20px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff; overflow:hidden;" id="bottomNavInits">BT</div>
            <span>You</span>
        </a>
    </nav>

    <!-- INTERACTION SCRIPT -->
    <script>
        let currentActiveItem = null;
        let isHistoryPaused = false;
        let historyData = [];

        window.addEventListener('DOMContentLoaded', () => {
            syncNavAvatar();
            isHistoryPaused = localStorage.getItem('btube_pause_history') === 'true';
            updatePauseBtnText();
            loadHistoryFeed();
        });

        function syncNavAvatar() {
            const authUser = window.BTubeAPI ? window.BTubeAPI.getAuthUser() : JSON.parse(localStorage.getItem('btube_user') || 'null');
            const botAv = document.getElementById('bottomNavInits');
            if (authUser && botAv) {
                if (authUser.photo) {
                    botAv.innerHTML = `<img src="${authUser.photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                } else {
                    botAv.innerText = (authUser.name || 'BT').substring(0, 2).toUpperCase();
                }
            }
        }

        function showToast(msg) {
            const t = document.getElementById('histToast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        function getHistoryList() {
            return JSON.parse(localStorage.getItem('btube_watch_history') || '[]');
        }

        function loadHistoryFeed() {
            historyData = getHistoryList();
            renderHistoryItems(historyData);
        }

        function renderHistoryItems(items) {
            const container = document.getElementById('historyFeed');
            const empty = document.getElementById('emptyState');
            container.innerHTML = '';

            if (!items || items.length === 0) {
                container.style.display = 'none';
                empty.style.display = 'flex';
                return;
            }

            container.style.display = 'flex';
            empty.style.display = 'none';

            // Group by date (Today, Earlier)
            const now = Date.now();
            const oneDay = 24 * 60 * 60 * 1000;

            const todayItems = [];
            const earlierItems = [];

            items.forEach(item => {
                const age = now - (item.timestamp || now);
                if (age < oneDay) {
                    todayItems.push(item);
                } else {
                    earlierItems.push(item);
                }
            });

            if (todayItems.length > 0) {
                const lbl = document.createElement('div');
                lbl.className = 'timeline-section-title';
                lbl.innerText = 'Today';
                container.appendChild(lbl);
                todayItems.forEach(v => container.appendChild(createHistoryCard(v)));
            }

            if (earlierItems.length > 0) {
                const lbl = document.createElement('div');
                lbl.className = 'timeline-section-title';
                lbl.innerText = 'Earlier';
                container.appendChild(lbl);
                earlierItems.forEach(v => container.appendChild(createHistoryCard(v)));
            }
        }

        function createHistoryCard(v) {
            const row = document.createElement('div');
            row.className = 'history-card-row';
            row.setAttribute('data-id', v.id);
            row.setAttribute('data-title', (v.title || '').toLowerCase());

            const progressPct = v.progressPct || Math.floor(Math.random() * 40 + 40);

            row.innerHTML = `
                <div class="history-thumb-box" onclick="watchVideo('${v.id}', '${encodeURIComponent(v.videoUrl || '')}')">
                    <img src="${v.thumb || 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=400'}" alt="${v.title}">
                    <span class="duration-badge">${v.duration || '03:45'}</span>
                    <div class="watch-progress-line" style="width: ${progressPct}%;"></div>
                </div>
                <div class="history-details-col" onclick="watchVideo('${v.id}', '${encodeURIComponent(v.videoUrl || '')}')">
                    <div class="history-video-title">${v.title || 'Watched Video'}</div>
                    <span class="history-sub-meta">${v.channel || 'BTube Creator'} • ${v.views || 0} views</span>
                </div>
                <button class="btn-more-card" onclick="event.stopPropagation(); openCardDrawer('${v.id}', '${encodeURIComponent(v.title || '')}')">
                    <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </button>
            `;
            return row;
        }

        function watchVideo(id, encUrl) {
            window.location.href = `watch.html?id=${id}&videoUrl=${encUrl}`;
        }

        function toggleSearchRow() {
            const row = document.getElementById('searchRow');
            row.classList.toggle('open');
            if (row.classList.contains('open')) {
                document.getElementById('histSearchInput').focus();
            }
        }

        function filterHistory(query) {
            const q = query.toLowerCase().trim();
            const filtered = historyData.filter(v => (v.title || '').toLowerCase().includes(q));
            renderHistoryItems(filtered);
        }

        function openCardDrawer(itemId, title) {
            currentActiveItem = itemId;
            document.getElementById('itemDrawerTitle').innerText = decodeURIComponent(title);
            document.getElementById('itemDrawer').classList.add('open');
        }

        function openHistoryControlsDrawer() {
            document.getElementById('historyControlsDrawer').classList.add('open');
        }

        function closeDrawer(id) {
            document.getElementById(id).classList.remove('open');
        }

        function closeDrawerOnBackdrop(e, id) {
            if (e.target.id === id) closeDrawer(id);
        }

        function removeFromHistory() {
            if (currentActiveItem) {
                let list = getHistoryList();
                list = list.filter(v => v.id !== currentActiveItem);
                localStorage.setItem('btube_watch_history', JSON.stringify(list));
                showToast('Removed from watch history');
                loadHistoryFeed();
            }
            closeDrawer('itemDrawer');
        }

        function saveToWatchLater() {
            if (currentActiveItem) {
                let wl = JSON.parse(localStorage.getItem('btube_watch_later') || '[]');
                const item = historyData.find(v => v.id === currentActiveItem);
                if (item && !wl.some(w => w.id === item.id)) {
                    wl.unshift(item);
                    localStorage.setItem('btube_watch_later', JSON.stringify(wl));
                }
            }
            showToast('Saved to Watch later');
            closeDrawer('itemDrawer');
        }

        function shareHistoryVideo() {
            closeDrawer('itemDrawer');
            if (navigator.share) {
                navigator.share({ title: 'BTube Video', url: window.location.origin + '/pages/watch.html?id=' + currentActiveItem }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.origin + '/pages/watch.html?id=' + currentActiveItem);
                showToast('Link copied to clipboard');
            }
        }

        function clearAllHistory() {
            localStorage.removeItem('btube_watch_history');
            closeDrawer('historyControlsDrawer');
            showToast('Watch history cleared');
            loadHistoryFeed();
        }

        function togglePauseHistory() {
            isHistoryPaused = !isHistoryPaused;
            localStorage.setItem('btube_pause_history', isHistoryPaused);
            updatePauseBtnText();
            showToast(isHistoryPaused ? 'Watch history paused' : 'Watch history resumed');
            closeDrawer('historyControlsDrawer');
        }

        function updatePauseBtnText() {
            const txt = document.getElementById('pauseHistoryTxt');
            if (txt) {
                txt.innerText = isHistoryPaused ? 'Resume watch history' : 'Pause watch history';
            }
        }
    </script>
</body>
</html>
