<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>Notifications - BTube</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            padding-bottom: 70px;
            overflow-x: hidden;
        }

        /* 1. TOP HEADER */
        .notif-header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            background: #0f0f0f;
            z-index: 1000;
            border-bottom: 1px solid #1f1f1f;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-back-nav {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-back-nav svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .header-page-title {
            font-size: 19px;
            font-weight: 700;
        }

        .header-right-tools {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .tool-icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .tool-icon-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* 2. FILTER PILLS */
        .filter-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            position: sticky;
            top: 52px;
            background: #0f0f0f;
            z-index: 900;
        }

        .pill-btn {
            background: #272727;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .pill-btn.active {
            background: #ffffff;
            color: #0f0f0f;
            font-weight: 700;
        }

        /* 3. TIME SECTION HEADERS */
        .section-label {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            padding: 12px 16px 6px;
        }

        /* 4. NOTIFICATION ITEMS */
        .notif-feed-list {
            display: flex;
            flex-direction: column;
        }

        .notif-row-card {
            display: flex;
            align-items: flex-start;
            padding: 12px 16px;
            gap: 12px;
            text-decoration: none;
            color: #ffffff;
            transition: background 0.15s;
            position: relative;
            cursor: pointer;
        }

        .notif-row-card:active {
            background: #1c1c1c;
        }

        .notif-row-card.unread {
            background: rgba(62, 166, 255, 0.05);
        }

        .unread-indicator-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #3ea6ff;
            position: absolute;
            left: 5px;
            top: 24px;
        }

        .notif-avatar-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            flex-shrink: 0;
            overflow: hidden;
        }

        .notif-avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .notif-details {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .notif-text {
            font-size: 13px;
            line-height: 1.35;
            color: #e0e0e0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .notif-text b {
            color: #ffffff;
        }

        .notif-timestamp {
            font-size: 11px;
            color: #888888;
        }

        .notif-thumb-box {
            width: 68px;
            aspect-ratio: 16 / 9;
            background: #252525;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .notif-thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-item-more {
            background: none;
            border: none;
            color: #888888;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-item-more svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* 5. EMPTY STATE */
        .empty-notif-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 90px 24px;
            text-align: center;
            gap: 12px;
        }

        .empty-notif-box svg {
            width: 58px;
            height: 58px;
            fill: #444;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 700;
        }

        .empty-sub {
            font-size: 13px;
            color: #888888;
            max-width: 270px;
            line-height: 1.45;
        }

        /* 6. OPTIONS BOTTOM SHEET */
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            align-items: flex-end;
            z-index: 2500;
        }

        .sheet-backdrop.open {
            display: flex;
        }

        .bottom-panel-card {
            width: 100%;
            background: #1e1e1e;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .panel-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 6px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 700;
        }

        .panel-close-btn {
            background: none;
            border: none;
            color: #aaaaaa;
            font-size: 20px;
            cursor: pointer;
        }

        .panel-item-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 6px;
            color: #ffffff;
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            border-radius: 8px;
        }

        .panel-item-btn:active {
            background: #2a2a2a;
        }

        .panel-item-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* 7. BOTTOM NAVIGATION */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 52px;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid #222;
            z-index: 1000;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #aaaaaa;
            text-decoration: none;
            gap: 2px;
        }

        .nav-link svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-plus-circle {
            color: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .nav-plus-circle svg {
            width: 24px;
            height: 24px;
            fill: #e50914;
        }
    </style>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <!-- 1. TOP HEADER -->
    <header class="notif-header">
        <div class="header-left">
            <button class="btn-back-nav" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span class="header-page-title">Notifications</span>
        </div>

        <div class="header-right-tools">
            <a href="search.html" class="tool-icon-btn">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </a>
            <button class="tool-icon-btn" onclick="openGeneralSettings()">
                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
    </header>

    <!-- 2. FILTER PILLS -->
    <nav class="filter-row">
        <button class="pill-btn active" onclick="setNotifFilter('all', this)">All</button>
        <button class="pill-btn" onclick="setNotifFilter('mention', this)">Mentions</button>
    </nav>

    <!-- 3. NOTIFICATION LIST -->
    <main class="notif-feed-list" id="notifList"></main>

    <!-- 4. EMPTY NOTIFICATIONS STATE -->
    <div class="empty-notif-box" id="emptyNotifState">
        <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
        <div class="empty-title">Your notifications live here</div>
        <div class="empty-sub">Subscribe to your favorite channels to get notified about their latest uploads and community posts.</div>
    </div>

    <!-- 5. BOTTOM ACTION SHEET -->
    <div class="sheet-backdrop" id="optSheet" onclick="closeSheetOnBackdrop(event)">
        <div class="bottom-panel-card">
            <div class="panel-header-row">
                <span class="panel-title" id="sheetChannelTitle">Options</span>
                <button class="panel-close-btn" onclick="closeSheet()">✕</button>
            </div>
            <button class="panel-item-btn" onclick="hideCurrentNotif()">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z"/></svg>
                <span>Hide this notification</span>
            </button>
            <button class="panel-item-btn" onclick="turnOffChannelNotif()">
                <svg viewBox="0 0 24 24"><path d="M20 18.69L7.84 6.14 5.27 3.49 4 4.76l2.8 2.8v.01c-.52.99-.8 2.16-.8 3.43v5l-2 2v1h13.73l2.25 2.25 1.27-1.27-1.25-1.29zM12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6.19L18 11c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68c-.78.19-1.5.5-2.14.92L18 15.81z"/></svg>
                <span id="turnOffText">Turn off notifications from this channel</span>
            </button>
        </div>
    </div>

    <!-- 6. BOTTOM NAVIGATION -->
    <nav class="bottom-nav-fixed">
        <a href="../frontend/index.html" class="nav-link">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="shorts.html" class="nav-link">
            <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
            <span>Shorts</span>
        </a>
        <a href="upload.html" class="nav-plus-circle">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </a>
        <a href="subscriptions.html" class="nav-link">
            <svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg>
            <span>Subs</span>
        </a>
        <a href="profile.html" class="nav-link">
            <div style="width:20px; height:20px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff; overflow:hidden;" id="bottomNavInits">BT</div>
            <span>You</span>
        </a>
    </nav>

    <!-- LOGIC SCRIPT -->
    <script>
        let currentFilter = 'all';
        let currentTargetId = null;
        let notificationsData = [];

        window.addEventListener('DOMContentLoaded', async () => {
            syncNavAvatar();
            await loadNotifications();
        });

        function syncNavAvatar() {
            const authUser = window.BTubeAPI ? window.BTubeAPI.getAuthUser() : JSON.parse(localStorage.getItem('btube_user') || 'null');
            const botAv = document.getElementById('bottomNavInits');
            if (authUser && botAv) {
                if (authUser.photo) {
                    botAv.innerHTML = `<img src="${authUser.photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                } else {
                    botAv.innerText = (authUser.name || 'BT').substring(0, 2).toUpperCase();
                }
            }
        }

        async function loadNotifications() {
            notificationsData = JSON.parse(localStorage.getItem('btube_notifications') || '[]');

            // Sync with real newly uploaded videos if notifications store is empty
            if (notificationsData.length === 0 && window.BTubeAPI && typeof window.BTubeAPI.getFeed === 'function') {
                try {
                    const realFeed = await window.BTubeAPI.getFeed('all');
                    if (realFeed && realFeed.length > 0) {
                        notificationsData = realFeed.slice(0, 5).map(v => ({
                            id: 'notif_' + v.id,
                            videoId: v.id,
                            channel: v.channel || 'BTube Creator',
                            channelAvatar: v.channelAvatar || '',
                            title: v.title || 'New Upload',
                            thumb: v.thumb || '',
                            time: 'Recently',
                            unread: true,
                            type: 'video',
                            targetUrl: `watch.html?id=${v.id}&videoUrl=${encodeURIComponent(v.videoUrl || '')}`
                        }));
                        localStorage.setItem('btube_notifications', JSON.stringify(notificationsData));
                    }
                } catch(e) {}
            }

            renderNotifications();
        }

        function setNotifFilter(type, btn) {
            currentFilter = type;
            document.querySelectorAll('.pill-btn').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            renderNotifications();
        }

        function renderNotifications() {
            const list = document.getElementById('notifList');
            const empty = document.getElementById('emptyNotifState');
            list.innerHTML = '';

            let filtered = notificationsData;
            if (currentFilter !== 'all') {
                filtered = notificationsData.filter(n => n.type === currentFilter);
            }

            if (filtered.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'flex';
                return;
            }

            list.style.display = 'flex';
            empty.style.display = 'none';

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = `notif-row-card ${item.unread ? 'unread' : ''}`;
                card.setAttribute('data-id', item.id);
                card.onclick = () => openNotification(item);

                const avatarContent = item.channelAvatar 
                    ? `<img src="${item.channelAvatar}">` 
                    : (item.channel || 'BT').substring(0, 2).toUpperCase();

                card.innerHTML = `
                    ${item.unread ? '<div class="unread-indicator-dot"></div>' : ''}
                    <div class="notif-avatar-circle">${avatarContent}</div>
                    <div class="notif-details">
                        <div class="notif-text">
                            <b>${item.channel}</b> uploaded: ${item.title}
                        </div>
                        <span class="notif-timestamp">${item.time || 'Recently'}</span>
                    </div>
                    ${item.thumb ? `<div class="notif-thumb-box"><img src="${item.thumb}"></div>` : ''}
                    <button class="btn-item-more" onclick="event.stopPropagation(); openItemMenu('${item.id}', '${encodeURIComponent(item.channel || '')}')">
                        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                    </button>
                `;
                list.appendChild(card);
            });
        }

        function openNotification(item) {
            item.unread = false;
            localStorage.setItem('btube_notifications', JSON.stringify(notificationsData));
            window.location.href = item.targetUrl || `watch.html?id=${item.videoId || ''}`;
        }

        function openItemMenu(id, channelEnc) {
            currentTargetId = id;
            const channel = decodeURIComponent(channelEnc);
            document.getElementById('sheetChannelTitle').innerText = channel;
            document.getElementById('turnOffText').innerText = `Turn off notifications from ${channel}`;
            document.getElementById('optSheet').classList.add('open');
        }

        function closeSheet() {
            document.getElementById('optSheet').classList.remove('open');
        }

        function closeSheetOnBackdrop(e) {
            if (e.target.id === 'optSheet') closeSheet();
        }

        function hideCurrentNotif() {
            if (currentTargetId) {
                notificationsData = notificationsData.filter(n => n.id !== currentTargetId);
                localStorage.setItem('btube_notifications', JSON.stringify(notificationsData));
                renderNotifications();
            }
            closeSheet();
        }

        function turnOffChannelNotif() {
            hideCurrentNotif();
        }

        function openGeneralSettings() {
            document.getElementById('sheetChannelTitle').innerText = 'Settings';
            document.getElementById('turnOffText').innerText = 'Manage all notification preferences';
            document.getElementById('optSheet').classList.add('open');
        }
    </script>
</body>
</html>
