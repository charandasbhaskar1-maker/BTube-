<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Channel - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:70px; overflow-x:hidden; }

        .ch-header { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; position:sticky; top:0; background:#0f0f0f; z-index:100; border-bottom:1px solid #1a1a1a; }
        .hdr-left { display:flex; align-items:center; gap:16px; }
        .btn-icon { background:none; border:none; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .btn-icon svg { width:22px; height:22px; fill:#fff; }
        .hdr-title { font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
        .hdr-right { display:flex; align-items:center; gap:18px; }

        .channel-banner { width:100%; aspect-ratio:16/5; background:#1c1c1c; overflow:hidden; position:relative; }
        .channel-banner img { width:100%; height:100%; object-fit:cover; }
        .btn-edit-banner { position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.7); border:none; border-radius:50%; width:34px; height:34px; display:none; align-items:center; justify-content:center; cursor:pointer; }
        .btn-edit-banner svg { width:17px; height:17px; fill:#fff; }

        .channel-hero { padding:14px 16px 8px; display:flex; flex-direction:column; gap:10px; }
        .hero-top-row { display:flex; gap:14px; align-items:center; }
        .ch-avatar-lg { width:72px; height:72px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; color:#fff; overflow:hidden; flex-shrink:0; }
        .ch-avatar-lg img { width:100%; height:100%; object-fit:cover; }
        
        .ch-names { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
        .ch-title-wrap { display:flex; align-items:center; gap:6px; }
        .ch-title { font-size:22px; font-weight:800; }
        .badge-verified { width:16px; height:16px; fill:#aaa; display:none; }
        .ch-handle { font-size:13px; color:#aaa; font-weight:500; }
        .ch-sub-meta { font-size:12px; color:#aaa; margin-top:2px; }

        .ch-bio-row { font-size:12px; color:#aaa; line-height:1.4; display:flex; align-items:center; gap:4px; margin-top:2px; cursor:pointer; }
        .ch-bio-text { overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; color:#ccc; }
        .bio-more { color:#fff; font-weight:700; flex-shrink:0; }

        .btn-actions-grid { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
        .btn-row-2 { display:flex; gap:8px; }
        .btn-yt { flex:1; background:#222; color:#fff; border:none; padding:9px 12px; border-radius:20px; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; }
        .btn-yt:active { background:#333; }
        .btn-yt svg { width:18px; height:18px; fill:#fff; }

        .btn-subscribe-cta { width:100%; background:#fff; color:#0f0f0f; border:none; padding:10px 18px; border-radius:22px; font-size:14px; font-weight:700; cursor:pointer; display:none; }
        .btn-subscribe-cta.subscribed { background:#222; color:#aaa; }

        .tabs-bar { display:flex; border-bottom:1px solid #222; padding:0 8px; overflow-x:auto; scrollbar-width:none; position:sticky; top:52px; background:#0f0f0f; z-index:90; margin-top:6px; }
        .tabs-bar::-webkit-scrollbar { display:none; }
        .tab-item { padding:12px 14px; font-size:14px; font-weight:700; color:#aaa; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
        .tab-item.active { color:#fff; border-bottom-color:#fff; }

        .tab-pane { display:none; padding:12px 0; }
        .tab-pane.active { display:block; }

        .shelf-header { font-size:17px; font-weight:800; padding:0 16px 10px; }
        .for-you-carousel { display:flex; gap:12px; overflow-x:auto; padding:0 16px 16px; scrollbar-width:none; }
        .for-you-carousel::-webkit-scrollbar { display:none; }
        .fy-card { width:220px; flex-shrink:0; display:flex; flex-direction:column; gap:6px; cursor:pointer; }
        .fy-thumb { width:100%; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:#222; position:relative; }
        .fy-thumb img { width:100%; height:100%; object-fit:cover; }
        .fy-dur { position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,0.85); font-size:11px; font-weight:700; padding:1px 5px; border-radius:4px; }
        .fy-title { font-size:13px; font-weight:700; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }

        .video-feed-list { display:flex; flex-direction:column; gap:14px; }
        .v-item { display:flex; gap:12px; padding:0 16px; cursor:pointer; }
        .v-thumb { width:130px; aspect-ratio:16/9; border-radius:8px; overflow:hidden; background:#222; position:relative; flex-shrink:0; }
        .v-thumb img { width:100%; height:100%; object-fit:cover; }
        .v-dur { position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,0.8); font-size:10px; font-weight:700; padding:1px 4px; border-radius:3px; }
        
        .v-info { flex:1; display:flex; flex-direction:column; gap:3px; min-width:0; }
        .v-title { font-size:13px; font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
        .v-meta { font-size:11px; color:#888; }

        .shorts-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; padding:0 12px; }
        .s-card { aspect-ratio:9/16; border-radius:8px; overflow:hidden; position:relative; background:#222; cursor:pointer; }
        .s-card img { width:100%; height:100%; object-fit:cover; }
        .s-info { position:absolute; bottom:0; left:0; right:0; padding:8px 6px; background:linear-gradient(transparent, rgba(0,0,0,0.9)); display:flex; flex-direction:column; gap:2px; }
        .s-title { font-size:11px; font-weight:700; line-height:1.2; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
        .s-views { font-size:10px; color:#aaa; }

        .community-feed { display:flex; flex-direction:column; gap:12px; padding:0 16px; }
        .comm-post-card { background:#181818; border:1px solid #282828; border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
        .comm-author-row { display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700; }
        .comm-author-img { width:32px; height:32px; border-radius:50%; object-fit:cover; }
        .comm-text { font-size:14px; line-height:1.4; color:#eee; }

        .empty-channel { text-align:center; padding:40px 20px; color:#777; font-size:13px; }
        .empty-channel a { display:inline-block; margin-top:12px; background:#e50914; color:#fff; padding:9px 20px; border-radius:20px; text-decoration:none; font-weight:700; font-size:13px; }

        .bottom-nav { position:fixed; bottom:0; left:0; width:100%; height:52px; background:#0f0f0f; display:flex; align-items:center; justify-content:space-around; border-top:1px solid #222; z-index:1000; }
        .nav-btn { display:flex; flex-direction:column; align-items:center; font-size:10px; color:#aaa; text-decoration:none; gap:2px; }
        .nav-btn.active { color:#fff; font-weight:700; }
        .nav-btn svg { width:22px; height:22px; fill:currentColor; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <header class="ch-header">
        <div class="hdr-left">
            <button class="btn-icon" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span class="hdr-title" id="hdrChannelName">Channel</span>
        </div>
        <div class="hdr-right">
            <button class="btn-icon" onclick="shareChannel()">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            </button>
        </div>
    </header>

    <div class="channel-banner">
        <img id="chBannerImg" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200" alt="Banner">
        <button class="btn-edit-banner" id="bannerEditBtn" onclick="editBannerPrompt()">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
    </div>

    <div class="channel-hero">
        <div class="hero-top-row">
            <div class="ch-avatar-lg" id="chAvatar">BT</div>
            <div class="ch-names">
                <div class="ch-title-wrap">
                    <div class="ch-title" id="chMainTitle">Channel Name</div>
                    <svg class="badge-verified" id="badgeVerified" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                </div>
                <div class="ch-handle" id="chHandle">@handle</div>
                <div class="ch-sub-meta" id="chSubCount">0 subscribers • 0 videos</div>
            </div>
        </div>

        <div class="ch-bio-row" onclick="openBioPrompt()">
            <span class="ch-bio-text" id="chBio">Add a channel description...</span>
            <span class="bio-more">...more</span>
        </div>

        <!-- Mode 1: Channel Owner View (Analytics + Edit) -->
        <div class="btn-actions-grid" id="ownerActions">
            <div class="btn-row-2">
                <button class="btn-yt" onclick="window.location.href='analytics.html'">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                    <span>Analytics</span>
                </button>
                <button class="btn-yt" onclick="editChannelDetailsPrompt()">
                    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    <span>Edit channel</span>
                </button>
            </div>
            <button class="btn-yt" style="width:100%;" onclick="switchTab('community')">
                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                <span>Community</span>
            </button>
        </div>

        <!-- Mode 2: Other Viewers View (Subscribe Button) -->
        <button class="btn-subscribe-cta" id="btnSubscribe" onclick="toggleSubscribe()">Subscribe</button>
    </div>

    <div class="tabs-bar">
        <div class="tab-item active" onclick="switchTab('home')">Home</div>
        <div class="tab-item" onclick="switchTab('videos')">Videos</div>
        <div class="tab-item" onclick="switchTab('shorts')">Shorts</div>
        <div class="tab-item" onclick="switchTab('playlists')">Playlists</div>
        <div class="tab-item" onclick="switchTab('community')">Community</div>
    </div>

    <!-- 1. HOME -->
    <div class="tab-pane active" id="pane-home">
        <div id="forYouSection" style="display:none;">
            <div class="shelf-header">For you</div>
            <div class="for-you-carousel" id="forYouCarousel"></div>
        </div>
        <div style="padding:10px 16px 8px; font-size:16px; font-weight:800; color:#fff;">Uploads</div>
        <div class="video-feed-list" id="homeFeedList"></div>
    </div>

    <!-- 2. VIDEOS -->
    <div class="tab-pane" id="pane-videos">
        <div class="video-feed-list" id="videosOnlyList"></div>
    </div>

    <!-- 3. SHORTS -->
    <div class="tab-pane" id="pane-shorts">
        <div class="shorts-grid" id="shortsGridList"></div>
    </div>

    <!-- 4. PLAYLISTS -->
    <div class="tab-pane" id="pane-playlists">
        <div class="video-feed-list" id="playlistsPaneList"></div>
    </div>

    <!-- 5. COMMUNITY -->
    <div class="tab-pane" id="pane-community">
        <div style="padding: 0 16px 12px; display:flex; justify-content:flex-end;">
            <button class="btn-yt" style="max-width:140px;" onclick="promptPost()">+ Create post</button>
        </div>
        <div class="community-feed" id="communityFeedList">
            <div class="empty-channel"><p>No community posts yet.</p></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="../frontend/index.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
        <a href="shorts.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg><span>Shorts</span></a>
        <a href="upload.html" class="nav-btn" style="color:#e50914;"><svg viewBox="0 0 24 24" style="fill:#e50914;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Create</span></a>
        <a href="subscriptions.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg><span>Subscriptions</span></a>
        <a href="profile.html" class="nav-btn active"><div style="width:20px; height:20px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff;" id="navAvatar">BT</div><span>You</span></a>
    </nav>

    <script>
        let currentChannel = null;
        let isOwner = false;

        window.addEventListener('DOMContentLoaded', async () => {
            const authUser = window.BTubeAPI ? window.BTubeAPI.getAuthUser() : JSON.parse(localStorage.getItem('btube_user') || 'null');
            const activeCh = window.BTubeAPI ? await window.BTubeAPI.getActiveChannel() : null;

            // Check URL Params (Official channel or ID routing)
            const urlParams = new URLSearchParams(window.location.search);
            const isOfficialParam = urlParams.get('official') === 'true';

            let chName, chHandle, chAvatar, chBanner, chBio, chId;

            if (isOfficialParam) {
                chName = 'BTube Official';
                chHandle = '@btube';
                chAvatar = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=200';
                chBanner = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200';
                chBio = 'Welcome to the official BTube platform channel. Discover product updates, creator guidelines, and featured content.';
                chId = 'btube_official_channel';
                document.getElementById('badgeVerified').style.display = 'block';
                isOwner = false;
            } else {
                chName = activeCh ? activeCh.name : (authUser ? authUser.name : 'My Channel');
                chHandle = activeCh ? activeCh.handle : '@' + chName.toLowerCase().replace(/[^a-z0-9]/g, '');
                chAvatar = activeCh ? activeCh.avatar : (authUser ? authUser.photo : '');
                chBanner = activeCh?.banner || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200';
                chBio = activeCh?.bio || 'Welcome to my channel!';
                chId = activeCh?.id;
                isOwner = true;
            }

            currentChannel = { id: chId, name: chName, handle: chHandle, avatar: chAvatar, banner: chBanner, bio: chBio };

            // Apply Details
            document.getElementById('chMainTitle').innerText = chName;
            document.getElementById('hdrChannelName').innerText = chName;
            document.getElementById('chHandle').innerText = chHandle;
            document.getElementById('chBannerImg').src = chBanner;
            document.getElementById('chBio').innerText = chBio;

            // Owner UI toggles
            if (isOwner) {
                document.getElementById('bannerEditBtn').style.display = 'flex';
                document.getElementById('ownerActions').style.display = 'flex';
                document.getElementById('btnSubscribe').style.display = 'none';
            } else {
                document.getElementById('bannerEditBtn').style.display = 'none';
                document.getElementById('ownerActions').style.display = 'none';
                document.getElementById('btnSubscribe').style.display = 'block';
            }

            const avEl = document.getElementById('chAvatar');
            const navAv = document.getElementById('navAvatar');
            if (chAvatar) {
                avEl.innerHTML = `<img src="${chAvatar}">`;
                navAv.innerHTML = `<img src="${chAvatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            } else {
                const init = chName.substring(0, 2).toUpperCase();
                avEl.innerText = init;
                navAv.innerText = init;
            }

            // Real Firestore Videos for this channel
            let myItems = [];
            if (window.BTubeAPI) {
                const allItems = await window.BTubeAPI.getFeed('all');
                myItems = allItems.filter(v => v.channelId === chId || v.channel === chName);
            }

            document.getElementById('chSubCount').innerText = `${activeCh?.subscribers || 0} subscribers • ${myItems.length} videos`;

            const videosOnly = myItems.filter(i => (i.type || 'video').toLowerCase() === 'video');
            const shortsOnly = myItems.filter(i => (i.type || 'video').toLowerCase() === 'short');

            if (myItems.length > 0) {
                document.getElementById('forYouSection').style.display = 'block';
                renderForYouShelf(myItems);
            }

            renderVideosFeed('homeFeedList', myItems);
            renderVideosFeed('videosOnlyList', videosOnly);
            renderShortsGrid(shortsOnly);
            renderPlaylists();
            renderCommunityPosts();
        });

        function switchTab(name) {
            const tabs = document.querySelectorAll('.tab-item');
            const panes = document.querySelectorAll('.tab-pane');
            tabs.forEach(t => t.classList.remove('active'));
            panes.forEach(p => p.classList.remove('active'));

            const p = document.getElementById(`pane-${name}`);
            if (p) p.classList.add('active');

            const tabNames = ['home', 'videos', 'shorts', 'playlists', 'community'];
            const idx = tabNames.indexOf(name);
            if (idx !== -1 && tabs[idx]) tabs[idx].classList.add('active');
        }

        function renderForYouShelf(items) {
            const row = document.getElementById('forYouCarousel');
            row.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'fy-card';
                card.onclick = () => window.location.href = `watch.html?id=${item.id}&videoUrl=${encodeURIComponent(item.videoUrl || '')}`;
                card.innerHTML = `
                    <div class="fy-thumb">
                        <img src="${item.thumb || 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800'}">
                        <div class="fy-dur">${item.duration || '03:45'}</div>
                    </div>
                    <div class="fy-title">${item.title}</div>
                `;
                row.appendChild(card);
            });
        }

        function renderVideosFeed(elementId, items) {
            const box = document.getElementById(elementId);
            box.innerHTML = '';
            if (items.length === 0) {
                box.innerHTML = `
                    <div class="empty-channel">
                        <p>No videos uploaded yet.</p>
                        ${isOwner ? '<a href="upload.html">+ Upload a video</a>' : ''}
                    </div>
                `;
                return;
            }

            items.forEach(v => {
                const row = document.createElement('div');
                row.className = 'v-item';
                row.onclick = () => window.location.href = `watch.html?id=${v.id}&videoUrl=${encodeURIComponent(v.videoUrl || '')}`;
                row.innerHTML = `
                    <div class="v-thumb">
                        <img src="${v.thumb}">
                        <span class="v-dur">${v.duration || '03:45'}</span>
                    </div>
                    <div class="v-info">
                        <div class="v-title">${v.title}</div>
                        <div class="v-meta">${v.views || 0} views • ${v.type || 'video'}</div>
                    </div>
                `;
                box.appendChild(row);
            });
        }

        function renderShortsGrid(shorts) {
            const grid = document.getElementById('shortsGridList');
            grid.innerHTML = '';
            if (shorts.length === 0) {
                grid.innerHTML = `<div class="empty-channel" style="grid-column:1/-1;"><p>No shorts uploaded yet.</p>${isOwner ? '<a href="upload.html?type=short">+ Create Short</a>' : ''}</div>`;
                return;
            }

            shorts.forEach(s => {
                const card = document.createElement('div');
                card.className = 's-card';
                card.onclick = () => window.location.href = `shorts.html?id=${s.id}`;
                card.innerHTML = `
                    <img src="${s.thumb}">
                    <div class="s-info">
                        <div class="s-title">${s.title}</div>
                        <div class="s-views">${s.views || 0} views</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderPlaylists() {
            const list = document.getElementById('playlistsPaneList');
            const customPlaylists = JSON.parse(localStorage.getItem('btube_custom_playlists') || '[]');
            list.innerHTML = '';
            if (customPlaylists.length === 0) {
                list.innerHTML = `<div class="empty-channel"><p>No playlists created yet.</p><a href="playlists.html">+ Create playlist</a></div>`;
                return;
            }
            customPlaylists.forEach(p => {
                const row = document.createElement('div');
                row.className = 'v-item';
                row.onclick = () => window.location.href = 'playlists.html';
                row.innerHTML = `
                    <div class="v-thumb">
                        <img src="${p.thumb || 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800'}">
                        <span class="v-dur">${p.count || 0} vids</span>
                    </div>
                    <div class="v-info">
                        <div class="v-title">${p.title}</div>
                        <div class="v-meta">${p.visibility || 'Public'} • Playlist</div>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        function renderCommunityPosts() {
            const container = document.getElementById('communityFeedList');
            const posts = JSON.parse(localStorage.getItem(`btube_comm_${currentChannel.id}`) || '[]');
            if (posts.length === 0) {
                container.innerHTML = `<div class="empty-channel"><p>No community posts yet.</p></div>`;
                return;
            }
            container.innerHTML = '';
            posts.forEach(p => {
                const card = document.createElement('div');
                card.className = 'comm-post-card';
                card.innerHTML = `
                    <div class="comm-author-row">
                        <img class="comm-author-img" src="${currentChannel.avatar || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100'}">
                        <span>${currentChannel.name} • ${p.time || 'Recently'}</span>
                    </div>
                    <div class="comm-text">${p.text}</div>
                `;
                container.appendChild(card);
            });
        }

        function promptPost() {
            const text = prompt("Write your post for the community:");
            if (text && text.trim()) {
                const posts = JSON.parse(localStorage.getItem(`btube_comm_${currentChannel.id}`) || '[]');
                posts.unshift({ text: text.trim(), time: 'Just now' });
                localStorage.setItem(`btube_comm_${currentChannel.id}`, JSON.stringify(posts));
                renderCommunityPosts();
            }
        }

        function toggleSubscribe() {
            const btn = document.getElementById('btnSubscribe');
            if (btn.classList.contains('subscribed')) {
                btn.classList.remove('subscribed');
                btn.innerText = 'Subscribe';
            } else {
                btn.classList.add('subscribed');
                btn.innerText = 'Subscribed ✓';
            }
        }

        function editBannerPrompt() {
            const newBanner = prompt("Enter banner image URL:", document.getElementById('chBannerImg').src);
            if (newBanner && newBanner.trim()) {
                document.getElementById('chBannerImg').src = newBanner.trim();
                saveChannelField('banner', newBanner.trim());
            }
        }

        function editChannelDetailsPrompt() {
            const newName = prompt("Channel Name:", currentChannel.name);
            if (newName && newName.trim()) {
                const newHandle = prompt("Channel Handle:", currentChannel.handle);
                saveChannelField('name', newName.trim());
                if (newHandle) saveChannelField('handle', newHandle.trim());
                window.location.reload();
            }
        }

        function openBioPrompt() {
            if (!isOwner) return;
            const currentBio = document.getElementById('chBio').innerText;
            const newBio = prompt("Channel Description (About):", currentBio.startsWith('Add a') ? '' : currentBio);
            if (newBio !== null && newBio.trim()) {
                document.getElementById('chBio').innerText = newBio.trim();
                saveChannelField('bio', newBio.trim());
            }
        }

        function saveChannelField(field, value) {
            const u = window.BTubeAPI ? window.BTubeAPI.getAuthUser() : JSON.parse(localStorage.getItem('btube_user') || 'null');
            if (!u) return;
            let list = JSON.parse(localStorage.getItem('btube_channels_' + u.uid) || '[]');
            const activeId = localStorage.getItem('btube_active_channel_id_' + u.uid);
            const ch = list.find(c => c.id === activeId) || list[0];
            if (ch) {
                ch[field] = value;
                localStorage.setItem('btube_channels_' + u.uid, JSON.stringify(list));
            }
        }

        function shareChannel() {
            if (navigator.share) {
                navigator.share({ title: currentChannel.name, url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Channel link copied!");
            }
        }
    </script>
</body>
</html>
