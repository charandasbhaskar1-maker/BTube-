<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Channel - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:70px; overflow-x:hidden; }

        /* Top Header */
        .ch-header { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; position:sticky; top:0; background:#0f0f0f; z-index:100; border-bottom:1px solid #1a1a1a; }
        .hdr-left { display:flex; align-items:center; gap:16px; }
        .btn-icon { background:none; border:none; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .btn-icon svg { width:22px; height:22px; fill:#fff; }
        .hdr-title { font-size:17px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
        .hdr-right { display:flex; align-items:center; gap:16px; }

        /* Channel Banner */
        .channel-banner { width:100%; aspect-ratio:16/5; background:#222; overflow:hidden; position:relative; }
        .channel-banner img { width:100%; height:100%; object-fit:cover; }
        .btn-edit-banner { position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.65); border:none; border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .btn-edit-banner svg { width:16px; height:16px; fill:#fff; }

        /* Channel Info Hero */
        .channel-hero { padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
        .hero-top-row { display:flex; gap:14px; align-items:center; }
        .ch-avatar-lg { width:68px; height:68px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; color:#fff; overflow:hidden; flex-shrink:0; }
        .ch-avatar-lg img { width:100%; height:100%; object-fit:cover; }
        
        .ch-names { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
        .ch-title { font-size:20px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .ch-sub-meta { font-size:12px; color:#aaa; }
        .ch-bio { font-size:12px; color:#888; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; margin-top:2px; }

        /* Action Buttons */
        .action-row { display:flex; gap:8px; }
        .btn-ch-action { flex:1; background:#fff; color:#000; border:none; padding:10px; border-radius:22px; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
        .btn-ch-action.owner { background:#222; color:#fff; border:1px solid #333; }
        .btn-ch-action.subscribed { background:#222; color:#aaa; }

        /* Tabs Navigation Bar */
        .tabs-bar { display:flex; border-bottom:1px solid #222; padding:0 8px; overflow-x:auto; scrollbar-width:none; position:sticky; top:52px; background:#0f0f0f; z-index:90; }
        .tabs-bar::-webkit-scrollbar { display:none; }
        .tab-item { padding:12px 14px; font-size:14px; font-weight:700; color:#aaa; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
        .tab-item.active { color:#fff; border-bottom-color:#fff; }

        /* Tab Content Panes */
        .tab-pane { display:none; padding:12px 0; }
        .tab-pane.active { display:block; }

        /* Video List (Home / Videos Tab) */
        .video-feed-list { display:flex; flex-direction:column; gap:14px; }
        .v-item { display:flex; gap:12px; padding:0 16px; cursor:pointer; }
        .v-thumb { width:130px; aspect-ratio:16/9; border-radius:8px; overflow:hidden; background:#222; position:relative; flex-shrink:0; }
        .v-thumb img { width:100%; height:100%; object-fit:cover; }
        .v-dur { position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,0.8); font-size:10px; font-weight:700; padding:1px 4px; border-radius:3px; }
        
        .v-info { flex:1; display:flex; flex-direction:column; gap:3px; min-width:0; }
        .v-title { font-size:13px; font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
        .v-meta { font-size:11px; color:#888; }

        /* Shorts Grid (Shorts Tab) */
        .shorts-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; padding:0 12px; }
        .s-card { aspect-ratio:9/16; border-radius:8px; overflow:hidden; position:relative; background:#222; cursor:pointer; }
        .s-card img { width:100%; height:100%; object-fit:cover; }
        .s-info { position:absolute; bottom:0; left:0; right:0; padding:8px 6px; background:linear-gradient(transparent, rgba(0,0,0,0.85)); display:flex; flex-direction:column; gap:2px; }
        .s-title { font-size:11px; font-weight:700; line-height:1.2; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
        .s-views { font-size:10px; color:#aaa; }

        /* Playlists Grid (Playlists Tab) */
        .pl-channel-list { display:flex; flex-direction:column; gap:12px; }
        .pl-ch-row { display:flex; gap:12px; padding:0 16px; cursor:pointer; align-items:center; }
        .pl-ch-thumb { width:120px; aspect-ratio:16/9; border-radius:8px; overflow:hidden; background:#222; position:relative; flex-shrink:0; }
        .pl-ch-thumb img { width:100%; height:100%; object-fit:cover; }
        .pl-ch-badge { position:absolute; bottom:0; right:0; top:0; width:40%; background:rgba(0,0,0,0.8); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; font-weight:800; }
        .pl-ch-badge svg { width:14px; height:14px; fill:#fff; margin-bottom:2px; }

        .empty-channel { text-align:center; padding:50px 20px; color:#777; font-size:13px; }
        .empty-channel a { display:inline-block; margin-top:12px; background:#e50914; color:#fff; padding:9px 20px; border-radius:20px; text-decoration:none; font-weight:700; font-size:13px; }

        /* Bottom Nav */
        .bottom-nav { position:fixed; bottom:0; left:0; width:100%; height:52px; background:#0f0f0f; display:flex; align-items:center; justify-content:space-around; border-top:1px solid #222; z-index:1000; }
        .nav-btn { display:flex; flex-direction:column; align-items:center; font-size:10px; color:#aaa; text-decoration:none; gap:2px; }
        .nav-btn.active { color:#fff; font-weight:700; }
        .nav-btn svg { width:22px; height:22px; fill:currentColor; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <!-- Header -->
    <header class="ch-header">
        <div class="hdr-left">
            <button class="btn-icon" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span class="hdr-title" id="hdrChannelName">Channel</span>
        </div>
        <div class="hdr-right">
            <button class="btn-icon" onclick="alert('Searching channel...')">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button class="btn-icon" onclick="shareChannel()">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            </button>
        </div>
    </header>

    <!-- Banner with Edit Option -->
    <div class="channel-banner">
        <img id="chBannerImg" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200" alt="Banner">
        <button class="btn-edit-banner" id="btnEditBanner" onclick="changeBannerPrompt()" title="Edit Banner">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
    </div>

    <!-- Channel Details -->
    <div class="channel-hero">
        <div class="hero-top-row">
            <div class="ch-avatar-lg" id="chAvatar">BT</div>
            <div class="ch-names">
                <div class="ch-title" id="chMainTitle">Channel Name</div>
                <div class="ch-sub-meta" id="chHandleMeta">@handle • 0 subscribers • 0 videos</div>
                <div class="ch-bio" id="chBio">Welcome to my official BTube channel!</div>
            </div>
        </div>
        <div class="action-row">
            <button class="btn-ch-action owner" id="btnMainAction" onclick="handleMainAction()">Manage videos</button>
        </div>
    </div>

    <!-- Working Tabs Navigation -->
    <div class="tabs-bar">
        <div class="tab-item active" onclick="switchTab('home')">Home</div>
        <div class="tab-item" onclick="switchTab('videos')">Videos</div>
        <div class="tab-item" onclick="switchTab('shorts')">Shorts</div>
        <div class="tab-item" onclick="switchTab('playlists')">Playlists</div>
    </div>

    <!-- TAB 1: HOME PANE -->
    <div class="tab-pane active" id="pane-home">
        <div style="padding:0 16px 8px; font-size:14px; font-weight:800; color:#fff;">Uploads</div>
        <div class="video-feed-list" id="homeFeedList">
            <div class="empty-channel">Loading videos...</div>
        </div>
    </div>

    <!-- TAB 2: VIDEOS PANE -->
    <div class="tab-pane" id="pane-videos">
        <div class="video-feed-list" id="videosOnlyList">
            <div class="empty-channel">Loading regular videos...</div>
        </div>
    </div>

    <!-- TAB 3: SHORTS PANE -->
    <div class="tab-pane" id="pane-shorts">
        <div class="shorts-grid" id="shortsGridList">
            <!-- Shorts Grid Cards -->
        </div>
    </div>

    <!-- TAB 4: PLAYLISTS PANE -->
    <div class="tab-pane" id="pane-playlists">
        <div class="pl-channel-list" id="playlistsPaneList">
            <!-- Playlists rows -->
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="../frontend/index.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
        <a href="shorts.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg><span>Shorts</span></a>
        <a href="upload.html" class="nav-btn" style="color:#e50914;"><svg viewBox="0 0 24 24" style="fill:#e50914;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Create</span></a>
        <a href="subscriptions.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg><span>Subscriptions</span></a>
        <a href="profile.html" class="nav-btn active"><div style="width:20px; height:20px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff;" id="navAvatar">BT</div><span>You</span></a>
    </nav>

    <script>
        let currentChannel = null;
        let isOwner = true;
        let channelVideos = [];
        let channelShorts = [];

        window.addEventListener('DOMContentLoaded', async () => {
            const authUser = window.BTubeAPI.getAuthUser();
            const activeCh = await window.BTubeAPI.getActiveChannel();

            // Channel resolution
            const chName = activeCh ? activeCh.name : (authUser ? authUser.name : 'BTube Official');
            const chHandle = activeCh ? activeCh.handle : '@btube';
            const chAvatar = activeCh ? activeCh.avatar : (authUser ? authUser.photo : '');
            const chBanner = activeCh?.banner || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200';

            currentChannel = { name: chName, handle: chHandle, avatar: chAvatar, banner: chBanner, id: activeCh?.id };

            // Apply Basic Info
            document.getElementById('chMainTitle').innerText = chName;
            document.getElementById('hdrChannelName').innerText = chName;
            document.getElementById('chBannerImg').src = chBanner;

            const avEl = document.getElementById('chAvatar');
            const navAv = document.getElementById('navAvatar');
            if (chAvatar) {
                avEl.innerHTML = `<img src="${chAvatar}">`;
                navAv.innerHTML = `<img src="${chAvatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            } else {
                const init = chName.substring(0, 2).toUpperCase();
                avEl.innerText = init;
                navAv.innerText = init;
            }

            // Fetch Videos for this specific channel
            const allItems = await window.BTubeAPI.getFeed('all');
            const myItems = allItems.filter(v => v.channelId === activeCh?.id || v.channel === chName);

            channelVideos = myItems.filter(i => (i.type || 'video').toLowerCase() === 'video');
            channelShorts = myItems.filter(i => (i.type || 'video').toLowerCase() === 'short');

            document.getElementById('chHandleMeta').innerText = `${chHandle} • 0 subscribers • ${myItems.length} videos`;

            // Render all panes
            renderHomePane(myItems);
            renderVideosPane(channelVideos);
            renderShortsPane(channelShorts);
            renderPlaylistsPane();
        });

        // Tab Switching Logic
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab-item');
            const panes = document.querySelectorAll('.tab-pane');

            tabs.forEach(t => t.classList.remove('active'));
            panes.forEach(p => p.classList.remove('active'));

            const targetPane = document.getElementById(`pane-${tabName}`);
            if (targetPane) targetPane.classList.add('active');

            const index = ['home', 'videos', 'shorts', 'playlists'].indexOf(tabName);
            if (index !== -1 && tabs[index]) {
                tabs[index].classList.add('active');
            }
        }

        // 1. Render Home Pane
        function renderHomePane(items) {
            const box = document.getElementById('homeFeedList');
            box.innerHTML = '';

            if (items.length === 0) {
                box.innerHTML = `
                    <div class="empty-channel">
                        <p>No videos uploaded on this channel yet.</p>
                        <a href="upload.html">+ Upload a video</a>
                    </div>
                `;
                return;
            }

            items.forEach(v => {
                box.appendChild(createVideoRow(v));
            });
        }

        // 2. Render Videos Only Pane
        function renderVideosPane(videos) {
            const box = document.getElementById('videosOnlyList');
            box.innerHTML = '';

            if (videos.length === 0) {
                box.innerHTML = `
                    <div class="empty-channel">
                        <p>No regular videos uploaded yet.</p>
                        <a href="upload.html?type=video">+ Upload regular video</a>
                    </div>
                `;
                return;
            }

            videos.forEach(v => {
                box.appendChild(createVideoRow(v));
            });
        }

        // 3. Render Shorts Grid Pane
        function renderShortsPane(shorts) {
            const grid = document.getElementById('shortsGridList');
            grid.innerHTML = '';

            if (shorts.length === 0) {
                grid.innerHTML = `
                    <div class="empty-channel" style="grid-column: 1 / -1;">
                        <p>No shorts uploaded yet.</p>
                        <a href="upload.html?type=short">+ Create a Short</a>
                    </div>
                `;
                return;
            }

            shorts.forEach(s => {
                const card = document.createElement('div');
                card.className = 's-card';
                card.onclick = () => window.location.href = `shorts.html?id=${s.id}`;
                card.innerHTML = `
                    <img src="${s.thumb || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600'}">
                    <div class="s-info">
                        <div class="s-title">${s.title}</div>
                        <div class="s-views">${s.views || 0} views</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 4. Render Playlists Pane
        function renderPlaylistsPane() {
            const list = document.getElementById('playlistsPaneList');
            const customPlaylists = JSON.parse(localStorage.getItem('btube_custom_playlists') || '[]');

            list.innerHTML = `
                <!-- Liked Videos -->
                <div class="pl-ch-row" onclick="window.location.href='liked-videos.html'">
                    <div class="pl-ch-thumb">
                        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600">
                        <div class="pl-ch-badge">
                            <svg viewBox="0 0 24 24"><path d="M19 9H2v2h17V9zm0-4H2v2h17V5zM2 15h11v-2H2v2zm13-2v6l5-3-5-3z"/></svg>
                            <span>Auto</span>
                        </div>
                    </div>
                    <div>
                        <div style="font-size:14px; font-weight:700;">Liked videos</div>
                        <div style="font-size:12px; color:#888;">Auto playlist • Private</div>
                    </div>
                </div>

                <!-- Watch Later -->
                <div class="pl-ch-row" onclick="window.location.href='watch-later.html'">
                    <div class="pl-ch-thumb">
                        <img src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800">
                        <div class="pl-ch-badge">
                            <svg viewBox="0 0 24 24"><path d="M19 9H2v2h17V9zm0-4H2v2h17V5zM2 15h11v-2H2v2zm13-2v6l5-3-5-3z"/></svg>
                            <span>Auto</span>
                        </div>
                    </div>
                    <div>
                        <div style="font-size:14px; font-weight:700;">Watch later</div>
                        <div style="font-size:12px; color:#888;">Save for later • Private</div>
                    </div>
                </div>
            `;

            // Custom playlists
            customPlaylists.forEach(p => {
                const row = document.createElement('div');
                row.className = 'pl-ch-row';
                row.onclick = () => window.location.href = 'playlists.html';
                row.innerHTML = `
                    <div class="pl-ch-thumb">
                        <img src="${p.thumb || 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800'}">
                        <div class="pl-ch-badge">
                            <svg viewBox="0 0 24 24"><path d="M19 9H2v2h17V9zm0-4H2v2h17V5zM2 15h11v-2H2v2zm13-2v6l5-3-5-3z"/></svg>
                            <span>${p.count || 0}</span>
                        </div>
                    </div>
                    <div>
                        <div style="font-size:14px; font-weight:700;">${p.title}</div>
                        <div style="font-size:12px; color:#888;">${p.visibility || 'Public'} • Playlist</div>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        function createVideoRow(v) {
            const row = document.createElement('div');
            row.className = 'v-item';
            row.onclick = () => window.location.href = `watch.html?id=${v.id}&videoUrl=${encodeURIComponent(v.videoUrl || '')}`;
            row.innerHTML = `
                <div class="v-thumb">
                    <img src="${v.thumb}">
                    <span class="v-dur">${v.duration || '03:45'}</span>
                </div>
                <div class="v-info">
                    <div class="v-title">${v.title}</div>
                    <div class="v-meta">${v.views || 0} views • ${v.type || 'video'}</div>
                </div>
            `;
            return row;
        }

        function handleMainAction() {
            window.location.href = 'your-videos.html';
        }

        function changeBannerPrompt() {
            const newUrl = prompt("Enter new Channel Banner Image URL:", document.getElementById('chBannerImg').src);
            if (newUrl && newUrl.trim()) {
                document.getElementById('chBannerImg').src = newUrl.trim();
                if (currentChannel && currentChannel.id) {
                    const u = window.BTubeAPI.getAuthUser();
                    let list = JSON.parse(localStorage.getItem('btube_channels_' + u.uid) || '[]');
                    const ch = list.find(c => c.id === currentChannel.id);
                    if (ch) {
                        ch.banner = newUrl.trim();
                        localStorage.setItem('btube_channels_' + u.uid, JSON.stringify(list));
                    }
                }
                alert("Banner updated successfully!");
            }
        }

        function shareChannel() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({ title: currentChannel.name, url: url });
            } else {
                navigator.clipboard.writeText(url);
                alert("Channel link copied to clipboard!");
            }
        }
    </script>
</body>
</html>
