<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Channel - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:70px; }
        
        .ch-header { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; position:sticky; top:0; background:#0f0f0f; z-index:100; border-bottom:1px solid #222; }
        .hdr-left { display:flex; align-items:center; gap:16px; }
        .btn-back { background:none; border:none; color:#fff; cursor:pointer; display:flex; }
        .btn-back svg { width:22px; height:22px; fill:#fff; }

        /* Channel Banner & Profile */
        .banner-box { width:100%; height:110px; background:linear-gradient(45deg, #1f1f1f, #2c0b0e); position:relative; }
        .profile-section { padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
        .profile-row { display:flex; gap:14px; align-items:center; }
        .avatar-lg { width:64px; height:64px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; border:2px solid #0f0f0f; margin-top:-32px; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
        
        .info-col { flex:1; display:flex; flex-direction:column; gap:2px; }
        .ch-title { font-size:18px; font-weight:800; }
        .ch-handle { font-size:12px; color:#aaa; }
        .ch-stats { font-size:12px; color:#888; }

        .btn-action-row { display:flex; gap:8px; margin-top:4px; }
        .btn-pill { flex:1; background:#222; border:none; color:#fff; padding:8px 0; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer; text-align:center; text-decoration:none; }
        .btn-pill.primary { background:#fff; color:#000; }

        /* Tabs */
        .tabs-bar { display:flex; border-bottom:1px solid #222; overflow-x:auto; scrollbar-width:none; padding:0 8px; }
        .tabs-bar::-webkit-scrollbar { display:none; }
        .tab-item { background:none; border:none; color:#aaa; padding:12px 14px; font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap; }
        .tab-item.active { color:#fff; border-bottom:2px solid #fff; }

        /* Video List & Grid */
        .content-area { padding:12px 0; min-height:200px; }
        .v-card { display:flex; gap:12px; padding:10px 16px; border-bottom:1px solid #161616; cursor:pointer; }
        .v-thumb { width:120px; height:68px; border-radius:8px; background:#222; overflow:hidden; position:relative; flex-shrink:0; }
        .v-thumb img { width:100%; height:100%; object-fit:cover; }
        .dur-tag { position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,0.8); font-size:10px; font-weight:700; padding:1px 4px; border-radius:3px; }
        .v-info { flex:1; display:flex; flex-direction:column; justify-content:center; gap:4px; min-width:0; }
        .v-name { font-size:13px; font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
        .v-meta { font-size:11px; color:#888; }

        /* Shorts Grid */
        .shorts-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; padding:8px 16px; }
        .s-card { aspect-ratio:9/16; border-radius:8px; overflow:hidden; background:#222; position:relative; cursor:pointer; }
        .s-card img { width:100%; height:100%; object-fit:cover; }
        .s-title { position:absolute; bottom:6px; left:6px; right:6px; font-size:11px; font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,0.8); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

        .empty-state { text-align:center; padding:50px 16px; color:#666; font-size:13px; }

        /* Bottom Nav */
        .bottom-nav { position:fixed; bottom:0; left:0; width:100%; height:54px; background:#0f0f0f; display:flex; align-items:center; justify-content:space-around; border-top:1px solid #222; z-index:1000; }
        .nav-link { display:flex; flex-direction:column; align-items:center; font-size:10px; color:#aaa; text-decoration:none; gap:3px; }
        .nav-link.active { color:#fff; font-weight:700; }
        .nav-link svg { width:22px; height:22px; fill:currentColor; }
    </style>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <header class="ch-header">
        <div class="hdr-left">
            <button class="btn-back" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span style="font-size:17px; font-weight:700;" id="topChannelTitle">Channel</span>
        </div>
        <div>
            <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:#fff;"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>
    </header>

    <div class="banner-box"></div>

    <div class="profile-section">
        <div class="profile-row">
            <div class="avatar-lg" id="cAvatar">CB</div>
            <div class="info-col">
                <div class="ch-title" id="cName">Charandas Bhaskar</div>
                <div class="ch-handle">@charandasbhaskar • Official Channel</div>
                <div class="ch-stats"><span id="cSubCount">245</span> subscribers • <span id="cVidCount">0</span> videos</div>
            </div>
        </div>

        <div class="btn-action-row">
            <button class="btn-pill primary" id="btnSubscribe" onclick="toggleSub()">Subscribe</button>
            <a href="manage-channel.html" class="btn-pill">Manage Videos</a>
        </div>
    </div>

    <!-- Category Tabs -->
    <div class="tabs-bar">
        <button class="tab-item active" id="tabVideos" onclick="switchTab('video')">Videos</button>
        <button class="tab-item" id="tabShorts" onclick="switchTab('short')">Shorts</button>
        <button class="tab-item" id="tabPlaylists" onclick="switchTab('playlists')">Playlists</button>
        <button class="tab-item" id="tabAbout" onclick="switchTab('about')">About</button>
    </div>

    <div class="content-area" id="contentArea">
        <div class="empty-state">Loading real channel videos...</div>
    </div>

    <!-- Navigation Bar -->
    <nav class="bottom-nav">
        <a href="../frontend/index.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
        <a href="shorts.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg><span>Shorts</span></a>
        <a href="upload.html" class="nav-link" style="color:#e50914;"><svg viewBox="0 0 24 24" style="fill:#e50914;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Create</span></a>
        <a href="subscriptions.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg><span>Subscriptions</span></a>
        <a href="profile.html" class="nav-link active"><div style="width:20px; height:20px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff;">CB</div><span>You</span></a>
    </nav>

    <script>
        let currentTab = 'video';
        let channelVideos = [];

        window.addEventListener('DOMContentLoaded', async () => {
            const channelName = localStorage.getItem('btube_channel_name') || 'Charandas Bhaskar';
            document.getElementById('cName').innerText = channelName;
            document.getElementById('topChannelTitle').innerText = channelName;
            document.getElementById('cAvatar').innerText = channelName.substring(0,2).toUpperCase();

            await loadRealChannelContent();
        });

        async function loadRealChannelContent() {
            // Fetch directly from Firestore Cloud
            channelVideos = await window.BTubeAPI.getFeed('all');
            
            document.getElementById('cVidCount').innerText = channelVideos.length;
            renderView();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
            if (tab === 'video') document.getElementById('tabVideos').classList.add('active');
            if (tab === 'short') document.getElementById('tabShorts').classList.add('active');
            if (tab === 'playlists') document.getElementById('tabPlaylists').classList.add('active');
            if (tab === 'about') document.getElementById('tabAbout').classList.add('active');

            renderView();
        }

        function renderView() {
            const box = document.getElementById('contentArea');
            box.innerHTML = '';

            if (currentTab === 'video') {
                const list = channelVideos.filter(v => (v.type || 'video') === 'video');
                if (list.length === 0) {
                    box.innerHTML = `<div class="empty-state">Is channel par abhi koi Long Video nahi hai.</div>`;
                    return;
                }
                list.forEach(v => {
                    const row = document.createElement('div');
                    row.className = 'v-card';
                    row.onclick = () => window.location.href = `watch.html?id=${v.id}&videoUrl=${encodeURIComponent(v.videoUrl)}`;
                    row.innerHTML = `
                        <div class="v-thumb">
                            <img src="${v.thumb || 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800'}">
                            <span class="dur-tag">${v.duration || '03:45'}</span>
                        </div>
                        <div class="v-info">
                            <div class="v-name">${v.title}</div>
                            <div class="v-meta">${v.views || 0} views • Cloud Stream</div>
                        </div>
                    `;
                    box.appendChild(row);
                });
            } else if (currentTab === 'short') {
                const list = channelVideos.filter(v => (v.type || 'video') === 'short');
                if (list.length === 0) {
                    box.innerHTML = `<div class="empty-state">Is channel par abhi koi Short nahi hai.</div>`;
                    return;
                }
                const grid = document.createElement('div');
                grid.className = 'shorts-grid';
                list.forEach(s => {
                    const item = document.createElement('div');
                    item.className = 's-card';
                    item.onclick = () => window.location.href = `shorts.html?id=${s.id}`;
                    item.innerHTML = `
                        <img src="${s.thumb || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600'}">
                        <div class="s-title">${s.title}</div>
                    `;
                    grid.appendChild(item);
                });
                box.appendChild(grid);
            } else if (currentTab === 'about') {
                box.innerHTML = `
                    <div style="padding:16px; font-size:13px; line-height:1.6; color:#ccc;">
                        <strong>Description:</strong><br>
                        Official cultural & entertainment channel on BTube. Real-time powered by Firebase Cloud Firestore.
                    </div>
                `;
            } else {
                box.innerHTML = `<div class="empty-state">Playlists abhi khali hain.</div>`;
            }
        }

        function toggleSub() {
            const btn = document.getElementById('btnSubscribe');
            if (btn.innerText === 'Subscribe') {
                btn.innerText = 'Subscribed';
                btn.style.background = '#333';
                btn.style.color = '#fff';
            } else {
                btn.innerText = 'Subscribe';
                btn.style.background = '#fff';
                btn.style.color = '#000';
            }
        }
    </script>
</body>
</html>
