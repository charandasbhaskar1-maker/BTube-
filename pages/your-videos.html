<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>Your videos - BTube Studio</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:70px; overflow-x:hidden; }
        
        /* 1. TOP HEADER */
        .yv-header { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid #1f1f1f; position:sticky; top:0; background:#0f0f0f; z-index:100; }
        .header-left { display:flex; align-items:center; gap:16px; }
        .btn-back { background:none; border:none; color:#fff; cursor:pointer; display:flex; align-items:center; }
        .btn-back svg { width:22px; height:22px; fill:#fff; }
        .header-title { font-size:18px; font-weight:800; letter-spacing:-0.2px; }

        .btn-upload-top { background:#252525; border:1px solid #333; color:#fff; text-decoration:none; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:6px 12px; border-radius:18px; }
        .btn-upload-top svg { width:16px; height:16px; fill:#fff; }

        /* 2. CHANNEL SUMMARY BANNER */
        .channel-summary-card { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#141414; border-bottom:1px solid #1c1c1c; }
        .cs-left { display:flex; align-items:center; gap:12px; min-width:0; }
        .cs-avatar { width:40px; height:40px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; overflow:hidden; flex-shrink:0; }
        .cs-avatar img { width:100%; height:100%; object-fit:cover; }
        .cs-meta { display:flex; flex-direction:column; gap:2px; min-width:0; }
        .cs-name { font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .cs-stats { font-size:11px; color:#888; }

        /* 3. TABS BAR */
        .tabs-tray { display:flex; border-bottom:1px solid #1f1f1f; padding:0 16px; background:#0f0f0f; position:sticky; top:52px; z-index:90; }
        .tab-btn { background:none; border:none; color:#888; padding:12px 14px; font-size:13px; font-weight:700; cursor:pointer; position:relative; }
        .tab-btn.active { color:#fff; }
        .tab-btn.active::after { content:""; position:absolute; bottom:0; left:14px; right:14px; height:2px; background:#fff; border-radius:2px; }

        /* 4. VIDEO FEED LIST */
        .video-list { display:flex; flex-direction:column; min-height:260px; }
        .video-row-item { display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid #161616; align-items:flex-start; cursor:pointer; transition:background 0.15s; }
        .video-row-item:active { background:#161616; }
        
        .thumb-box { width:120px; height:68px; border-radius:8px; overflow:hidden; background:#222; position:relative; flex-shrink:0; }
        .thumb-box.is-short { width:56px; height:88px; }
        .thumb-box img { width:100%; height:100%; object-fit:cover; }
        .dur-badge { position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,0.85); font-size:10px; font-weight:700; padding:1px 5px; border-radius:3px; }

        .meta-box { flex:1; display:flex; flex-direction:column; gap:4px; min-width:0; }
        .title-text { font-size:13px; font-weight:600; line-height:1.35; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; color:#fff; }
        
        .badges-row { display:flex; align-items:center; gap:8px; font-size:11px; }
        .badge-vis { display:flex; align-items:center; gap:4px; font-weight:600; }
        .badge-vis.public { color:#2ecc71; }
        .badge-vis.unlisted { color:#3ea6ff; }
        .badge-vis.private { color:#e67e22; }

        .stats-sub { font-size:11px; color:#888; display:flex; align-items:center; gap:6px; }

        /* 3-Dots Action Button */
        .btn-menu-dots { background:none; border:none; padding:4px 6px; color:#aaa; cursor:pointer; flex-shrink:0; }
        .btn-menu-dots svg { width:18px; height:18px; fill:#aaa; }

        /* 5. YOUTUBE STUDIO ACTION SHEET */
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; display:none; align-items:flex-end; }
        .action-sheet { width:100%; background:#1f1f1f; border-top-left-radius:18px; border-top-right-radius:18px; padding:14px 18px 24px; display:flex; flex-direction:column; gap:4px; animation:slideUp 0.2s cubic-bezier(0,0,0.2,1); max-height:80vh; overflow-y:auto; }
        @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
        
        .sheet-drag { width:36px; height:4px; background:#444; border-radius:2px; margin:0 auto 10px; }
        .sheet-title-info { padding-bottom:12px; border-bottom:1px solid #2d2d2d; margin-bottom:4px; font-size:14px; font-weight:700; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

        .menu-opt-btn { display:flex; align-items:center; gap:16px; padding:12px 8px; background:none; border:none; color:#fff; font-size:14px; font-weight:600; cursor:pointer; border-radius:10px; text-decoration:none; text-align:left; }
        .menu-opt-btn:active { background:#2a2a2a; }
        .menu-opt-btn svg { width:20px; height:20px; fill:#fff; flex-shrink:0; }
        .menu-opt-btn.danger { color:#ff4e4e; }
        .menu-opt-btn.danger svg { fill:#ff4e4e; }

        .empty-hint { padding:60px 16px; text-align:center; color:#777; font-size:13px; display:flex; flex-direction:column; align-items:center; gap:10px; }

        /* 6. BOTTOM NAVIGATION */
        .bottom-nav-bar { position:fixed; bottom:0; left:0; width:100%; height:52px; background:#0f0f0f; display:flex; align-items:center; justify-content:space-around; border-top:1px solid #222; z-index:1000; }
        .nav-tab-item { display:flex; flex-direction:column; align-items:center; font-size:10px; color:#aaa; text-decoration:none; gap:2px; }
        .nav-tab-item.active { color:#fff; font-weight:700; }
        .nav-tab-item svg { width:22px; height:22px; fill:currentColor; }
    </style>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <!-- 1. TOP HEADER -->
    <header class="yv-header">
        <div class="header-left">
            <button class="btn-back" onclick="window.location.href='profile.html'">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span class="header-title">Your videos</span>
        </div>
        <a href="upload.html" class="btn-upload-top">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span>Create</span>
        </a>
    </header>

    <!-- 2. CHANNEL SUMMARY CARD -->
    <section class="channel-summary-card">
        <div class="cs-left">
            <div class="cs-avatar" id="channelAvatar">BT</div>
            <div class="cs-meta">
                <span class="cs-name" id="channelName">Active Channel</span>
                <span class="cs-stats" id="channelStats">0 total uploads</span>
            </div>
        </div>
    </section>

    <!-- 3. TABS TRAY -->
    <div class="tabs-tray">
        <button class="tab-btn active" id="btnVideosTab" onclick="setTab('video')">Videos (<span id="cVideos">0</span>)</button>
        <button class="tab-btn" id="btnShortsTab" onclick="setTab('short')">Shorts (<span id="cShorts">0</span>)</button>
        <button class="tab-btn" id="btnLiveTab" onclick="setTab('live')">Live (0)</button>
    </div>

    <!-- 4. VIDEO LIST CONTAINER -->
    <main class="video-list" id="listContainer">
        <div class="empty-hint">Loading your uploads...</div>
    </main>

    <!-- 5. YOUTUBE STUDIO ACTION SHEET (PLAY / EDIT / SHARE / DELETE) -->
    <div class="modal-overlay" id="actionModal" onclick="closeMenu(event)">
        <div class="action-sheet" onclick="event.stopPropagation()">
            <div class="sheet-drag"></div>
            <div class="sheet-title-info" id="sheetVideoTitle">Video Title</div>
            
            <!-- Play Video -->
            <button class="menu-opt-btn" onclick="playSelected()">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span>Play video</span>
            </button>

            <!-- Edit Video / Metadata -->
            <button class="menu-opt-btn" onclick="goToEdit()">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                <span>Edit video</span>
            </button>

            <!-- Share Video -->
            <button class="menu-opt-btn" onclick="shareCurrent()">
                <svg viewBox="0 0 24 24"><path d="M11.73 3L5.8 8.94l5.93 5.93v-3.95c4.78 0 8.12 1.53 10.51 4.93-.95-4.78-3.82-9.56-10.51-10.9V3z"/></svg>
                <span>Share</span>
            </button>

            <!-- Delete Video -->
            <button class="menu-opt-btn danger" onclick="deleteCurrentVideo()">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                <span>Delete video</span>
            </button>
        </div>
    </div>

    <!-- 6. BOTTOM NAVIGATION -->
    <nav class="bottom-nav-bar">
        <a href="../frontend/index.html" class="nav-tab-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
        <a href="shorts.html" class="nav-tab-item"><svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg><span>Shorts</span></a>
        <a href="upload.html" class="nav-tab-item" style="color:#e50914;"><svg viewBox="0 0 24 24" style="fill:#e50914;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Create</span></a>
        <a href="subscriptions.html" class="nav-tab-item"><svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg><span>Subscriptions</span></a>
        <a href="profile.html" class="nav-tab-item active"><div style="width:20px; height:20px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff; overflow:hidden;" id="bottomNavAvatar">BT</div><span>You</span></a>
    </nav>

    <script>
        let currentTabMode = 'video';
        let channelUploads = [];
        let activeSelectedVideo = null;
        let activeChannel = null;
        let authUser = null;

        window.addEventListener('DOMContentLoaded', async () => {
            syncNavAvatar();
            await syncChannelIdentity();

            const params = new URLSearchParams(window.location.search);
            if (params.get('tab') === 'shorts') currentTabMode = 'short';

            await loadChannelUploads();
        });

        function syncNavAvatar() {
            authUser = window.BTubeAPI ? window.BTubeAPI.getAuthUser() : JSON.parse(localStorage.getItem('btube_user') || 'null');
            const botAv = document.getElementById('bottomNavAvatar');
            if (authUser && botAv) {
                if (authUser.photo) {
                    botAv.innerHTML = `<img src="${authUser.photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                } else {
                    botAv.innerText = (authUser.name || 'BT').substring(0, 2).toUpperCase();
                }
            }
        }

        async function syncChannelIdentity() {
            if (window.BTubeAPI && typeof window.BTubeAPI.getActiveChannel === 'function') {
                activeChannel = await window.BTubeAPI.getActiveChannel();
            }

            const name = activeChannel?.name || authUser?.name || 'My Channel';
            const avatar = activeChannel?.avatar || authUser?.photo;

            document.getElementById('channelName').innerText = name;
            const av = document.getElementById('channelAvatar');
            if (avatar) {
                av.innerHTML = `<img src="${avatar}">`;
            } else {
                av.innerText = name.substring(0, 2).toUpperCase();
            }
        }

        async function loadChannelUploads() {
            let allFeed = [];
            if (window.BTubeAPI && typeof window.BTubeAPI.getFeed === 'function') {
                try {
                    allFeed = await window.BTubeAPI.getFeed('all');
                } catch(e) {
                    allFeed = [];
                }
            }

            if (allFeed.length === 0) {
                allFeed = JSON.parse(localStorage.getItem('btube_feed_videos') || '[]');
            }

            const activeName = (activeChannel?.name || authUser?.name || '').toLowerCase();
            const activeId = activeChannel?.id || '';

            // Filter uploads belonging to active creator or active channel
            channelUploads = allFeed.filter(v => {
                if (!activeName && !activeId) return true;
                const matchId = activeId && (v.channelId === activeId);
                const matchName = activeName && ((v.channel || '').toLowerCase() === activeName);
                return matchId || matchName || (v.author === activeName);
            });

            // If empty, fallback to showing full user uploads ledger
            if (channelUploads.length === 0 && allFeed.length > 0) {
                channelUploads = allFeed;
            }

            const vList = channelUploads.filter(i => (i.type || 'video') === 'video');
            const sList = channelUploads.filter(i => (i.type || 'video') === 'short');

            document.getElementById('cVideos').innerText = vList.length;
            document.getElementById('cShorts').innerText = sList.length;
            document.getElementById('channelStats').innerText = `${channelUploads.length} total uploads`;

            renderList();
        }

        function setTab(mode) {
            currentTabMode = mode;
            document.getElementById('btnVideosTab').classList.toggle('active', mode === 'video');
            document.getElementById('btnShortsTab').classList.toggle('active', mode === 'short');
            document.getElementById('btnLiveTab').classList.toggle('active', mode === 'live');
            renderList();
        }

        function renderList() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';

            if (currentTabMode === 'live') {
                container.innerHTML = `
                    <div class="empty-hint">
                        <svg viewBox="0 0 24 24" style="width:48px;height:48px;fill:#444;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
                        <strong>No live streams scheduled</strong>
                        <span style="font-size:12px;color:#888;">Go live to interact with your viewers in real-time.</span>
                        <a href="go-live.html" style="background:#e50914;color:#fff;padding:8px 18px;border-radius:18px;text-decoration:none;font-weight:700;font-size:12px;margin-top:6px;">Go Live</a>
                    </div>
                `;
                return;
            }

            const list = channelUploads.filter(i => (i.type || 'video') === currentTabMode);

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="empty-hint">
                        <svg viewBox="0 0 24 24" style="width:48px;height:48px;fill:#444;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                        <strong>No ${currentTabMode === 'short' ? 'Shorts' : 'videos'} uploaded yet</strong>
                        <span style="font-size:12px;color:#888;">Upload your first media to start building your audience.</span>
                        <a href="upload.html" style="background:#e50914;color:#fff;padding:8px 18px;border-radius:18px;text-decoration:none;font-weight:700;font-size:12px;margin-top:6px;">+ Upload</a>
                    </div>
                `;
                return;
            }

            list.forEach(item => {
                const isShort = (item.type === 'short');
                const safeTitle = item.title || item.name || 'Untitled Content';
                const vis = item.visibility || 'Public';
                const visClass = vis.toLowerCase();

                const row = document.createElement('div');
                row.className = 'video-row-item';

                row.innerHTML = `
                    <div class="thumb-box ${isShort ? 'is-short' : ''}" onclick="openPlayer('${item.id}', '${item.type}', '${encodeURIComponent(item.videoUrl || '')}')">
                        <img src="${item.thumb || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800'}" alt="${safeTitle}">
                        ${!isShort ? `<span class="dur-badge">${item.duration || '03:45'}</span>` : ''}
                    </div>
                    <div class="meta-box" onclick="openPlayer('${item.id}', '${item.type}', '${encodeURIComponent(item.videoUrl || '')}')">
                        <div class="title-text">${safeTitle}</div>
                        <div class="badges-row">
                            <span class="badge-vis ${visClass}">● ${vis}</span>
                        </div>
                        <div class="stats-sub">
                            <span>${item.views || 0} views</span> • <span>${item.likes || 0} likes</span>
                        </div>
                    </div>
                    <button class="btn-menu-dots" onclick="openMenu(event, '${item.id}', '${safeTitle.replace(/'/g, "\\'")}', '${encodeURIComponent(item.videoUrl || '')}', '${item.type || 'video'}')">
                        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                    </button>
                `;
                container.appendChild(row);
            });
        }

        function openPlayer(id, type, vUrl) {
            if (type === 'short') {
                window.location.href = `shorts.html?id=${id}`;
            } else {
                window.location.href = `watch.html?id=${id}&videoUrl=${vUrl}`;
            }
        }

        /* YouTube Studio 3-Dots Action Sheet Handlers */
        function openMenu(e, id, title, vUrl, type) {
            e.stopPropagation();
            activeSelectedVideo = { id, title, vUrl, type };
            document.getElementById('sheetVideoTitle').innerText = title;
            document.getElementById('actionModal').style.display = 'flex';
        }

        function closeMenu(e) {
            if (!e || e.target.id === 'actionModal') {
                document.getElementById('actionModal').style.display = 'none';
            }
        }

        function playSelected() {
            if (activeSelectedVideo) {
                openPlayer(activeSelectedVideo.id, activeSelectedVideo.type, activeSelectedVideo.vUrl);
            }
        }

        function goToEdit() {
            if (activeSelectedVideo) {
                window.location.href = `edit-video.html?id=${activeSelectedVideo.id}`;
            }
        }

        function shareCurrent() {
            if (activeSelectedVideo) {
                const targetPage = activeSelectedVideo.type === 'short' ? 'shorts.html' : 'watch.html';
                const link = `${window.location.origin}/pages/${targetPage}?id=${activeSelectedVideo.id}`;
                if (navigator.share) {
                    navigator.share({ title: activeSelectedVideo.title, url: link }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(link);
                    alert('Video link copied to clipboard!');
                }
                document.getElementById('actionModal').style.display = 'none';
            }
        }

        async function deleteCurrentVideo() {
            if (!activeSelectedVideo) return;
            const ok = confirm(`Delete "${activeSelectedVideo.title}" permanently? This action cannot be undone.`);
            if (!ok) return;

            try {
                // 1. Cloud Firestore Deletion if Firebase is initialized
                if (window.firebase && window.firebase.firestore) {
                    await firebase.firestore().collection('videos').doc(activeSelectedVideo.id).delete();
                }

                // 2. LocalStorage Fallback Deletion
                let localList = JSON.parse(localStorage.getItem('btube_feed_videos') || '[]');
                localList = localList.filter(v => v.id !== activeSelectedVideo.id);
                localStorage.setItem('btube_feed_videos', JSON.stringify(localList));

                document.getElementById('actionModal').style.display = 'none';
                alert('Video deleted successfully ✓');
                await loadChannelUploads();
            } catch(e) {
                alert('Deletion error: ' + e.message);
            }
        }
    </script>
</body>
</html>
