
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>Your videos - BTube</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0f0f0f;color:#fff;padding-bottom:75px}
button,a{cursor:pointer}
.header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#0f0f0f;border-bottom:1px solid #292929;z-index:10}
.header-left{display:flex;align-items:center;gap:18px}
.header button,.icon-btn{background:none;border:0;color:white;font-size:23px}
.header h1{font-size:18px}
.header-actions{display:flex;gap:18px}
.header-actions a{color:#fff;text-decoration:none;font-size:25px}
.tabs{display:flex;gap:0;border-bottom:1px solid #292929;padding:0 12px;position:sticky;top:54px;background:#0f0f0f;z-index:9}
.tab{background:none;border:0;color:#aaa;padding:15px 14px;font-size:14px;font-weight:bold;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:#fff;border-bottom-color:#fff}
.video-list{display:flex;flex-direction:column}
.video-row{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #202020;min-width:0}
.thumb{position:relative;flex:0 0 124px;height:75px;background:#252525;border-radius:7px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.play-mark{position:absolute;inset:0;display:grid;place-items:center;background:#0002;font-size:24px}
.meta{flex:1;min-width:0;cursor:pointer}
.title{font-size:14px;line-height:1.4;font-weight:600;overflow-wrap:anywhere;margin-bottom:7px}
.badges{display:flex;flex-wrap:wrap;gap:7px;font-size:11px;color:#aaa;margin-bottom:6px}
.visibility{color:#ddd}
.stats{font-size:11px;color:#888;line-height:1.5}
.more{background:none;border:0;color:#aaa;font-size:22px;padding:0 4px;align-self:flex-start}
.empty{text-align:center;padding:65px 24px;color:#aaa;line-height:1.8}
.empty strong{display:block;color:white;font-size:17px;margin-bottom:8px}
.empty button{margin-top:16px;background:#fff;color:#111;border:0;border-radius:20px;padding:10px 18px;font-weight:bold}
.backdrop{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:30}
.sheet{background:#202020;border-radius:18px 18px 0 0;width:100%;padding:20px;display:flex;flex-direction:column;gap:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:14px;color:#aaa;overflow-wrap:anywhere;padding-bottom:12px}
.option{display:block;background:none;border:0;color:#fff;text-align:left;padding:13px 0;font-size:15px}
.option.delete{color:#ff6666}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;padding-bottom:env(safe-area-inset-bottom);background:#0f0f0f;border-top:1px solid #292929;display:flex;justify-content:space-around;align-items:center;z-index:15}
.bottom-nav a{flex:1;text-decoration:none;color:#aaa;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:10px;height:100%}
.bottom-nav a.active{color:#fff}
.nav-icon{font-size:21px}
@media(min-width:700px){.video-list{max-width:850px}.video-row{padding:16px}.thumb{flex-basis:160px;height:90px}}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <button aria-label="Back" onclick="history.length>1?history.back():location.href='../frontend/index.html'">←</button>
    <h1>Your videos</h1>
  </div>
  <div class="header-actions">
    <a href="upload-video.html" aria-label="Upload video">＋</a>
  </div>
</header>

<nav class="tabs" aria-label="Content type">
  <button class="tab active" id="videosTab" onclick="switchTab('video')">Videos (<span id="videoCount">0</span>)</button>
  <button class="tab" id="shortsTab" onclick="switchTab('short')">Shorts (<span id="shortCount">0</span>)</button>
</nav>

<main class="video-list" id="list" aria-live="polite"></main>

<div class="backdrop" id="backdrop" onclick="closeDrawer()">
  <section class="sheet" onclick="event.stopPropagation()">
    <h3 id="selectedTitle">Content actions</h3>
    <button class="option" onclick="editSelected()">✎ &nbsp; Edit details</button>
    <button class="option" onclick="playSelected()">▶ &nbsp; Play on Watch page</button>
    <button class="option delete" onclick="deleteSelected()">▤ &nbsp; Delete</button>
    <button class="option" onclick="closeDrawer()">Cancel</button>
  </section>
</div>

<nav class="bottom-nav">
  <a href="../frontend/index.html"><span class="nav-icon">⌂</span>Home</a>
  <a href="shorts.html"><span class="nav-icon">▷</span>Shorts</a>
  <a href="upload-video.html"><span class="nav-icon">＋</span>Create</a>
  <a href="your-videos.html" class="active"><span class="nav-icon">▤</span>Your videos</a>
</nav>

<script>
"use strict";

const VIDEO_KEY = "btube_videos";
const SHORT_KEY = "btube_shorts";
const LEGACY_KEY = "btube_user_videos";

let activeType = "video";
let selectedId = null;
let selectedType = "video";

const samples = [
  {
    id: "vid_1",
    title: "Chhattisgarhi song maya ke rang",
    duration: "05:42",
    views: "210K",
    age: "2 weeks ago",
    visibility: "Public",
    restriction: "None",
    thumb: "https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800",
    videoUrl: "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
    type: "video"
  },
  {
    id: "vid_2",
    title: "Music and lifestyle video",
    duration: "14:10",
    views: "45K",
    age: "1 month ago",
    visibility: "Public",
    restriction: "None",
    thumb: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800",
    videoUrl: "https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
    type: "video"
  }
];

function readArray(key) {
  try {
    const value = JSON.parse(localStorage.getItem(key) || "[]");
    return Array.isArray(value) ? value : [];
  } catch (error) {
    console.error("BTube storage read error:", key, error);
    return [];
  }
}

function writeArray(key, items) {
  try {
    localStorage.setItem(key, JSON.stringify(items));
    return true;
  } catch (error) {
    alert("डेटा सेव नहीं हुआ। ब्राउज़र की storage space जाँचें।");
    console.error(error);
    return false;
  }
}

function normalize(item, type) {
  return {
    ...item,
    id: String(item.id || (
      type + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8)
    )),
    type,
    title: String(item.title || "Untitled"),
    videoUrl: String(item.videoUrl || item.video_url || item.url || ""),
    thumb: String(item.thumb || item.thumbnail || ""),
    duration: item.duration || "",
    views: item.views ?? "0",
    age: item.age || "अभी अपलोड किया",
    visibility: String(item.visibility || "Public"),
    restriction: item.restriction || "None"
  };
}

function initializeStorage() {
  if (localStorage.getItem(VIDEO_KEY) === null) {
    const legacy = readArray(LEGACY_KEY);
    const oldVideos = legacy.filter(v => v.type !== "short")
      .map(v => normalize(v, "video"));

    writeArray(VIDEO_KEY, oldVideos.length ? oldVideos : samples);
  }

  if (localStorage.getItem(SHORT_KEY) === null) {
    const legacy = readArray(LEGACY_KEY);
    const oldShorts = legacy.filter(v => v.type === "short")
      .map(v => normalize(v, "short"));

    writeArray(SHORT_KEY, oldShorts);
  }
}

function storageKey(type) {
  return type === "short" ? SHORT_KEY : VIDEO_KEY;
}

function getItems(type) {
  return readArray(storageKey(type)).map(item => normalize(item, type));
}

function safeImageUrl(value) {
  try {
    const url = new URL(value, location.href);
    return ["https:", "http:"].includes(url.protocol) ? url.href : "";
  } catch {
    return "";
  }
}

function switchTab(type) {
  activeType = type === "short" ? "short" : "video";
  document.getElementById("videosTab").classList.toggle("active", activeType === "video");
  document.getElementById("shortsTab").classList.toggle("active", activeType === "short");
  render();
}

function makeText(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  element.textContent = text;
  return element;
}

function render() {
  const videos = getItems("video");
  const shorts = getItems("short");

  document.getElementById("videoCount").textContent = videos.length;
  document.getElementById("shortCount").textContent = shorts.length;

  const items = activeType === "short" ? shorts : videos;
  const list = document.getElementById("list");
  list.replaceChildren();

  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.append(
      makeText("strong", "", activeType === "short" ? "अभी कोई Short नहीं है" : "अभी कोई वीडियो नहीं है"),
      makeText("div", "", activeType === "short"
        ? "अपलोड किए गए Shorts यहाँ दिखाई देंगे।"
        : "अपलोड किए गए वीडियो यहाँ दिखाई देंगे।")
    );

    const button = makeText("button", "", activeType === "short" ? "Short अपलोड करें" : "वीडियो अपलोड करें");
    button.onclick = () => {
      location.href = activeType === "short" ? "upload-short.html" : "upload-video.html";
    };
    empty.append(button);
    list.append(empty);
    return;
  }

  items.forEach(item => {
    const row = document.createElement("article");
    row.className = "video-row";

    const thumb = document.createElement("div");
    thumb.className = "thumb";
    thumb.onclick = () => openWatch(item.id, activeType);

    const image = document.createElement("img");
    image.alt = item.title;
    image.loading = "lazy";
    image.src = safeImageUrl(item.thumb) || "";
    image.onerror = () => { image.style.display = "none"; };

    const play = makeText("span", "play-mark", "▶");
    thumb.append(image, play);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.onclick = () => openWatch(item.id, activeType);

    meta.append(makeText("div", "title", item.title));

    const badges = document.createElement("div");
    badges.className = "badges";
    badges.append(
      makeText("span", "visibility", "● " + item.visibility),
      makeText("span", "", item.restriction || "None")
    );

    meta.append(
      badges,
      makeText("div", "stats", `${item.views} views · ${item.age}`),
      makeText("div", "stats", item.duration ? "Duration: " + item.duration : (activeType === "short" ? "Short" : "Video"))
    );

    const more = makeText("button", "more", "⋮");
    more.setAttribute("aria-label", "More actions");
    more.onclick = () => openDrawer(item.id, activeType);

    row.append(thumb, meta, more);
    list.append(row);
  });
}

function findSelected() {
  return getItems(selectedType).find(item => item.id === selectedId);
}

function openDrawer(id, type) {
  selectedId = String(id);
  selectedType = type;
  const item = findSelected();
  if (!item) return;

  document.getElementById("selectedTitle").textContent = item.title;
  document.getElementById("backdrop").style.display = "flex";
}

function closeDrawer() {
  document.getElementById("backdrop").style.display = "none";
}

function openWatch(id, type) {
  const item = getItems(type).find(v => v.id === String(id));
  if (!item) {
    alert("यह वीडियो नहीं मिला।");
    return;
  }

  const params = new URLSearchParams({
    id: item.id,
    type: type,
    channel: "Charandas Bhaskar"
  });

  location.href = "watch.html?" + params.toString();
}

function playSelected() {
  if (selectedId) openWatch(selectedId, selectedType);
}

function editSelected() {
  if (!selectedId) return;
  const params = new URLSearchParams({
    id: selectedId,
    type: selectedType
  });
  location.href = "edit-video.html?" + params.toString();
}

function deleteSelected() {
  const item = findSelected();
  if (!item) return;

  if (!confirm(`"${item.title}" को हटाना चाहते हैं?`)) return;

  const key = storageKey(selectedType);
  const remaining = readArray(key).filter(v => String(v.id) !== selectedId);

  if (!writeArray(key, remaining)) return;

  closeDrawer();
  selectedId = null;
  render();
}

window.addEventListener("storage", event => {
  if ([VIDEO_KEY, SHORT_KEY, LEGACY_KEY].includes(event.key)) render();
});

window.addEventListener("pageshow", () => {
  initializeStorage();
  render();
});

initializeStorage();
render();
</script>
</body>
</html>
