<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>Search - BTube</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            padding-bottom: 30px;
            overflow-x: hidden;
        }

        /* 1. TOP SEARCH BAR */
        .search-nav {
            height: 54px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
            position: sticky;
            top: 0;
            background: #0f0f0f;
            z-index: 1000;
            border-bottom: 1px solid #1f1f1f;
        }

        .btn-nav-back {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding: 4px;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-nav-back svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .search-pill-box {
            flex: 1;
            background: #222222;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            height: 40px;
            gap: 8px;
        }

        .search-input-ctrl {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
        }

        .btn-clear-txt {
            background: none;
            border: none;
            color: #888888;
            font-size: 16px;
            cursor: pointer;
            display: none;
        }

        .btn-mic-icon {
            background: #272727;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-mic-icon svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* 2. VOICE SEARCH FULL SCREEN MODAL */
        .voice-overlay {
            position: fixed;
            inset: 0;
            background: #181818;
            z-index: 3000;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px 60px;
        }

        .voice-overlay.open {
            display: flex;
        }

        .voice-top-row {
            display: flex;
            justify-content: flex-end;
        }

        .voice-close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }

        .voice-center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        .voice-status-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .voice-spoken-text {
            font-size: 16px;
            color: #aaaaaa;
            min-height: 24px;
        }

        .voice-mic-circle {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            position: relative;
            cursor: pointer;
            animation: pulse-ring 1.5s infinite;
        }

        .voice-mic-circle svg {
            width: 36px;
            height: 36px;
            fill: #ffffff;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.6); }
            70% { box-shadow: 0 0 0 24px rgba(229, 9, 20, 0); }
            100% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); }
        }

        /* 3. SUGGESTIONS & RECENT SEARCHES */
        .search-suggestions-wrap {
            display: flex;
            flex-direction: column;
            padding: 6px 0;
        }

        .suggest-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            cursor: pointer;
            color: #ffffff;
        }

        .suggest-item-row:active {
            background: #1c1c1c;
        }

        .suggest-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            min-width: 0;
        }

        .suggest-left svg {
            width: 18px;
            height: 18px;
            fill: #888888;
            flex-shrink: 0;
        }

        .suggest-text {
            font-size: 14px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-del-suggest {
            background: none;
            border: none;
            color: #666666;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 14px;
        }

        .btn-arrow-fill {
            background: none;
            border: none;
            color: #666666;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 16px;
        }

        /* 4. SEARCH RESULTS */
        .results-container {
            display: none;
            flex-direction: column;
            gap: 16px;
            padding: 8px 0;
        }

        .result-card-video {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
        }

        .result-thumb-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1c1c1c;
            position: relative;
        }

        .result-thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-time-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0,0,0,0.85);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .result-info-box {
            display: flex;
            padding: 10px 16px;
            gap: 12px;
        }

        .result-author-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            flex-shrink: 0;
            overflow: hidden;
        }

        .result-author-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-meta-column {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .result-title-text {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .result-sub-meta {
            font-size: 12px;
            color: #aaaaaa;
        }

        /* 5. EMPTY RESULTS STATE */
        .empty-results-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
            gap: 12px;
        }

        .empty-results-box svg {
            width: 56px;
            height: 56px;
            fill: #444;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 700;
        }

        .empty-sub {
            font-size: 13px;
            color: #888888;
            max-width: 260px;
            line-height: 1.4;
        }
    </style>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <!-- 1. TOP BAR -->
    <header class="search-nav">
        <button class="btn-nav-back" onclick="window.history.back()">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>

        <div class="search-pill-box">
            <input type="text" id="searchInput" class="search-input-ctrl" placeholder="Search BTube..." autofocus oninput="onSearchChange(this.value)" onkeydown="onSearchKeyDown(event)">
            <button class="btn-clear-txt" id="clearBtn" onclick="clearSearchText()">✕</button>
        </div>

        <button class="btn-mic-icon" onclick="openVoiceSearchModal()">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
    </header>

    <!-- 2. FULLSCREEN YOUTUBE-STYLE VOICE SEARCH MODAL -->
    <div class="voice-overlay" id="voiceModal">
        <div class="voice-top-row">
            <button class="voice-close-btn" onclick="closeVoiceSearchModal()">✕</button>
        </div>

        <div class="voice-center-content">
            <h2 class="voice-status-title" id="voiceTitle">Listening...</h2>
            <div class="voice-spoken-text" id="voiceSpokenTxt">Say something in Hindi or English</div>

            <div class="voice-mic-circle" onclick="restartListening()">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </div>
        </div>

        <div style="text-align: center; color: #777; font-size: 13px;">
            Tap microphone to try again
        </div>
    </div>

    <!-- 3. SUGGESTIONS & RECENT SEARCHES TRAY -->
    <main class="search-suggestions-wrap" id="suggestionsWrap"></main>

    <!-- 4. SEARCH RESULTS STREAM -->
    <section class="results-container" id="resultsBox"></section>

    <!-- 5. EMPTY RESULTS STATE -->
    <div class="empty-results-box" id="emptyState">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span class="empty-title" id="emptyTitle">No results found</span>
        <span class="empty-sub">Try different search keywords or check for spelling errors.</span>
    </div>

    <!-- INTERACTIVE JAVASCRIPT -->
    <script>
        const input = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const suggestWrap = document.getElementById('suggestionsWrap');
        const resultsBox = document.getElementById('resultsBox');
        const emptyState = document.getElementById('emptyState');

        let allFeedVideos = [];
        let speechRecognizer = null;

        window.addEventListener('DOMContentLoaded', async () => {
            renderRecentSearches();

            // Fetch live feed from database for real search
            if (window.BTubeAPI && typeof window.BTubeAPI.getFeed === 'function') {
                try {
                    allFeedVideos = await window.BTubeAPI.getFeed('all');
                } catch (e) {
                    allFeedVideos = [];
                }
            }

            // Check if query passed via URL
            const urlQuery = new URLSearchParams(window.location.search).get('q');
            if (urlQuery && urlQuery.trim()) {
                input.value = urlQuery.trim();
                executeSearch(urlQuery.trim());
            }
        });

        function getRecentSearches() {
            return JSON.parse(localStorage.getItem('btube_search_history') || '[]');
        }

        function saveRecentSearch(query) {
            let list = getRecentSearches();
            list = list.filter(item => item.toLowerCase() !== query.toLowerCase());
            list.unshift(query);
            if (list.length > 10) list.pop();
            localStorage.setItem('btube_search_history', JSON.stringify(list));
        }

        function removeSearchItem(query, e) {
            if (e) e.stopPropagation();
            let list = getRecentSearches();
            list = list.filter(item => item.toLowerCase() !== query.toLowerCase());
            localStorage.setItem('btube_search_history', JSON.stringify(list));
            renderRecentSearches();
        }

        function renderRecentSearches() {
            const list = getRecentSearches();
            suggestWrap.innerHTML = '';

            if (list.length === 0) {
                suggestWrap.innerHTML = `
                    <div style="padding: 24px 16px; color: #666; font-size: 13px; text-align: center;">
                        Type in search bar to explore creators, music, and videos.
                    </div>
                `;
                return;
            }

            list.forEach(item => {
                const row = document.createElement('div');
                row.className = 'suggest-item-row';
                row.onclick = () => executeSearch(item);
                row.innerHTML = `
                    <div class="suggest-left">
                        <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                        <span class="suggest-text">${item}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:4px;">
                        <button class="btn-arrow-fill" onclick="event.stopPropagation(); fillInput('${item.replace(/'/g, "\\'")}');">↖</button>
                        <button class="btn-del-suggest" onclick="removeSearchItem('${item.replace(/'/g, "\\'")}', event)">✕</button>
                    </div>
                `;
                suggestWrap.appendChild(row);
            });
        }

        function onSearchChange(val) {
            clearBtn.style.display = val.trim().length > 0 ? 'block' : 'none';
            if (val.trim().length === 0) {
                suggestWrap.style.display = 'flex';
                resultsBox.style.display = 'none';
                emptyState.style.display = 'none';
                renderRecentSearches();
            }
        }

        function clearSearchText() {
            input.value = '';
            clearBtn.style.display = 'none';
            suggestWrap.style.display = 'flex';
            resultsBox.style.display = 'none';
            emptyState.style.display = 'none';
            renderRecentSearches();
            input.focus();
        }

        function fillInput(text) {
            input.value = text;
            clearBtn.style.display = 'block';
            input.focus();
        }

        function onSearchKeyDown(e) {
            if (e.key === 'Enter') {
                executeSearch(input.value);
            }
        }

        function executeSearch(query) {
            const q = query.trim();
            if (!q) return;

            input.value = q;
            clearBtn.style.display = 'block';
            suggestWrap.style.display = 'none';

            saveRecentSearch(q);

            const qLower = q.toLowerCase();
            const filtered = allFeedVideos.filter(v => {
                const title = (v.title || '').toLowerCase();
                const channel = (v.channel || '').toLowerCase();
                const desc = (v.description || '').toLowerCase();
                const cat = (v.category || '').toLowerCase();
                return title.includes(qLower) || channel.includes(qLower) || desc.includes(qLower) || cat.includes(qLower);
            });

            resultsBox.innerHTML = '';

            if (filtered.length === 0) {
                resultsBox.style.display = 'none';
                document.getElementById('emptyTitle').innerText = `No results found for "${q}"`;
                emptyState.style.display = 'flex';
                return;
            }

            emptyState.style.display = 'none';
            resultsBox.style.display = 'flex';

            filtered.forEach(v => {
                const card = document.createElement('div');
                card.className = 'result-card-video';
                card.onclick = () => {
                    window.location.href = `watch.html?id=${v.id}&videoUrl=${encodeURIComponent(v.videoUrl || '')}`;
                };

                const avatarContent = v.channelAvatar 
                    ? `<img src="${v.channelAvatar}">` 
                    : (v.channel || 'BT').substring(0, 2).toUpperCase();

                card.innerHTML = `
                    <div class="result-thumb-box">
                        <img src="${v.thumb || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800'}" alt="${v.title || 'Video'}">
                        <span class="result-time-badge">${v.duration || '03:45'}</span>
                    </div>
                    <div class="result-info-box">
                        <div class="result-author-avatar">${avatarContent}</div>
                        <div class="result-meta-column">
                            <span class="result-title-text">${v.title || 'Untitled Video'}</span>
                            <span class="result-sub-meta">${v.channel || 'Creator'} • ${v.views || 0} views</span>
                        </div>
                    </div>
                `;
                resultsBox.appendChild(card);
            });
        }

        // FULL SCREEN VOICE SEARCH MODAL
        function openVoiceSearchModal() {
            const modal = document.getElementById('voiceModal');
            modal.classList.add('open');
            startVoiceEngine();
        }

        function closeVoiceSearchModal() {
            const modal = document.getElementById('voiceModal');
            modal.classList.remove('open');
            if (speechRecognizer) {
                speechRecognizer.stop();
            }
        }

        function startVoiceEngine() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            const title = document.getElementById('voiceTitle');
            const spokenTxt = document.getElementById('voiceSpokenTxt');

            if (!SpeechRec) {
                title.innerText = 'Not Supported';
                spokenTxt.innerText = 'Speech recognition is not available in this browser.';
                return;
            }

            speechRecognizer = new SpeechRec();
            speechRecognizer.lang = 'hi-IN';
            speechRecognizer.interimResults = true;

            title.innerText = 'Listening...';
            spokenTxt.innerText = 'Say something...';

            speechRecognizer.onresult = (e) => {
                const transcript = Array.from(e.results)
                    .map(r => r[0])
                    .map(r => r.transcript)
                    .join('');

                spokenTxt.innerText = transcript;

                if (e.results[0].isFinal) {
                    setTimeout(() => {
                        closeVoiceSearchModal();
                        executeSearch(transcript);
                    }, 600);
                }
            };

            speechRecognizer.onerror = () => {
                title.innerText = 'Didn\'t catch that';
                spokenTxt.innerText = 'Tap the microphone to try again';
            };

            speechRecognizer.start();
        }

        function restartListening() {
            startVoiceEngine();
        }
    </script>
</body>
</html>
