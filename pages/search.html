
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0f0f">
  <title>Search - BTube</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0f0f0f;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid #292929;
      position: sticky;
      top: 0;
      background: #0f0f0f;
    }
    a { color: inherit; text-decoration: none; }
    .back { font-size: 25px; }
    .brand { font-size: 20px; font-weight: 800; }
    form {
      display: flex;
      gap: 8px;
      padding: 16px;
    }
    input {
      min-width: 0;
      flex: 1;
      background: #242424;
      color: white;
      border: 1px solid #444;
      border-radius: 24px;
      padding: 13px 16px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #aaa; }
    button {
      border: 0;
      border-radius: 22px;
      padding: 0 17px;
      background: #e50914;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }
    #message { color: #aaa; padding: 8px 16px; }
    #results { padding-bottom: 24px; }
    .video {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #222;
    }
    .thumb {
      width: 42%;
      max-width: 180px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #252525;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .details { min-width: 0; }
    .title {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .meta {
      color: #aaa;
      font-size: 12px;
      margin-top: 8px;
    }
    .empty {
      padding: 28px 16px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../index.html" aria-label="Home">‹</a>
    <a class="brand" href="../index.html">BTube</a>
    <span style="margin-left:auto">Search</span>
  </header>

  <form id="searchForm">
    <input
      id="query"
      type="search"
      placeholder="वीडियो खोजें..."
      aria-label="वीडियो खोजें"
      autocomplete="off"
    >
    <button type="submit">खोजें</button>
  </form>

  <div id="message">वीडियो खोजने के लिए नाम लिखें।</div>
  <main id="results"></main>

  <script src="../assets/js/api-client.js"></script>
  <script>
    const input = document.getElementById("query");
    const form = document.getElementById("searchForm");
    const message = document.getElementById("message");
    const results = document.getElementById("results");

    let videos = [];

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function getTitle(v) {
      return v.title || v.name || "Untitled";
    }

    function searchVideos() {
      const q = input.value.trim().toLocaleLowerCase("hi");
      results.innerHTML = "";

      if (!q) {
        message.textContent = "वीडियो खोजने के लिए नाम लिखें।";
        return;
      }

      const matches = videos.filter(v => {
        const text = [
          getTitle(v),
          v.description,
          v.channel,
          v.channel_name
        ].join(" ").toLocaleLowerCase("hi");

        return text.includes(q);
      });

      if (!matches.length) {
        message.textContent = "कोई वीडियो नहीं मिला।";
        return;
      }

      message.textContent = "कुल परिणाम: " + matches.length;

      matches.forEach(v => {
        const id = v.id || v.video_id;
        const isShort = v.type === "short" || v.is_shorts === true;
        const url = isShort
          ? "shorts.html?id=" + encodeURIComponent(id || "")
          : "watch.html?id=" + encodeURIComponent(id || "");

        const thumb = v.thumb || v.thumbnail_url || "";
        const title = getTitle(v);
        const channel = v.channel || v.channel_name || "BTube Creator";

        const card = document.createElement("a");
        card.className = "video";
        card.href = url;

        const image = document.createElement("img");
        image.className = "thumb";
        image.alt = "";
        image.loading = "lazy";
        image.src = thumb;

        image.onerror = function() {
          this.style.visibility = "hidden";
        };

        const details = document.createElement("div");
        details.className = "details";

        const heading = document.createElement("div");
        heading.className = "title";
        heading.textContent = title;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = channel + (isShort ? " · Short" : " · Video");

        details.append(heading, meta);
        card.append(image, details);
        results.appendChild(card);
      });
    }

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      searchVideos();
    });

    input.addEventListener("input", searchVideos);

    async function loadVideos() {
      if (!window.BTubeAPI ||
          typeof window.BTubeAPI.getFeed !== "function") {
        message.textContent =
          "वीडियो सेवा उपलब्ध नहीं है। API सेटिंग जाँचें।";
        return;
      }

      try {
        const data = await window.BTubeAPI.getFeed("all");
        videos = Array.isArray(data)
          ? data
          : Array.isArray(data?.videos) ? data.videos : [];

        message.textContent = videos.length
          ? "वीडियो खोजने के लिए नाम लिखें।"
          : "अभी कोई वीडियो उपलब्ध नहीं है।";

        const params = new URLSearchParams(location.search);
        const initialQuery = params.get("q") || "";
        input.value = initialQuery;

        if (initialQuery) searchVideos();
      } catch (error) {
        console.error("BTube search error:", error);
        message.textContent =
          "वीडियो लोड नहीं हुए। इंटरनेट और API सेटिंग जाँचें।";
      }
    }

    loadVideos();
  </script>
</body>
</html>
