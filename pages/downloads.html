<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>Downloads - BTube</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            padding-bottom: 75px;
            overflow-x: hidden;
        }

        /* 1. TOP HEADER */
        .down-header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            background: #0f0f0f;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-back {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-back svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
        }

        .header-right-tools {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .tool-btn {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
        }

        .tool-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* 2. DEVICE STORAGE BAR */
        .storage-status-card {
            padding: 12px 16px;
            background: #161616;
            border-bottom: 1px solid #222222;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .storage-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #aaaaaa;
        }

        .storage-meta-row strong {
            color: #ffffff;
        }

        .storage-track-bar {
            width: 100%;
            height: 5px;
            background: #2b2b2b;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
        }

        .storage-fill-used {
            width: 2%;
            background: #3ea6ff;
            height: 100%;
            transition: width 0.3s;
        }

        /* 3. DOWNLOADS FEED */
        .downloads-feed-list {
            display: flex;
            flex-direction: column;
        }

        .section-label-bar {
            padding: 14px 16px 8px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .down-item-card {
            display: flex;
            align-items: flex-start;
            padding: 10px 16px;
            gap: 12px;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
            position: relative;
        }

        .down-item-card:active {
            background: #181818;
        }

        .down-thumb-box {
            width: 130px;
            aspect-ratio: 16 / 9;
            background: #202020;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        .down-thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .duration-pill {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.85);
            font-size: 10px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 4px;
        }

        .down-details-col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .down-video-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .down-sub-meta {
            font-size: 11px;
            color: #aaaaaa;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .blue-check-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #3ea6ff;
            color: #0f0f0f;
            border-radius: 50%;
            width: 13px;
            height: 13px;
            font-size: 9px;
            font-weight: 900;
        }

        .btn-more-card {
            background: none;
            border: none;
            color: #888888;
            cursor: pointer;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-more-card svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* 4. EMPTY STATE */
        .empty-downloads-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
            gap: 12px;
        }

        .empty-downloads-box svg {
            width: 56px;
            height: 56px;
            fill: #444444;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 700;
        }

        .empty-sub {
            font-size: 13px;
            color: #888888;
            max-width: 260px;
            line-height: 1.4;
        }

        .btn-find-videos {
            margin-top: 6px;
            background: #e50914;
            color: #fff;
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        /* 5. BOTTOM DRAWERS */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 2500;
            display: none;
            align-items: flex-end;
        }

        .drawer-overlay.open {
            display: flex;
        }

        .drawer-sheet-card {
            width: 100%;
            background: #212121;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.8);
        }

        .drawer-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid #2d2d2d;
            margin-bottom: 6px;
        }

        .drawer-title-txt {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85%;
        }

        .drawer-close-btn {
            background: none;
            border: none;
            color: #aaaaaa;
            font-size: 20px;
            cursor: pointer;
        }

        .drawer-row-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 6px;
            color: #ffffff;
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            border-radius: 8px;
            text-decoration: none;
        }

        .drawer-row-btn:active {
            background: #2a2a2a;
        }

        .drawer-row-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* Toast */
        .toast-pop {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(33, 33, 33, 0.95);
            border: 1px solid #444;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 3000;
            display: none;
        }

        /* 6. BOTTOM NAVIGATION */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 52px;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid #222;
            z-index: 1000;
        }

        .nav-tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #aaaaaa;
            text-decoration: none;
            gap: 2px;
        }

        .nav-tab-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-plus-circle {
            color: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .nav-plus-circle svg {
            width: 24px;
            height: 24px;
            fill: #e50914;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <!-- 1. TOP HEADER -->
    <header class="down-header">
        <div class="header-left">
            <button class="btn-back" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span class="header-title">Downloads</span>
        </div>

        <div class="header-right-tools">
            <button class="tool-btn" onclick="openGlobalOptionsDrawer()">
                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
    </header>

    <!-- 2. DEVICE STORAGE BAR -->
    <section class="storage-status-card">
        <div class="storage-meta-row">
            <span>BTube Offline Storage: <strong id="usedStorageTxt">0 MB</strong></span>
            <span>Status: <strong style="color:#2ecc71;">Available Offline</strong></span>
        </div>
        <div class="storage-track-bar">
            <div class="storage-fill-used" id="usedBar"></div>
        </div>
    </section>

    <!-- 3. DOWNLOADED ITEMS LIST -->
    <main class="downloads-feed-list" id="downloadsFeed">
        <div class="section-label-bar">
            <span>Downloaded videos (<span id="downloadCount">0</span>)</span>
        </div>
        <div id="downloadCardsContainer"></div>
    </main>

    <!-- 4. EMPTY STATE -->
    <div class="empty-downloads-box" id="emptyState">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <span class="empty-title">No downloaded videos</span>
        <span class="empty-sub">Videos you download while watching will appear here so you can play them offline.</span>
        <a href="../frontend/index.html" class="btn-find-videos">Find videos to watch</a>
    </div>

    <!-- 5. DRAWER: SINGLE ITEM OPTIONS -->
    <div class="drawer-overlay" id="itemDrawer" onclick="closeDrawerOnBackdrop(event, 'itemDrawer')">
        <div class="drawer-sheet-card">
            <div class="drawer-header-row">
                <span class="drawer-title-txt" id="itemDrawerTitle">Options</span>
                <button class="drawer-close-btn" onclick="closeDrawer('itemDrawer')">✕</button>
            </div>
            <button class="drawer-row-btn" onclick="deleteSingleDownload()" style="color:#ff4e4e;">
                <svg viewBox="0 0 24 24" style="fill:#ff4e4e;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                <span>Delete from downloads</span>
            </button>
            <button class="drawer-row-btn" onclick="shareDownload()">
                <svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
                <span>Share video</span>
            </button>
        </div>
    </div>

    <!-- 6. DRAWER: GLOBAL SETTINGS & CLEAR -->
    <div class="drawer-overlay" id="globalDrawer" onclick="closeDrawerOnBackdrop(event, 'globalDrawer')">
        <div class="drawer-sheet-card">
            <div class="drawer-header-row">
                <span class="drawer-title-txt">Downloads settings</span>
                <button class="drawer-close-btn" onclick="closeDrawer('globalDrawer')">✕</button>
            </div>
            <button class="drawer-row-btn" onclick="deleteAllDownloads()" style="color:#ff4e4e;">
                <svg viewBox="0 0 24 24" style="fill:#ff4e4e;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                <span>Delete all downloads</span>
            </button>
            <a href="settings.html" class="drawer-row-btn">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                <span>Download settings</span>
            </a>
        </div>
    </div>

    <!-- Toast Bubble -->
    <div class="toast-pop" id="downToast"></div>

    <!-- 7. BOTTOM NAVIGATION -->
    <nav class="bottom-nav-fixed">
        <a href="../frontend/index.html" class="nav-tab-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="shorts.html" class="nav-tab-item">
            <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
            <span>Shorts</span>
        </a>
        <a href="upload.html" class="nav-plus-circle">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </a>
        <a href="subscriptions.html" class="nav-tab-item">
            <svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg>
            <span>Subs</span>
        </a>
        <a href="profile.html" class="nav-tab-item active">
            <div style="width:20px; height:20px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff; overflow:hidden;" id="bottomNavInits">BT</div>
            <span>You</span>
        </a>
    </nav>

    <script>
        let selectedVideoId = null;

        window.addEventListener('DOMContentLoaded', async () => {
            syncAvatar();
            renderDownloads();
        });

        function syncAvatar() {
            const authUser = window.BTubeAPI ? window.BTubeAPI.getAuthUser() : JSON.parse(localStorage.getItem('btube_user') || 'null');
            const botAv = document.getElementById('bottomNavInits');
            if (authUser && botAv) {
                if (authUser.photo) {
                    botAv.innerHTML = `<img src="${authUser.photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                } else {
                    botAv.innerText = (authUser.name || 'BT').substring(0, 2).toUpperCase();
                }
            }
        }

        function getStoredDownloads() {
            return JSON.parse(localStorage.getItem('btube_downloaded_videos') || '[]');
        }

        function renderDownloads() {
            const downloads = getStoredDownloads();
            const container = document.getElementById('downloadCardsContainer');
            const empty = document.getElementById('emptyState');
            const feed = document.getElementById('downloadsFeed');

            container.innerHTML = '';

            if (downloads.length === 0) {
                feed.style.display = 'none';
                empty.style.display = 'flex';
                updateStorageDisplay(0, 0);
                return;
            }

            feed.style.display = 'flex';
            empty.style.display = 'none';

            let totalMb = 0;

            downloads.forEach(v => {
                const sizeMb = v.sizeMb || 35;
                totalMb += sizeMb;

                const card = document.createElement('div');
                card.className = 'down-item-card';
                card.onclick = () => {
                    window.location.href = `watch.html?id=${v.id}&videoUrl=${encodeURIComponent(v.videoUrl || '')}`;
                };

                card.innerHTML = `
                    <div class="down-thumb-box">
                        <img src="${v.thumb || 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=400'}">
                        <span class="duration-pill">${v.duration || '03:45'}</span>
                    </div>
                    <div class="down-details-col">
                        <div class="down-video-title">${v.title || 'Offline Video'}</div>
                        <div class="down-sub-meta">
                            <span class="blue-check-badge">✓</span>
                            <span>${v.channel || 'BTube Creator'} • ${sizeMb} MB</span>
                        </div>
                    </div>
                    <button class="btn-more-card" onclick="event.stopPropagation(); openItemDrawer('${v.id}', '${encodeURIComponent(v.title || '')}')">
                        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                    </button>
                `;
                container.appendChild(card);
            });

            updateStorageDisplay(downloads.length, totalMb);
        }

        function updateStorageDisplay(count, mb) {
            document.getElementById('downloadCount').innerText = count;
            document.getElementById('usedStorageTxt').innerText = `${mb} MB`;
            const fillPct = Math.min(100, Math.max(2, (mb / 500) * 100));
            document.getElementById('usedBar').style.width = `${fillPct}%`;
        }

        function openItemDrawer(id, title) {
            selectedVideoId = id;
            document.getElementById('itemDrawerTitle').innerText = decodeURIComponent(title);
            document.getElementById('itemDrawer').classList.add('open');
        }

        function openGlobalOptionsDrawer() {
            document.getElementById('globalDrawer').classList.add('open');
        }

        function closeDrawer(id) {
            document.getElementById(id).classList.remove('open');
        }

        function closeDrawerOnBackdrop(e, id) {
            if (e.target.id === id) closeDrawer(id);
        }

        function deleteSingleDownload() {
            if (!selectedVideoId) return;
            let downloads = getStoredDownloads();
            downloads = downloads.filter(v => v.id !== selectedVideoId);
            localStorage.setItem('btube_downloaded_videos', JSON.stringify(downloads));
            closeDrawer('itemDrawer');
            renderDownloads();
            showToast("Video deleted from offline storage");
        }

        function deleteAllDownloads() {
            localStorage.removeItem('btube_downloaded_videos');
            closeDrawer('globalDrawer');
            renderDownloads();
            showToast("All offline videos cleared");
        }

        function shareDownload() {
            closeDrawer('itemDrawer');
            if (navigator.share) {
                navigator.share({ title: 'Offline Video', url: window.location.href }).catch(()=>{});
            } else {
                navigator.clipboard.writeText(window.location.href);
                showToast("Video link copied");
            }
        }

        function showToast(msg) {
            const t = document.getElementById('downToast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }
    </script>
</body>
</html>
