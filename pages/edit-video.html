<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Edit video - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background:#0f0f0f; color:#fff; padding-bottom:40px; }
        .edit-header { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid #222; position:sticky; top:0; background:#0f0f0f; z-index:100; }
        .header-left { display:flex; align-items:center; gap:16px; }
        .btn-back { background:none; border:none; color:#fff; cursor:pointer; }
        .btn-back svg { width:22px; height:22px; fill:#fff; }
        .btn-save { background:#e50914; color:#fff; border:none; padding:7px 18px; border-radius:18px; font-weight:700; cursor:pointer; }
        .form-wrap { padding:16px; display:flex; flex-direction:column; gap:20px; }
        .thumb-preview-box { width:100%; height:190px; border-radius:12px; overflow:hidden; background:#1c1c1c; }
        .thumb-preview-box img { width:100%; height:100%; object-fit:cover; }
        .input-group { display:flex; flex-direction:column; gap:6px; }
        .input-group label { font-size:12px; color:#aaa; font-weight:600; }
        .input-group input, .input-group textarea, .input-group select { background:#181818; border:1px solid #333; border-radius:10px; padding:12px 14px; color:#fff; font-size:14px; outline:none; }
    </style>
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>
    <header class="edit-header">
        <div class="header-left">
            <button class="btn-back" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span style="font-size:17px; font-weight:700;">Edit Cloud Video</span>
        </div>
        <button class="btn-save" id="saveBtn" onclick="saveToCloud()">Save</button>
    </header>

    <div class="form-wrap">
        <div class="thumb-preview-box">
            <img id="editThumbImg" src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800">
        </div>

        <div class="input-group">
            <label>Title</label>
            <input type="text" id="inputTitle" placeholder="Loading...">
        </div>

        <div class="input-group">
            <label>Description</label>
            <textarea id="inputDesc" rows="4" placeholder="Add description..."></textarea>
        </div>

        <div class="input-group">
            <label>Visibility</label>
            <select id="selectVis">
                <option value="Public">Public (Anyone can view)</option>
                <option value="Unlisted">Unlisted (Anyone with link)</option>
                <option value="Private">Private (Only you)</option>
            </select>
        </div>
    </div>

    <script>
        const docId = new URLSearchParams(window.location.search).get('id');

        window.addEventListener('DOMContentLoaded', async () => {
            if (!docId) return;
            const data = await window.BTubeAPI.getVideoById(docId);
            if (data) {
                document.getElementById('inputTitle').value = data.title || '';
                document.getElementById('inputDesc').value = data.description || '';
                document.getElementById('selectVis').value = data.visibility || 'Public';
                if (data.thumb) document.getElementById('editThumbImg').src = data.thumb;
            }
        });

        async function saveToCloud() {
            const btn = document.getElementById('saveBtn');
            const title = document.getElementById('inputTitle').value.trim();
            const desc = document.getElementById('inputDesc').value.trim();
            const vis = document.getElementById('selectVis').value;

            if (!title) {
                alert('Title cannot be empty');
                return;
            }

            btn.innerText = 'Saving...';
            btn.disabled = true;

            await window.BTubeAPI.updateVideo(docId, {
                title: title,
                description: desc,
                visibility: vis
            });

            alert('Updated successfully in Firebase Cloud! ✓');
            window.location.href = 'your-videos.html';
        }
    </script>
</body>
</html>
