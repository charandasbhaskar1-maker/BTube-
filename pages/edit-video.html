<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Edit video - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:40px; }
        .edit-header { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid #222; position:sticky; top:0; background:#0f0f0f; z-index:100; }
        .header-left { display:flex; align-items:center; gap:16px; }
        .btn-back { background:none; border:none; color:#fff; cursor:pointer; display:flex; align-items:center; }
        .btn-back svg { width:22px; height:22px; fill:#fff; }
        .btn-save { background:#e50914; color:#fff; border:none; padding:7px 18px; border-radius:18px; font-weight:700; font-size:13px; cursor:pointer; }
        .form-wrap { padding:16px; display:flex; flex-direction:column; gap:20px; }
        .thumb-preview-box { width:100%; height:190px; border-radius:12px; overflow:hidden; background:#1c1c1c; position:relative; }
        .thumb-preview-box img { width:100%; height:100%; object-fit:cover; }
        .input-group { display:flex; flex-direction:column; gap:6px; }
        .input-group label { font-size:12px; color:#aaa; font-weight:600; }
        .input-group input, .input-group textarea, .input-group select { background:#181818; border:1px solid #333; border-radius:10px; padding:12px 14px; color:#fff; font-size:14px; outline:none; }
        .input-group input:focus, .input-group textarea:focus { border-color:#e50914; }
        .toast-bubble { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#222; border:1px solid #444; color:#fff; padding:10px 20px; border-radius:20px; font-size:13px; display:none; z-index:1000; }
    </style>
</head>
<body>
    <header class="edit-header">
        <div class="header-left">
            <button class="btn-back" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span style="font-size:17px; font-weight:700;">Edit video</span>
        </div>
        <button class="btn-save" onclick="saveVideoChanges()">Save</button>
    </header>

    <div class="form-wrap">
        <div class="thumb-preview-box">
            <img id="editThumbImg" src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800" alt="Thumbnail">
        </div>

        <div class="input-group">
            <label>Title</label>
            <input type="text" id="inputVideoTitle" placeholder="Enter video title...">
        </div>

        <div class="input-group">
            <label>Description</label>
            <textarea id="inputVideoDesc" rows="4" placeholder="Add description, tags, folk details..."></textarea>
        </div>

        <div class="input-group">
            <label>Visibility</label>
            <select id="selectVisibility">
                <option value="Public">Public (Anyone can search & view)</option>
                <option value="Unlisted">Unlisted (Anyone with link)</option>
                <option value="Private">Private (Only you)</option>
            </select>
        </div>
    </div>

    <div class="toast-bubble" id="editToast">Changes saved successfully ✓</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id') || 'vid_1';

        // Load Initial Data
        window.addEventListener('DOMContentLoaded', () => {
            const raw = localStorage.getItem('btube_user_videos');
            let videos = raw ? JSON.parse(raw) : null;

            if (videos) {
                const target = videos.find(v => v.id === videoId);
                if (target) {
                    document.getElementById('inputVideoTitle').value = target.title || '';
                    document.getElementById('inputVideoDesc').value = target.desc || '';
                    document.getElementById('selectVisibility').value = target.visibility || 'Public';
                    if (target.thumb) document.getElementById('editThumbImg').src = target.thumb;
                    return;
                }
            }

            // Fallback default
            document.getElementById('inputVideoTitle').value = "Chhattisgarhi song maya ke rang";
            document.getElementById('inputVideoDesc').value = "Original Chhattisgarhi cultural song.";
            document.getElementById('selectVisibility').value = "Public";
        });

        function saveVideoChanges() {
            const newTitle = document.getElementById('inputVideoTitle').value.trim();
            const newDesc = document.getElementById('inputVideoDesc').value.trim();
            const newVis = document.getElementById('selectVisibility').value;

            if (!newTitle) {
                alert('Title cannot be empty');
                return;
            }

            // Read existing videos array or create default 4 videos
            let raw = localStorage.getItem('btube_user_videos');
            let videos = raw ? JSON.parse(raw) : [
                { id: 'vid_1', title: 'Chhattisgarhi song maya ke rang', duration: '05:42', views: '210K', age: '2 weeks ago', visibility: 'Public', restriction: 'None', thumb: 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800', videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' },
                { id: 'vid_2', title: 'Typewriter Banjo with Magnetic Pickups Full Making Guide', duration: '14:10', views: '45K', age: '1 month ago', visibility: 'Public', restriction: 'Potential limitation', thumb: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800', videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4' },
                { id: 'vid_3', title: 'Morning Commute & Village Lifestyle Daily Vlog #42', duration: '06:25', views: '8.4K', age: '3 days ago', visibility: 'Public', restriction: 'None', thumb: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=800', videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' },
                { id: 'vid_4', title: 'Hareli Festival Folk Song • Farm Life & Nature', duration: '04:18', views: '98K', age: '1 week ago', visibility: 'Unlisted', restriction: 'None', thumb: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800', videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4' }
            ];

            const idx = videos.findIndex(v => v.id === videoId);
            if (idx !== -1) {
                videos[idx].title = newTitle;
                videos[idx].desc = newDesc;
                videos[idx].visibility = newVis;
            } else {
                // If it was newly uploaded
                videos.unshift({
                    id: videoId,
                    title: newTitle,
                    desc: newDesc,
                    visibility: newVis,
                    duration: '03:15',
                    views: '1 view',
                    age: 'Just now',
                    restriction: 'None',
                    thumb: document.getElementById('editThumbImg').src,
                    videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'
                });
            }

            // Save to LocalStorage
            localStorage.setItem('btube_user_videos', JSON.stringify(videos));

            // Show Toast & Redirect Back
            const toast = document.getElementById('editToast');
            toast.style.display = 'block';
            setTimeout(() => {
                window.location.href = 'your-videos.html';
            }, 800);
        }
    </script>
</body>
</html>
