<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>Channel settings - BTube</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            padding-bottom: 30px;
            overflow-x: hidden;
        }

        /* 1. TOP HEADER */
        .edit-header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            background: #0f0f0f;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-back {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-back svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
        }

        .btn-save-check {
            background: #3ea6ff;
            color: #0f0f0f;
            border: none;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
        }

        /* 2. BANNER & DP EDIT PREVIEW */
        .banner-edit-frame {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #1f1f1f 0%, #3a0007 60%, #151515 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .banner-cam-btn {
            background: rgba(0, 0, 0, 0.65);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner-cam-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .avatar-edit-wrap {
            display: flex;
            justify-content: center;
            margin-top: -38px;
            position: relative;
            z-index: 10;
        }

        .avatar-edit-circle {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            border: 3px solid #0f0f0f;
            position: relative;
            cursor: pointer;
        }

        .dp-cam-badge {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dp-cam-badge svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* 3. SETTINGS FORM LIST */
        .edit-fields-list {
            display: flex;
            flex-direction: column;
            padding: 16px 0;
        }

        .field-row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #1a1a1a;
            cursor: pointer;
        }

        .field-row-item:active {
            background: #181818;
        }

        .field-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            padding-right: 12px;
        }

        .field-label {
            font-size: 11px;
            color: #aaaaaa;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .field-value {
            font-size: 14px;
            color: #ffffff;
            font-weight: 500;
        }

        .field-edit-icon svg {
            width: 18px;
            height: 18px;
            fill: #888888;
        }

        /* 4. PRIVACY TOGGLE SECTION */
        .privacy-box {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .privacy-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-desc {
            font-size: 13px;
            color: #cccccc;
            max-width: 80%;
            line-height: 1.35;
        }

        /* Custom Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #383838;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #3ea6ff;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* 5. MODAL BOTTOM EDIT INPUT */
        .edit-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            display: none;
            align-items: flex-end;
        }

        .edit-modal-overlay.open {
            display: flex;
        }

        .edit-sheet-card {
            width: 100%;
            background: #212121;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 18px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .sheet-title {
            font-size: 16px;
            font-weight: 700;
        }

        .sheet-input {
            width: 100%;
            background: #141414;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .sheet-input:focus {
            border-color: #3ea6ff;
        }

        .sheet-btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .sheet-btn {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 16px;
        }

        .sheet-btn.cancel { color: #aaaaaa; }
        .sheet-btn.confirm { background: #3ea6ff; color: #0f0f0f; }

        /* Toast */
        .toast-pop {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(33, 33, 33, 0.95);
            border: 1px solid #444;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 3000;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 1. TOP HEADER -->
    <header class="edit-header">
        <div class="header-left">
            <a href="channel.html" class="btn-back">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </a>
            <span class="header-title">Channel settings</span>
        </div>
        <button class="btn-save-check" onclick="saveAllChanges()">Save</button>
    </header>

    <!-- 2. BANNER & DP EDIT -->
    <div class="banner-edit-frame" onclick="openPhotoPicker('Banner')">
        <div class="banner-cam-btn">
            <svg viewBox="0 0 24 24"><path d="M12 12c1.65 0 3-1.35 3-3s-1.35-3-3-3-3 1.35-3 3 1.35 3 3 3zm0 2c-2.21 0-4 1.79-4 4h8c0-2.21-1.79-4-4-4zm9-9h-3.17L16 3H8L6.17 5H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 14H3V7h3.88l1.83-2h6.58l1.83 2H21v12z"/></svg>
        </div>
    </div>

    <div class="avatar-edit-wrap">
        <div class="avatar-edit-circle" onclick="openPhotoPicker('Profile Picture')">
            CB
            <div class="dp-cam-badge">
                <svg viewBox="0 0 24 24"><path d="M12 12c1.65 0 3-1.35 3-3s-1.35-3-3-3-3 1.35-3 3 1.35 3 3 3zm0 2c-2.21 0-4 1.79-4 4h8c0-2.21-1.79-4-4-4zm9-9h-3.17L16 3H8L6.17 5H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 14H3V7h3.88l1.83-2h6.58l1.83 2H21v12z"/></svg>
            </div>
        </div>
    </div>

    <!-- 3. CHANNEL FIELDS -->
    <main class="edit-fields-list">
        <!-- Name -->
        <div class="field-row-item" onclick="openEditModal('name', 'Name', document.getElementById('nameVal').innerText)">
            <div class="field-info">
                <span class="field-label">Name</span>
                <span class="field-value" id="nameVal">Charandas Bhaskar</span>
            </div>
            <div class="field-edit-icon">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </div>
        </div>

        <!-- Handle -->
        <div class="field-row-item" onclick="openEditModal('handle', 'Handle', document.getElementById('handleVal').innerText)">
            <div class="field-info">
                <span class="field-label">Handle</span>
                <span class="field-value" id="handleVal">@charandasbhaskar</span>
            </div>
            <div class="field-edit-icon">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </div>
        </div>

        <!-- Description -->
        <div class="field-row-item" onclick="openEditModal('desc', 'Description', document.getElementById('descVal').innerText)">
            <div class="field-info">
                <span class="field-label">Description</span>
                <span class="field-value" id="descVal">Official BTube channel for Chhattisgarhi folk music, traditional bhajans, daily life stories and instruments.</span>
            </div>
            <div class="field-edit-icon">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </div>
        </div>
    </main>

    <!-- 4. PRIVACY TOGGLE -->
    <section class="privacy-box">
        <span class="privacy-title">Privacy</span>
        <div class="toggle-row">
            <span class="toggle-desc">Keep all my subscriptions private</span>
            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="toggle-row">
            <span class="toggle-desc">Keep all my saved playlists private</span>
            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>
    </section>

    <!-- 5. EDIT VALUE MODAL -->
    <div class="edit-modal-overlay" id="editModal">
        <div class="edit-sheet-card">
            <span class="sheet-title" id="modalFieldTitle">Edit</span>
            <input type="text" class="sheet-input" id="modalInputVal">
            <div class="sheet-btn-row">
                <button class="sheet-btn cancel" onclick="closeEditModal()">Cancel</button>
                <button class="sheet-btn confirm" onclick="confirmFieldValue()">Save</button>
            </div>
        </div>
    </div>

    <div class="toast-pop" id="toastPop"></div>

    <script>
        let currentTargetField = null;

        function showToast(msg) {
            const t = document.getElementById('toastPop');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        function openPhotoPicker(type) {
            showToast(`${type} selector opened`);
        }

        function openEditModal(fieldId, title, currentVal) {
            currentTargetField = fieldId;
            document.getElementById('modalFieldTitle').innerText = title;
            document.getElementById('modalInputVal').value = currentVal;
            document.getElementById('editModal').classList.add('open');
            document.getElementById('modalInputVal').focus();
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('open');
        }

        function confirmFieldValue() {
            const val = document.getElementById('modalInputVal').value.trim();
            if (val && currentTargetField) {
                if (currentTargetField === 'name') document.getElementById('nameVal').innerText = val;
                if (currentTargetField === 'handle') document.getElementById('handleVal').innerText = val.startsWith('@') ? val : '@' + val;
                if (currentTargetField === 'desc') document.getElementById('descVal').innerText = val;
                showToast('Updated successfully');
            }
            closeEditModal();
        }

        function saveAllChanges() {
            showToast('Channel settings saved ✓');
            setTimeout(() => {
                window.location.href = 'channel.html';
            }, 800);
        }
    </script>
</body>
</html>
