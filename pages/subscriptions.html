<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Subscriptions - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:70px; }

        /* Top Bar */
        .subs-hdr { height:54px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; position:sticky; top:0; background:#0f0f0f; z-index:100; border-bottom:1px solid #1c1c1c; }
        .logo-wrap { display:flex; align-items:center; gap:6px; font-size:19px; font-weight:800; }
        .bt-badge { width:32px; height:24px; background:linear-gradient(135deg, #ff1a1a, #b30006); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; }
        
        .hdr-actions { display:flex; align-items:center; gap:16px; }
        .hdr-actions svg { width:22px; height:22px; fill:#fff; cursor:pointer; }

        /* Subscribed Channels Avatar Bar */
        .sub-channels-tray { display:flex; gap:14px; padding:12px 16px; overflow-x:auto; scrollbar-width:none; align-items:center; border-bottom:1px solid #161616; }
        .sub-channels-tray::-webkit-scrollbar { display:none; }
        .ch-item { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; width:62px; flex-shrink:0; text-decoration:none; }
        .ch-ring { width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg, #ff1a1a, #8b0000); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; color:#fff; position:relative; box-shadow:0 2px 8px rgba(0,0,0,0.5); }
        .ch-dot { position:absolute; bottom:2px; right:2px; width:10px; height:10px; border-radius:50%; background:#3ea6ff; border:2px solid #0f0f0f; }
        .ch-name { font-size:11px; color:#ccc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center; }

        /* Filter Pills */
        .pills-row { display:flex; gap:8px; padding:10px 16px; overflow-x:auto; scrollbar-width:none; }
        .pills-row::-webkit-scrollbar { display:none; }
        .pill-btn { background:#222; border:none; color:#fff; padding:7px 14px; border-radius:8px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; }
        .pill-btn.active { background:#fff; color:#000; }

        /* Content Feed */
        .feed-list { display:flex; flex-direction:column; gap:18px; }
        .video-card { display:flex; flex-direction:column; cursor:pointer; }
        .thumb-box { width:100%; aspect-ratio:16/9; background:#1c1c1c; position:relative; overflow:hidden; }
        .thumb-box img { width:100%; height:100%; object-fit:cover; }
        .dur-tag { position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.85); font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px; }

        .meta-row { display:flex; gap:12px; padding:12px 16px; }
        .avatar-v { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg, #e50914, #7a0000); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; }
        .meta-col { display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
        .v-title { font-size:14px; font-weight:600; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .v-sub { font-size:12px; color:#aaa; }

        .empty-placeholder { text-align:center; padding:70px 20px; color:#777; font-size:14px; }

        /* Bottom Nav */
        .bottom-nav { position:fixed; bottom:0; left:0; width:100%; height:52px; background:#0f0f0f; display:flex; align-items:center; justify-content:space-around; border-top:1px solid #222; z-index:1000; }
        .nav-btn { display:flex; flex-direction:column; align-items:center; font-size:10px; color:#aaa; text-decoration:none; gap:2px; }
        .nav-btn.active { color:#fff; font-weight:700; }
        .nav-btn svg { width:22px; height:22px; fill:currentColor; }
    </style>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <header class="subs-hdr">
        <div class="logo-wrap">
            <div class="bt-badge">B</div>
            <span>BTube</span>
        </div>
        <div class="hdr-actions">
            <svg viewBox="0 0 24 24" onclick="alert('Cast ready')"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            <a href="notifications.html" style="color:#fff;"><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></a>
            <a href="search.html" style="color:#fff;"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></a>
        </div>
    </header>

    <!-- Subscribed Channels Tray -->
    <div class="sub-channels-tray">
        <a href="channel.html" class="ch-item">
            <div class="ch-ring">
                BT
                <div class="ch-dot"></div>
            </div>
            <div class="ch-name">BTube Official</div>
        </a>
    </div>

    <!-- Filter Pills -->
    <div class="pills-row">
        <button class="pill-btn active" onclick="filterSubs('all', this)">All</button>
        <button class="pill-btn" onclick="filterSubs('today', this)">Today</button>
        <button class="pill-btn" onclick="filterSubs('videos', this)">Videos</button>
        <button class="pill-btn" onclick="filterSubs('shorts', this)">Shorts</button>
    </div>

    <!-- Main Feed -->
    <main class="feed-list" id="subsFeed">
        <div class="empty-placeholder">Loading real subscription feed...</div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="../frontend/index.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
        <a href="shorts.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg><span>Shorts</span></a>
        <a href="upload.html" class="nav-btn" style="color:#e50914;"><svg viewBox="0 0 24 24" style="fill:#e50914;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Create</span></a>
        <a href="subscriptions.html" class="nav-btn active"><svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg><span>Subscriptions</span></a>
        <a href="profile.html" class="nav-btn"><div style="width:20px; height:20px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff;">BT</div><span>You</span></a>
    </nav>

    <script>
        let rawFeed = [];

        window.addEventListener('DOMContentLoaded', async () => {
            rawFeed = await window.BTubeAPI.getFeed('all');
            renderFeed(rawFeed);
        });

        function filterSubs(type, btn) {
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (type === 'all' || type === 'today') {
                renderFeed(rawFeed);
            } else if (type === 'videos') {
                renderFeed(rawFeed.filter(i => (i.type || 'video') === 'video'));
            } else if (type === 'shorts') {
                renderFeed(rawFeed.filter(i => (i.type || 'video') === 'short'));
            }
        }

        function renderFeed(items) {
            const container = document.getElementById('subsFeed');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="empty-placeholder">
                        <h3 style="margin-bottom:8px;">Koi naya video nahi hai</h3>
                        <p style="font-size:12px; margin-bottom:16px;">Aapke subscribed channels ka content yahan aayega.</p>
                        <a href="upload.html" style="background:#e50914; color:#fff; padding:9px 20px; border-radius:18px; text-decoration:none; font-weight:700;">+ Upload Content</a>
                    </div>
                `;
                return;
            }

            items.forEach(v => {
                const isShort = (v.type === 'short');
                const safeTitle = v.title || v.name || 'BTube Video';
                const safeChannel = v.channel || 'BTube Official';

                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => {
                    if (isShort) {
                        window.location.href = `shorts.html?id=${v.id}`;
                    } else {
                        window.location.href = `watch.html?id=${v.id}&videoUrl=${encodeURIComponent(v.videoUrl || '')}`;
                    }
                };

                card.innerHTML = `
                    <div class="thumb-box">
                        <img src="${v.thumb || 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800'}">
                        <span class="dur-tag">${isShort ? 'SHORT' : (v.duration || '03:45')}</span>
                    </div>
                    <div class="meta-row">
                        <div class="avatar-v">${safeChannel.substring(0,2).toUpperCase()}</div>
                        <div class="meta-col">
                            <div class="v-title">${safeTitle}</div>
                            <div class="v-sub">${safeChannel} • ${v.views || 0} views • Cloud Stream</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
