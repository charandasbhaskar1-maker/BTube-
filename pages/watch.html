<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Watch - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:70px; }
        .video-viewport { width:100%; aspect-ratio:16/9; background:#000; position:sticky; top:0; z-index:500; }
        video { width:100%; height:100%; object-fit:contain; }
        .watch-details { padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
        .video-headline { font-size:16px; font-weight:700; line-height:1.35; }
        .video-meta-row { display:flex; align-items:center; gap:8px; font-size:12px; color:#aaa; }
        .action-tray { display:flex; gap:10px; overflow-x:auto; padding:6px 0; scrollbar-width:none; }
        .action-tray::-webkit-scrollbar { display:none; }
        .act-pill { background:#222; border:none; color:#fff; padding:8px 16px; border-radius:20px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; cursor:pointer; flex-shrink:0; }
        .act-pill svg { width:16px; height:16px; fill:#fff; }
        .channel-strip { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid #222; border-bottom:1px solid #222; margin-top:4px; }
        .channel-info { display:flex; align-items:center; gap:12px; text-decoration:none; color:#fff; }
        .avatar-c { width:38px; height:38px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; }
        .btn-sub { background:#fff; color:#000; border:none; padding:8px 16px; border-radius:20px; font-size:13px; font-weight:800; cursor:pointer; }
    </style>
</head>
<body>
    <div class="video-viewport">
        <video id="mainVideoPlayer" controls autoplay playsinline poster="https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800">
            <source id="videoSource" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
            Your browser does not support video playback.
        </video>
    </div>

    <div class="watch-details">
        <h1 class="video-headline" id="watchTitle">Chhattisgarhi song maya ke rang</h1>
        <div class="video-meta-row">
            <span id="watchMeta">210K views • 2 weeks ago</span>
            <span>• #Chhattisgarhi #BTube</span>
        </div>

        <div class="channel-strip">
            <a href="channel.html" class="channel-info">
                <div class="avatar-c" id="channelAvatar">CB</div>
                <div>
                    <div style="font-size:14px; font-weight:700;" id="channelName">Charandas Bhaskar</div>
                    <div style="font-size:11px; color:#aaa;">1.25K subscribers</div>
                </div>
            </a>
            <button class="btn-sub" id="btnSubscribe" onclick="toggleSub()">Subscribe</button>
        </div>

        <div class="action-tray">
            <button class="act-pill" onclick="likeVideo(this)">
                <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                <span id="likeCount">18K</span>
            </button>
            <button class="act-pill">
                <svg viewBox="0 0 24 24"><path d="M15 4v7H5.17l-.59.59-.58.58V4h11m1-2H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1V3c0-.55-.45-1-1-1z"/></svg>
                <span>Share</span>
            </button>
            <button class="act-pill">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                <span>Download</span>
            </button>
        </div>
    </div>

    <!-- API Client Integration -->
    <script src="../assets/js/api-client.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const titleParam = params.get('title');
        const channelParam = params.get('channel');
        const videoUrlParam = params.get('videoUrl');

        window.addEventListener('DOMContentLoaded', () => {
            const player = document.getElementById('mainVideoPlayer');
            const source = document.getElementById('videoSource');

            if (titleParam) {
                document.getElementById('watchTitle').innerText = decodeURIComponent(titleParam);
            }
            if (channelParam) {
                document.getElementById('channelName').innerText = decodeURIComponent(channelParam);
            }

            // Set playable video stream
            if (videoUrlParam) {
                source.src = decodeURIComponent(videoUrlParam);
                player.load();
                player.play().catch(() => {});
            }

            // Accumulate watch time in BPP
            if (window.BTubeAPI && typeof window.BTubeAPI.recordView === 'function') {
                window.BTubeAPI.recordView(params.get('id') || 'vid_1', 30);
            }
        });

        function toggleSub() {
            const b = document.getElementById('btnSubscribe');
            if (b.innerText === 'Subscribe') {
                b.innerText = 'Subscribed';
                b.style.background = '#333';
                b.style.color = '#fff';
            } else {
                b.innerText = 'Subscribe';
                b.style.background = '#fff';
                b.style.color = '#000';
            }
        }

        function likeVideo(btn) {
            btn.style.color = '#e50914';
            btn.querySelector('svg').style.fill = '#e50914';
            document.getElementById('likeCount').innerText = '19K';
        }
    </script>
</body>
</html>
