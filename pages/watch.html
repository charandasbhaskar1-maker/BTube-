<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Watch - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background:#0f0f0f; color:#fff; padding-bottom:70px; }
        
        .player-box { width:100%; aspect-ratio:16/9; background:#000; position:relative; }
        video { width:100%; height:100%; object-fit:contain; }
        
        .play-overlay-btn { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.3); z-index:10; cursor:pointer; }
        .play-circle { width:58px; height:58px; border-radius:50%; background:rgba(229,9,20,0.9); display:flex; align-items:center; justify-content:center; }
        .play-circle svg { width:28px; height:28px; fill:#fff; margin-left:3px; }

        .watch-details { padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
        .video-headline { font-size:16px; font-weight:700; line-height:1.35; }
        .video-meta-row { display:flex; align-items:center; gap:8px; font-size:12px; color:#aaa; }

        .action-tray { display:flex; gap:10px; overflow-x:auto; padding:6px 0; }
        .act-pill { background:#222; border:none; color:#fff; padding:8px 16px; border-radius:20px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; cursor:pointer; flex-shrink:0; }
        .act-pill svg { width:16px; height:16px; fill:#fff; }

        .channel-strip { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid #222; border-bottom:1px solid #222; }
        .channel-info { display:flex; align-items:center; gap:12px; text-decoration:none; color:#fff; }
        .avatar-c { width:38px; height:38px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; }
        .btn-sub { background:#fff; color:#000; border:none; padding:8px 16px; border-radius:20px; font-size:13px; font-weight:800; cursor:pointer; }
    </style>
</head>
<body>

    <div class="player-box">
        <video id="vidPlayer" controls playsinline preload="auto">
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        </video>
        <div class="play-overlay-btn" id="playOverlay" onclick="startPlay()">
            <div class="play-circle">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
        </div>
    </div>

    <div class="watch-details">
        <h1 class="video-headline" id="vidTitle">Chhattisgarhi Panthi Song Special</h1>
        <div class="video-meta-row">
            <span>210K views • 2 weeks ago</span>
            <span>• #Chhattisgarhi #BTube</span>
        </div>

        <div class="channel-strip">
            <a href="channel.html" class="channel-info">
                <div class="avatar-c">CB</div>
                <div>
                    <div style="font-size:14px; font-weight:700;">Charandas Bhaskar</div>
                    <div style="font-size:11px; color:#aaa;">245 subscribers</div>
                </div>
            </a>
            <button class="btn-sub" id="btnSub" onclick="toggleSub()">Subscribe</button>
        </div>

        <div class="action-tray">
            <button class="act-pill" onclick="this.style.color='#e50914'">
                <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                <span>12K</span>
            </button>
            <button class="act-pill">
                <svg viewBox="0 0 24 24"><path d="M15 4v7H5.17l-.59.59-.58.58V4h11m1-2H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1V3c0-.55-.45-1-1-1z"/></svg>
                <span>Share</span>
            </button>
        </div>
    </div>

    <script>
        const player = document.getElementById('vidPlayer');
        const overlay = document.getElementById('playOverlay');

        function startPlay() {
            overlay.style.display = 'none';
            player.play();
        }

        player.onplay = () => { overlay.style.display = 'none'; };
        player.onpause = () => { overlay.style.display = 'flex'; };

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const t = params.get('title');
            if (t) document.getElementById('vidTitle').innerText = decodeURIComponent(t);

            // Auto-try play
            player.play().then(() => {
                overlay.style.display = 'none';
            }).catch(() => {
                // If browser blocks audio autoplay, keep overlay visible for 1-tap start
                overlay.style.display = 'flex';
            });
        });

        function toggleSub() {
            const b = document.getElementById('btnSub');
            b.innerText = (b.innerText === 'Subscribe') ? 'Subscribed' : 'Subscribe';
            b.style.background = (b.innerText === 'Subscribed') ? '#333' : '#fff';
            b.style.color = (b.innerText === 'Subscribed') ? '#fff' : '#000';
        }
    </script>
</body>
</html>
