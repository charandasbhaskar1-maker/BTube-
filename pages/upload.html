<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Upload - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:40px; }
        .up-header { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid #222; position:sticky; top:0; background:#0f0f0f; z-index:100; }
        .header-left { display:flex; align-items:center; gap:16px; }
        .btn-back { background:none; border:none; color:#fff; cursor:pointer; display:flex; }
        .btn-back svg { width:22px; height:22px; fill:#fff; }
        .btn-publish { background:#e50914; color:#fff; border:none; padding:8px 20px; border-radius:20px; font-weight:700; font-size:13px; cursor:pointer; }
        .btn-publish:disabled { opacity:0.5; }
        
        .form-wrap { padding:16px; display:flex; flex-direction:column; gap:18px; max-width:600px; margin:0 auto; }
        .file-drop-area { width:100%; border:2px dashed #333; border-radius:12px; padding:24px 16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:#141414; cursor:pointer; text-align:center; }
        .file-drop-area.active { border-color:#e50914; background:#1f1414; }
        .file-drop-icon svg { width:42px; height:42px; fill:#e50914; }

        .type-toggle-row { display:flex; background:#1a1a1a; padding:4px; border-radius:10px; gap:4px; }
        .toggle-btn { flex:1; background:none; border:none; color:#aaa; padding:10px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; }
        .toggle-btn.active { background:#e50914; color:#fff; }

        .input-group { display:flex; flex-direction:column; gap:6px; }
        .input-group label { font-size:12px; color:#aaa; font-weight:600; }
        .input-group input, .input-group textarea, .input-group select { background:#181818; border:1px solid #333; border-radius:10px; padding:12px 14px; color:#fff; font-size:14px; outline:none; }
        .input-group input:focus, .input-group textarea:focus { border-color:#e50914; }
    </style>
</head>
<body>

    <header class="up-header">
        <div class="header-left">
            <button class="btn-back" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span style="font-size:17px; font-weight:700;">Upload Content</span>
        </div>
        <button class="btn-publish" id="publishBtn" onclick="handleUpload()">Upload</button>
    </header>

    <div class="form-wrap">
        <!-- Type Selection Toggle -->
        <div class="type-toggle-row">
            <button type="button" class="toggle-btn active" id="btnTypeVideo" onclick="setType('video')">Long Video</button>
            <button type="button" class="toggle-btn" id="btnTypeShort" onclick="setType('short')">Short (9:16)</button>
        </div>

        <!-- File Select Box -->
        <div class="file-drop-area" id="dropArea" onclick="document.getElementById('videoFileInput').click()">
            <div class="file-drop-icon">
                <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            </div>
            <div style="font-size:14px; font-weight:600;" id="fileChosenLabel">Tap to select video file</div>
            <span style="font-size:11px; color:#888;">MP4, WebM or MOV up to 1GB</span>
            <input type="file" id="videoFileInput" accept="video/*" style="display:none;" onchange="onFileSelected(event)">
        </div>

        <div class="input-group">
            <label>Title</label>
            <input type="text" id="videoTitleInput" placeholder="Add title (e.g. Mungeli folk music)">
        </div>

        <div class="input-group">
            <label>Description</label>
            <textarea id="videoDescInput" rows="3" placeholder="Tell viewers about your video..."></textarea>
        </div>

        <div class="input-group">
            <label>Visibility</label>
            <select id="videoVisibilityInput">
                <option value="Public">Public (Anyone can view)</option>
                <option value="Unlisted">Unlisted (Anyone with link)</option>
                <option value="Private">Private (Only you)</option>
            </select>
        </div>
    </div>

    <script>
        let selectedUploadType = 'video';
        let selectedLocalFileUrl = null;

        function setType(type) {
            selectedUploadType = type;
            document.getElementById('btnTypeVideo').classList.toggle('active', type === 'video');
            document.getElementById('btnTypeShort').classList.toggle('active', type === 'short');
            
            const titleInput = document.getElementById('videoTitleInput');
            if (type === 'short' && !titleInput.value.includes('#shorts')) {
                titleInput.value = (titleInput.value.trim() + ' #shorts').trim();
            }
        }

        function onFileSelected(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileChosenLabel').innerText = file.name;
                selectedLocalFileUrl = URL.createObjectURL(file);

                // Auto-detect title
                const baseName = file.name.replace(/\.[^/.]+$/, "");
                const titleField = document.getElementById('videoTitleInput');
                if (!titleField.value) {
                    titleField.value = selectedUploadType === 'short' ? `${baseName} #shorts` : baseName;
                }
            }
        }

        function handleUpload() {
            const title = document.getElementById('videoTitleInput').value.trim() || 'Untitled Video';
            const desc = document.getElementById('videoDescInput').value.trim();
            const vis = document.getElementById('videoVisibilityInput').value;
            const btn = document.getElementById('publishBtn');

            // Force detect if title contains #short or #shorts
            const isShort = (selectedUploadType === 'short') || title.toLowerCase().includes('#short');

            btn.disabled = true;
            btn.innerText = 'Publishing...';

            if (isShort) {
                // Route directly to SHORTS collection
                let shorts = JSON.parse(localStorage.getItem('btube_user_shorts') || '[]');
                const newShort = {
                    id: 'short_' + Date.now(),
                    title: title,
                    desc: desc,
                    visibility: vis,
                    views: 0,
                    age: 'Just now',
                    videoUrl: selectedLocalFileUrl || 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
                    thumb: 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=600',
                    type: 'short'
                };
                shorts.unshift(newShort);
                localStorage.setItem('btube_user_shorts', JSON.stringify(shorts));

                setTimeout(() => {
                    window.location.href = 'your-videos.html?tab=shorts';
                }, 400);

            } else {
                // Route directly to VIDEOS collection
                let videos = JSON.parse(localStorage.getItem('btube_user_videos') || '[]');
                const newVideo = {
                    id: 'vid_' + Date.now(),
                    title: title,
                    desc: desc,
                    visibility: vis,
                    views: 0,
                    duration: '03:45',
                    age: 'Just now',
                    restriction: 'None',
                    videoUrl: selectedLocalFileUrl || 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
                    thumb: 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800',
                    type: 'video'
                };
                videos.unshift(newVideo);
                localStorage.setItem('btube_user_videos', JSON.stringify(videos));

                setTimeout(() => {
                    window.location.href = 'your-videos.html';
                }, 400);
            }
        }
    </script>
</body>
</html>
