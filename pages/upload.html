<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Create - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:rgba(0,0,0,0.7); color:#fff; height:100vh; display:flex; flex-direction:column; justify-content:flex-end; }

        .sheet-container { background:#1e1e1e; border-top-left-radius:18px; border-top-right-radius:18px; padding:16px 20px 30px; display:flex; flex-direction:column; gap:8px; animation:slideUp 0.25s ease-out; }
        @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

        .sheet-header { display:flex; align-items:center; justify-content:space-between; padding-bottom:12px; border-bottom:1px solid #2e2e2e; margin-bottom:6px; }
        .sheet-title { font-size:17px; font-weight:800; }
        .close-btn { background:none; border:none; color:#aaa; cursor:pointer; }
        .close-btn svg { width:22px; height:22px; fill:#aaa; }

        .menu-action-item { display:flex; align-items:center; gap:16px; padding:14px 8px; text-decoration:none; color:#fff; border-radius:10px; transition:background 0.2s; }
        .menu-action-item:active { background:#2a2a2a; }

        .icon-circle { width:44px; height:44px; border-radius:50%; background:#2a2a2a; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .icon-circle svg { width:22px; height:22px; fill:#fff; }

        .action-details { display:flex; flex-direction:column; gap:2px; }
        .action-name { font-size:15px; font-weight:700; }
        .action-sub { font-size:11px; color:#888; }
    </style>
</head>
<body>

    <div class="sheet-container">
        <div class="sheet-header">
            <span class="sheet-title">Create</span>
            <button class="close-btn" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>

        <!-- 1. Create a Short -->
        <a href="upload-short.html" class="menu-action-item">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
            </div>
            <div class="action-details">
                <span class="action-name">Create a Short</span>
                <span class="action-sub">Upload 9:16 vertical short video</span>
            </div>
        </a>

        <!-- 2. Upload a Video -->
        <a href="upload-video.html" class="menu-action-item">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </div>
            <div class="action-details">
                <span class="action-name">Upload a video</span>
                <span class="action-sub">Upload regular long video (16:9)</span>
            </div>
        </a>

        <!-- 3. Go Live -->
        <a href="go-live.html" class="menu-action-item">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
            </div>
            <div class="action-details">
                <span class="action-name">Go live</span>
                <span class="action-sub">Broadcast live to your viewers</span>
            </div>
        </a>

        <!-- 4. Create a Post -->
        <a href="create-post.html" class="menu-action-item">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            </div>
            <div class="action-details">
                <span class="action-name">Create a post</span>
                <span class="action-sub">Share text, image or polls</span>
            </div>
        </a>
    </div>

</body>
</html>
