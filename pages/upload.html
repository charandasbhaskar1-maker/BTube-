<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>Create - BTube</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            padding-bottom: 75px;
            overflow-x: hidden;
        }

        /* 1. TOP HEADER */
        .upload-header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            background: #0f0f0f;
            z-index: 1000;
            border-bottom: 1px solid #1f1f1f;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-nav-close {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .upload-header-title {
            font-size: 18px;
            font-weight: 700;
        }

        .btn-post-upload {
            background: #3ea6ff;
            color: #0f0f0f;
            border: none;
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        /* 2. CREATION MODES TRAY */
        .creation-modes-grid {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .create-mode-card {
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            text-decoration: none;
            color: #ffffff;
        }

        .create-mode-card:active {
            background: #252525;
        }

        .mode-icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #272727;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .mode-icon-circle svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        .mode-info-meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .mode-name {
            font-size: 15px;
            font-weight: 700;
        }

        .mode-desc {
            font-size: 12px;
            color: #888888;
        }

        /* 3. UPLOAD FORM STAGE */
        .upload-details-form {
            display: none;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
        }

        .preview-media-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #141414;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px dashed #333333;
        }

        .preview-media-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .preview-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #888888;
            font-size: 13px;
        }

        .preview-placeholder svg {
            width: 32px;
            height: 32px;
            fill: #666666;
        }

        .form-group-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label-txt {
            font-size: 12px;
            font-weight: 600;
            color: #aaaaaa;
        }

        .form-input-ctrl {
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .form-input-ctrl:focus {
            border-color: #3ea6ff;
        }

        .form-textarea-ctrl {
            min-height: 80px;
            resize: none;
        }

        .visibility-select-box {
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        /* 4. PROGRESS BAR */
        .upload-progress-wrapper {
            display: none;
            flex-direction: column;
            gap: 8px;
            background: #1c1c1c;
            padding: 14px;
            border-radius: 10px;
        }

        .progress-meta-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: #2a2a2a;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #3ea6ff;
            transition: width 0.2s linear;
        }

        /* Hidden File Input */
        #hiddenFileInput {
            display: none;
        }

        /* Toast */
        .toast-msg-bubble {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(33, 33, 33, 0.95);
            border: 1px solid #444;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 3000;
            display: none;
        }

        /* 5. BOTTOM NAVIGATION */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid #272727;
            z-index: 1000;
        }

        .nav-tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #aaaaaa;
            text-decoration: none;
            gap: 3px;
        }

        .nav-tab-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-plus-circle {
            background: #ffffff;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f0f0f;
            text-decoration: none;
        }

        .nav-plus-circle svg {
            width: 22px;
            height: 22px;
            fill: #0f0f0f;
        }
    </style>
</head>
<body>

    <!-- 1. TOP HEADER -->
    <header class="upload-header">
        <div class="header-left">
            <a href="../frontend/index.html" class="btn-nav-close">✕</a>
            <span class="upload-header-title" id="headerTitle">Create</span>
        </div>
        <button class="btn-post-upload" id="uploadActionBtn" onclick="startSimulatedUpload()">Upload</button>
    </header>

    <!-- 2. FILE INPUT (Hidden) -->
    <input type="file" id="hiddenFileInput" accept="video/*" onchange="handleFilePicked(event)">

    <!-- 3. MODE SELECTION VIEW -->
    <main class="creation-modes-grid" id="modeSelectView">
        <!-- Short -->
        <div class="create-mode-card" onclick="triggerFilePicker('short')">
            <div class="mode-icon-circle" style="background: rgba(255, 0, 0, 0.15);">
                <svg viewBox="0 0 24 24" style="fill: #ff0000;"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
            </div>
            <div class="mode-info-meta">
                <span class="mode-name">Create a Short</span>
                <span class="mode-desc">Share a quick vertical video up to 60s</span>
            </div>
        </div>

        <!-- Video -->
        <div class="create-mode-card" onclick="triggerFilePicker('video')">
            <div class="mode-icon-circle">
                <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
            </div>
            <div class="mode-info-meta">
                <span class="mode-name">Upload a video</span>
                <span class="mode-desc">Publish full songs, banjo tutorials or vlogs</span>
            </div>
        </div>

        <!-- Go Live -->
        <div class="create-mode-card" onclick="showToastBubble('Live streaming will be enabled for verified creators')">
            <div class="mode-icon-circle">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
            </div>
            <div class="mode-info-meta">
                <span class="mode-name">Go Live</span>
                <span class="mode-desc">Broadcast live to your audience</span>
            </div>
        </div>
    </main>

    <!-- 4. UPLOAD METADATA FORM -->
    <section class="upload-details-form" id="uploadFormView">
        <!-- Media Preview -->
        <div class="preview-media-box" id="previewBox" onclick="document.getElementById('hiddenFileInput').click()">
            <video id="previewVideoTag" controls playsinline></video>
            <div class="preview-placeholder" id="previewPlaceholder">
                <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM5 15h14l-4.5-6-3.5 4.51-2.5-3.01z"/></svg>
                <span id="fileNameLabel">Tap to select or change video</span>
            </div>
        </div>

        <!-- Progress Tracker -->
        <div class="upload-progress-wrapper" id="progressBox">
            <div class="progress-meta-row">
                <span id="progressStatusText">Uploading to BTube...</span>
                <span id="progressPercentText">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <!-- Title -->
        <div class="form-group-field">
            <label class="form-label-txt">Title (required)</label>
            <input type="text" id="videoTitleInput" class="form-input-ctrl" placeholder="Create a title (type @ to mention a channel)">
        </div>

        <!-- Description -->
        <div class="form-group-field">
            <label class="form-label-txt">Description</label>
            <textarea id="videoDescInput" class="form-input-ctrl form-textarea-ctrl" placeholder="Tell viewers about your video"></textarea>
        </div>

        <!-- Visibility -->
        <div class="form-group-field">
            <label class="form-label-txt">Visibility</label>
            <select class="visibility-select-box" id="visibilitySelect">
                <option value="Public">Public (Anyone can search and view)</option>
                <option value="Unlisted">Unlisted (Anyone with link can view)</option>
                <option value="Private">Private (Only you can view)</option>
            </select>
        </div>
    </section>

    <!-- Toast Bubble -->
    <div class="toast-msg-bubble" id="uploadToast"></div>

    <!-- 5. BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav-fixed">
        <a href="../frontend/index.html" class="nav-tab-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="shorts.html" class="nav-tab-item">
            <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
            <span>Shorts</span>
        </a>
        <a href="upload.html" class="nav-plus-circle">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </a>
        <a href="subscriptions.html" class="nav-tab-item">
            <svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg>
            <span>Subs</span>
        </a>
        <a href="profile.html" class="nav-tab-item">
            <div style="width:22px; height:22px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff;">CB</div>
            <span>You</span>
        </a>
    </nav>

    <!-- SCRIPT LOGIC -->
    <script>
        let currentUploadType = 'video';

        function showToastBubble(text) {
            const toast = document.getElementById('uploadToast');
            toast.innerText = text;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2200);
        }

        function triggerFilePicker(type) {
            currentUploadType = type;
            document.getElementById('hiddenFileInput').click();
        }

        function handleFilePicked(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Switch view
            document.getElementById('modeSelectView').style.display = 'none';
            document.getElementById('uploadFormView').style.display = 'flex';
            document.getElementById('uploadActionBtn').style.display = 'block';
            document.getElementById('headerTitle').innerText = currentUploadType === 'short' ? 'Details (Short)' : 'Details (Video)';

            // Auto-fill title with file name
            const cleanName = file.name.replace(/\.[^/.]+$/, "");
            document.getElementById('videoTitleInput').value = cleanName;

            // Preview video
            const videoTag = document.getElementById('previewVideoTag');
            const placeholder = document.getElementById('previewPlaceholder');
            const fileURL = URL.createObjectURL(file);

            videoTag.src = fileURL;
            videoTag.style.display = 'block';
            placeholder.style.display = 'none';
        }

        function startSimulatedUpload() {
            const title = document.getElementById('videoTitleInput').value.trim();
            if (!title) {
                showToastBubble('Please enter a video title');
                document.getElementById('videoTitleInput').focus();
                return;
            }

            const btn = document.getElementById('uploadActionBtn');
            btn.disabled = true;
            btn.style.opacity = '0.5';

            const progressBox = document.getElementById('progressBox');
            const bar = document.getElementById('progressBarFill');
            const percentTxt = document.getElementById('progressPercentText');
            const statusTxt = document.getElementById('progressStatusText');

            progressBox.style.display = 'flex';

            let progress = 0;
            const timer = setInterval(() => {
                progress += 15;
                if (progress > 100) progress = 100;

                bar.style.width = progress + '%';
                percentTxt.innerText = progress + '%';

                if (progress === 100) {
                    clearInterval(timer);
                    statusTxt.innerText = 'Processing complete ✓';
                    showToastBubble('Video published successfully!');

                    setTimeout(() => {
                        window.location.href = `watch.html?title=${encodeURIComponent(title)}&channel=Charandas+Bhaskar`;
                    }, 1200);
                }
            }, 250);
        }
    </script>
</body>
</html>
