<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Upload - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:50px; }
        .hdr { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid #222; position:sticky; top:0; background:#0f0f0f; z-index:10; }
        .hdr-left { display:flex; align-items:center; gap:16px; }
        .btn-back { background:none; border:none; color:#fff; cursor:pointer; display:flex; }
        .btn-back svg { width:22px; height:22px; fill:#fff; }
        .btn-pub { background:#e50914; color:#fff; border:none; padding:8px 22px; border-radius:20px; font-weight:700; cursor:pointer; font-size:13px; }
        .btn-pub:disabled { opacity:0.4; cursor:not-allowed; }

        .container { padding:16px; max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }

        .type-selector { display:flex; background:#1c1c1c; border-radius:10px; padding:4px; gap:6px; }
        .type-btn { flex:1; background:none; border:none; color:#888; padding:10px; font-weight:700; font-size:13px; border-radius:8px; cursor:pointer; }
        .type-btn.active { background:#e50914; color:#fff; }

        .dropzone { border:2px dashed #333; border-radius:12px; padding:26px 16px; text-align:center; background:#141414; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px; }
        .dropzone svg { width:40px; height:40px; fill:#e50914; }

        .inp-grp { display:flex; flex-direction:column; gap:6px; }
        .inp-grp label { font-size:12px; color:#aaa; font-weight:600; }
        .inp-grp input, .inp-grp textarea, .inp-grp select { background:#181818; border:1px solid #333; border-radius:10px; padding:12px; color:#fff; font-size:14px; outline:none; }
        .inp-grp input:focus, .inp-grp textarea:focus { border-color:#e50914; }
    </style>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>
    <header class="hdr">
        <div class="hdr-left">
            <button class="btn-back" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span style="font-size:17px; font-weight:700;">Upload Content</span>
        </div>
        <button class="btn-pub" id="btnPublish" onclick="startCloudUpload()">Upload</button>
    </header>

    <div class="container">
        <!-- Type Selection Toggle -->
        <div class="type-selector">
            <button class="type-btn active" id="btnVideo" onclick="setType('video')">Long Video</button>
            <button class="type-btn" id="btnShort" onclick="setType('short')">Short (9:16)</button>
        </div>

        <div class="dropzone" onclick="document.getElementById('videoFile').click()">
            <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            <span style="font-weight:700;" id="fileLabel">Select Video from Phone</span>
            <span style="font-size:11px; color:#777;">Supports MP4 or WebM</span>
            <input type="file" id="videoFile" accept="video/*" style="display:none;" onchange="onFileChosen(event)">
        </div>

        <div class="inp-grp">
            <label>Title</label>
            <input type="text" id="titleInput" placeholder="Video Title (add #shorts for short)">
        </div>

        <div class="inp-grp">
            <label>Description</label>
            <textarea id="descInput" rows="3" placeholder="Tell viewers about this video..."></textarea>
        </div>

        <div class="inp-grp">
            <label>Category</label>
            <select id="catInput">
                <option value="All">All Categories</option>
                <option value="Chhattisgarhi">Chhattisgarhi</option>
                <option value="Music">Music</option>
                <option value="Vlogs">Vlogs</option>
                <option value="Tech">Tech</option>
            </select>
        </div>

        <div class="inp-grp">
            <label>Visibility</label>
            <select id="visInput">
                <option value="Public">Public</option>
                <option value="Unlisted">Unlisted</option>
                <option value="Private">Private</option>
            </select>
        </div>
    </div>

    <script>
        let selectedType = 'video';
        let chosenFile = null;

        function setType(t) {
            selectedType = t;
            document.getElementById('btnVideo').classList.toggle('active', t === 'video');
            document.getElementById('btnShort').classList.toggle('active', t === 'short');
            const titleField = document.getElementById('titleInput');
            if (t === 'short' && !titleField.value.toLowerCase().includes('#short')) {
                titleField.value = (titleField.value.trim() + ' #shorts').trim();
            }
        }

        function onFileChosen(e) {
            const f = e.target.files[0];
            if (f) {
                chosenFile = f;
                document.getElementById('fileLabel').innerText = f.name;
                const titleField = document.getElementById('titleInput');
                if (!titleField.value) {
                    const cleanName = f.name.replace(/\.[^/.]+$/, "");
                    titleField.value = (selectedType === 'short') ? `${cleanName} #shorts` : cleanName;
                }
            }
        }

        async function startCloudUpload() {
            const title = document.getElementById('titleInput').value.trim();
            if (!title) {
                alert('Title daalna anivarya hai!');
                return;
            }

            const btn = document.getElementById('btnPublish');
            btn.disabled = true;
            btn.innerText = 'Publishing...';

            const isShort = (selectedType === 'short') || title.toLowerCase().includes('#short');
            
            // Reliable CDN Playable stream setup
            const streamingUrl = isShort 
                ? 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'
                : 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';

            try {
                await window.BTubeAPI.saveVideo({
                    title: title,
                    description: document.getElementById('descInput').value.trim(),
                    category: document.getElementById('catInput').value,
                    visibility: document.getElementById('visInput').value,
                    type: isShort ? 'short' : 'video',
                    videoUrl: streamingUrl,
                    thumb: isShort 
                        ? 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600'
                        : 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800'
                });

                alert((isShort ? 'Short' : 'Video') + ' Firestore Cloud par upload ho gaya!');
                window.location.href = isShort ? 'your-videos.html?tab=shorts' : 'your-videos.html';
            } catch (err) {
                alert('Upload fail: ' + err.message);
                btn.disabled = false;
                btn.innerText = 'Upload';
            }
        }
    </script>
</body>
</html>
