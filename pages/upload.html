<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>Create - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; min-height:100vh; display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; }

        /* Dimmed Ambient Background */
        .scrim-bg { position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(10px); z-index:10; }

        /* YouTube Native Create Bottom Sheet */
        .create-sheet { position:relative; z-index:20; width:100%; max-width:540px; margin:0 auto; background:#212121; border-top-left-radius:20px; border-top-right-radius:20px; padding:16px 16px 28px; display:flex; flex-direction:column; gap:8px; box-shadow:0 -10px 30px rgba(0,0,0,0.9); animation:slideUp 0.22s cubic-bezier(0, 0, 0.2, 1); }
        @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

        .sheet-drag-handle { width:38px; height:4px; background:#484848; border-radius:2px; margin:0 auto 10px; }
        
        .sheet-top-row { display:flex; align-items:center; justify-content:space-between; padding:0 8px 10px; border-bottom:1px solid #2e2e2e; }
        .sheet-title { font-size:18px; font-weight:800; letter-spacing:-0.2px; }
        .btn-close { background:#2a2a2a; border:none; width:30px; height:30px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .btn-close svg { width:18px; height:18px; fill:#fff; }

        /* Creator Channel Identity Strip */
        .creator-chip { display:flex; align-items:center; gap:10px; padding:10px 12px; margin:4px 0 6px; background:#181818; border-radius:12px; border:1px solid #2b2b2b; }
        .c-av { width:34px; height:34px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; overflow:hidden; flex-shrink:0; }
        .c-av img { width:100%; height:100%; object-fit:cover; }
        .c-info { display:flex; flex-direction:column; gap:2px; min-width:0; }
        .c-name { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .c-status { font-size:11px; color:#3ea6ff; font-weight:600; }

        /* Create Action Buttons List */
        .action-list { display:flex; flex-direction:column; gap:4px; }
        
        .action-item { display:flex; align-items:center; gap:16px; padding:13px 12px; border-radius:12px; text-decoration:none; color:#fff; transition:background 0.15s; }
        .action-item:active { background:#2c2c2c; }

        .action-icon-circle { width:46px; height:46px; border-radius:50%; background:#2c2c2c; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform 0.15s; }
        .action-item:active .action-icon-circle { transform:scale(0.94); }
        .action-icon-circle svg { width:24px; height:24px; fill:#fff; }

        .action-texts { display:flex; flex-direction:column; gap:3px; flex:1; }
        .action-label { font-size:15px; font-weight:600; color:#fff; }
        .action-sub { font-size:12px; color:#aaa; line-height:1.3; }

        /* Accent Icon Colors */
        .icon-short { background:rgba(229, 9, 20, 0.15); }
        .icon-short svg { fill:#e50914; }

        .icon-upload { background:rgba(62, 166, 255, 0.15); }
        .icon-upload svg { fill:#3ea6ff; }

        .icon-live { background:rgba(235, 47, 47, 0.15); }
        .icon-live svg { fill:#ff3b30; }

        .icon-post { background:rgba(46, 204, 113, 0.15); }
        .icon-post svg { fill:#2ecc71; }

        /* Arrow Indicator */
        .action-arrow { width:16px; height:16px; fill:#555; }
    </style>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <!-- Backdrop Click to go back -->
    <div class="scrim-bg" onclick="window.history.back()"></div>

    <!-- YouTube Creator Bottom Sheet Hub -->
    <main class="create-sheet">
        <div class="sheet-drag-handle"></div>

        <div class="sheet-top-row">
            <span class="sheet-title">Create</span>
            <button class="btn-close" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>

        <!-- Authenticated Channel Indicator -->
        <div class="creator-chip">
            <div class="c-av" id="creatorAvatar">BT</div>
            <div class="c-info">
                <span class="c-name" id="creatorName">Channel</span>
                <span class="c-status">● Publishing as active channel</span>
            </div>
        </div>

        <div class="action-list">

            <!-- 1. Create a Short -->
            <a href="create-short.html" class="action-item">
                <div class="action-icon-circle icon-short">
                    <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
                </div>
                <div class="action-texts">
                    <span class="action-label">Create a Short</span>
                    <span class="action-sub">Record or upload vertical reel with music</span>
                </div>
                <svg class="action-arrow" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>

            <!-- 2. Upload a video -->
            <a href="upload-video.html" class="action-item">
                <div class="action-icon-circle icon-upload">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                </div>
                <div class="action-texts">
                    <span class="action-label">Upload a video</span>
                    <span class="action-sub">Publish standard 16:9 full HD video</span>
                </div>
                <svg class="action-arrow" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>

            <!-- 3. Go live -->
            <a href="go-live.html" class="action-item">
                <div class="action-icon-circle icon-live">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
                </div>
                <div class="action-texts">
                    <span class="action-label">Go live</span>
                    <span class="action-sub">Stream live to your audience</span>
                </div>
                <svg class="action-arrow" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>

            <!-- 4. Create a post -->
            <a href="post.html" class="action-item">
                <div class="action-icon-circle icon-post">
                    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                </div>
                <div class="action-texts">
                    <span class="action-label">Create a post</span>
                    <span class="action-sub">Share image, poll, or text update</span>
                </div>
                <svg class="action-arrow" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>

        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const authUser = window.BTubeAPI ? window.BTubeAPI.getAuthUser() : JSON.parse(localStorage.getItem('btube_user') || 'null');
            let activeCh = null;

            if (window.BTubeAPI && typeof window.BTubeAPI.getActiveChannel === 'function') {
                activeCh = await window.BTubeAPI.getActiveChannel();
            }

            const name = activeCh?.name || authUser?.name || 'Creator';
            const avatar = activeCh?.avatar || authUser?.photo;

            document.getElementById('creatorName').innerText = name;
            const av = document.getElementById('creatorAvatar');
            if (avatar) {
                av.innerHTML = `<img src="${avatar}">`;
            } else {
                av.innerText = name.substring(0, 2).toUpperCase();
            }
        });
    </script>
</body>
</html>
