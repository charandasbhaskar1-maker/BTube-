<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>BTube Shorts</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%;
      background: #000; color: #fff;
      font-family: Arial, sans-serif;
    }
    body { overflow: hidden; }
    .top {
      position: fixed; top: 0; left: 0; right: 0;
      height: 54px; padding: 0 16px;
      display: flex; align-items: center;
      justify-content: space-between; z-index: 10;
      background: linear-gradient(#000b, transparent);
    }
    .brand { font-size: 20px; font-weight: 800; }
    a { color: #fff; text-decoration: none; }
    .top a { font-size: 14px; }
    #shortsViewport {
      position: absolute; inset: 0 0 56px;
      overflow-y: auto; scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    #shortsViewport::-webkit-scrollbar { display: none; }
    .short-slide {
      position: relative; width: 100%; height: 100%;
      min-height: 100%; background: #111;
      scroll-snap-align: start; overflow: hidden;
    }
    .short-media-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: contain;
      background: #000;
    }
    .scrim-bottom {
      position: absolute; inset: 45% 0 0;
      background: linear-gradient(transparent, #000d);
      pointer-events: none;
    }
    .shorts-meta-box {
      position: absolute; left: 16px; right: 78px;
      bottom: 22px; z-index: 2;
    }
    .creator-user-name { font-size: 14px; font-weight: 700; }
    .short-caption-text { font-size: 14px; line-height: 1.4; }
    .shorts-rail {
      position: absolute; right: 12px; bottom: 24px;
      z-index: 3; display: flex; flex-direction: column;
      gap: 20px; align-items: center;
    }
    .rail-btn-unit {
      color: #fff; background: #222a; border: 0;
      border-radius: 50%; width: 44px; height: 44px;
      font-size: 20px;
    }
    .rail-counter-txt { font-size: 11px; text-align: center; }
    .bottom-nav-fixed {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 56px; background: #080808;
      border-top: 1px solid #222;
      display: flex; justify-content: space-around;
      align-items: center; z-index: 20;
    }
    .nav-tab-item {
      color: #aaa; font-size: 11px;
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
    }
    .nav-tab-item.active { color: #fff; }
    .empty {
      min-height: 100%; display: flex;
      flex-direction: column; align-items: center;
      justify-content: center; text-align: center;
      padding: 28px; color: #ddd;
    }
    .empty h2 { font-size: 20px; margin-bottom: 8px; }
    .empty p { color: #aaa; line-height: 1.5; }
    .empty a {
      display: inline-block; background: #e50914;
      padding: 11px 18px; border-radius: 24px;
      margin-top: 12px; font-weight: 700;
    }
    #status { padding: 24px; text-align: center; color: #aaa; }
  </style>
</head>
<body>
  <header class="top">
    <a href="../frontend/index.html" aria-label="वापस">←</a>
    <div class="brand">BTube Shorts</div>
    <a href="search.html">Search</a>
  </header>

  <main id="shortsViewport">
    <div id="status">असली Shorts लोड हो रहे हैं…</div>
  </main>

  <nav class="bottom-nav-fixed">
    <a class="nav-tab-item" href="../frontend/index.html">⌂<span>Home</span></a>
    <a class="nav-tab-item active" href="shorts.html">▶<span>Shorts</span></a>
    <a class="nav-tab-item" href="upload.html">＋<span>Create</span></a>
    <a class="nav-tab-item" href="subscriptions.html">▤<span>Subscriptions</span></a>
    <a class="nav-tab-item" href="profile.html">●<span>You</span></a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="../assets/js/api-client.js"></script>

  <script>
    const viewport = document.getElementById('shortsViewport');

    function makeElement(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function showEmpty(message, withUpload) {
      viewport.replaceChildren();
      const box = makeElement('section', 'empty');
      box.append(
        makeElement('h2', '', 'अभी कोई Short उपलब्ध नहीं है'),
        makeElement('p', '', message)
      );
      if (withUpload) {
        const link = makeElement('a', '', 'अपना Short अपलोड करें');
        link.href = 'upload-short.html';
        box.append(link);
      }
      viewport.append(box);
    }

    function createShort(item) {
      const slide = makeElement('section', 'short-slide');
      const video = makeElement('video', 'short-media-video');
      video.src = item.videoUrl;
      video.controls = true;
      video.loop = true;
      video.playsInline = true;
      video.preload = 'metadata';

      const gradient = makeElement('div', 'scrim-bottom');
      const meta = makeElement('div', 'shorts-meta-box');
      meta.append(
        makeElement('div', 'creator-user-name',
          item.channel || 'BTube Creator'),
        makeElement('p', 'short-caption-text',
          item.title || 'Untitled Short')
      );

      const rail = makeElement('div', 'shorts-rail');
      const share = makeElement('button', 'rail-btn-unit', '↗');
      share.type = 'button';
      share.setAttribute('aria-label', 'Share Short');
      share.onclick = async () => {
        const url = new URL('watch.html', location.href);
        url.searchParams.set('id', item.id);
        try {
          if (navigator.share) {
            await navigator.share({
              title: item.title || 'BTube Short',
              url: url.href
            });
          } else {
            await navigator.clipboard.writeText(url.href);
            alert('लिंक कॉपी हो गया।');
          }
        } catch (e) {
          if (e.name !== 'AbortError') alert('लिंक शेयर नहीं हो सका।');
        }
      };
      rail.append(share);

      slide.append(video, gradient, meta, rail);
      return slide;
    }

    async function loadShorts() {
      try {
        if (!window.BTubeAPI ||
            typeof window.BTubeAPI.getFeed !== 'function') {
          throw new Error('BTube API लोड नहीं हुई।');
        }

        const results = await window.BTubeAPI.getFeed('short');
        const shorts = Array.isArray(results)
          ? results.filter(v =>
              v && typeof v.videoUrl === 'string' &&
              /^https?:\/\//i.test(v.videoUrl) &&
              String(v.type || '').toLowerCase() === 'short')
          : [];

        if (!shorts.length) {
          showEmpty('जब कोई असली Short अपलोड होगा, वह यहाँ दिखाई देगा।', true);
          return;
        }

        viewport.replaceChildren();
        shorts.forEach(item => viewport.append(createShort(item)));

        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            const video = entry.target.querySelector('video');
            if (!video) return;
            if (entry.isIntersecting) {
              video.play().catch(() => {});
            } else {
              video.pause();
            }
          });
        }, { root: viewport, threshold: 0.7 });

        viewport.querySelectorAll('.short-slide').forEach(slide =>
          observer.observe(slide));
      } catch (error) {
        console.error('BTube Shorts load error:', error);
        showEmpty(
          'Shorts लोड नहीं हो पाए। इंटरनेट, Firebase सेटिंग और Firestore Rules जाँचें।',
          false
        );
      }
    }

    document.addEventListener('DOMContentLoaded', loadShorts);
  </script>
</body>
</html>
