<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>BTube Shorts</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    header {
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #101010;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
    }

    .brand span {
      color: #ff253a;
    }

    a {
      color: #fff;
      text-decoration: none;
    }

    .upload-link {
      background: #e50914;
      padding: 9px 14px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: bold;
    }

    #status {
      padding: 20px;
      color: #bbb;
      text-align: center;
      line-height: 1.7;
    }

    #shorts {
      height: calc(100dvh - 112px);
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }

    #shorts::-webkit-scrollbar {
      display: none;
    }

    .short-card {
      position: relative;
      height: calc(100dvh - 112px);
      max-height: 850px;
      width: 100%;
      background: #111;
      overflow: hidden;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .short-card video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 50px 75px 22px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,.9));
      pointer-events: none;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .channel {
      color: #ddd;
      font-size: 13px;
      margin-top: 8px;
    }

    .controls {
      position: absolute;
      right: 12px;
      bottom: 26px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .controls button {
      border: 0;
      border-radius: 50%;
      background: rgba(45,45,45,.85);
      color: white;
      width: 46px;
      height: 46px;
      font-size: 20px;
      cursor: pointer;
    }

    .empty {
      max-width: 360px;
      margin: 65px auto;
      padding: 24px;
      text-align: center;
      line-height: 1.7;
    }

    .empty h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .empty p {
      color: #aaa;
      margin-bottom: 22px;
    }

    footer {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: #101010;
      border-top: 1px solid #292929;
      font-size: 13px;
    }

    footer a.active {
      color: #ff3548;
    }

    @media (min-width: 700px) {
      #shorts {
        max-width: 480px;
        margin: 0 auto;
      }

      .short-card {
        max-width: 480px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="../frontend/index.html">
      B<span>Tube</span> Shorts
    </a>
    <a class="upload-link" href="upload-short.html">+ Upload Short</a>
  </header>

  <div id="status" role="status">Firebase से असली Shorts लोड हो रहे हैं...</div>
  <main id="shorts"></main>

  <footer>
    <a href="../frontend/index.html">⌂ Home</a>
    <a class="active" href="shorts.html">▶ Shorts</a>
    <a href="upload-short.html">＋ Upload</a>
    <a href="your-videos.html">You</a>
  </footer>

  <!-- Firebase SDK पहले लोड होना जरूरी है -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="../assets/js/api-client.js"></script>

  <script>
    const statusBox = document.getElementById('status');
    const shortsBox = document.getElementById('shorts');

    function isHttpUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === 'https:' || url.protocol === 'http:';
      } catch {
        return false;
      }
    }

    function makeText(tag, className, value) {
      const element = document.createElement(tag);
      element.className = className;
      element.textContent = value || '';
      return element;
    }

    function makeButton(label, action) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      button.setAttribute('aria-label', action);
      button.addEventListener('click', action === 'चलाएँ'
        ? () => {
            const video = button.closest('.short-card')
                              .querySelector('video');
            if (video.paused) {
              video.play().catch(() => {});
            } else {
              video.pause();
            }
          }
        : () => {});
      return button;
    }

    function showEmpty(message, showUpload) {
      statusBox.textContent = '';
      const box = document.createElement('section');
      box.className = 'empty';

      box.appendChild(makeText('h2', '', 'अभी कोई Short नहीं है'));
      box.appendChild(makeText('p', '', message));

      if (showUpload) {
        const link = document.createElement('a');
        link.className = 'upload-link';
        link.href = 'upload-short.html';
        link.textContent = 'अपना पहला Short अपलोड करें';
        box.appendChild(link);
      }

      shortsBox.replaceChildren(box);
    }

    function renderShort(videoData) {
      const card = document.createElement('section');
      card.className = 'short-card';

      const video = document.createElement('video');
      video.src = videoData.videoUrl;
      video.controls = true;
      video.playsInline = true;
      video.preload = 'metadata';
      video.loop = true;

      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.appendChild(
        makeText('div', 'title', videoData.title || 'Untitled Short')
      );
      overlay.appendChild(
        makeText('div', 'channel',
          '@' + (videoData.channel || 'BTube Creator'))
      );

      const controls = document.createElement('div');
      controls.className = 'controls';

      const play = makeButton('▶', 'चलाएँ');
      controls.appendChild(play);

      const share = document.createElement('button');
      share.type = 'button';
      share.textContent = '↗';
      share.setAttribute('aria-label', 'शेयर करें');
      share.addEventListener('click', async () => {
        const shareData = {
          title: videoData.title || 'BTube Short',
          url: location.href
        };

        try {
          if (navigator.share) {
            await navigator.share(shareData);
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(location.href);
            share.textContent = '✓';
          }
        } catch (error) {
          // उपयोगकर्ता ने शेयर विंडो बंद की हो तो कुछ नहीं करना।
        }
      });
      controls.appendChild(share);

      card.append(video, overlay, controls);
      shortsBox.appendChild(card);
    }

    async function loadShorts() {
      shortsBox.replaceChildren();
      statusBox.textContent = 'Firebase से असली Shorts लोड हो रहे हैं...';

      try {
        if (!window.BTubeAPI ||
            typeof window.BTubeAPI.getFeed !== 'function') {
          throw new Error('BTube Firebase API लोड नहीं हुई।');
        }

        const records = await window.BTubeAPI.getFeed('short');

        if (!Array.isArray(records)) {
          throw new Error('Firebase से सही वीडियो सूची नहीं मिली।');
        }

        // केवल असली, सार्वजनिक Firebase Shorts दिखाएँ।
        const realShorts = records.filter(item => {
          const type = String(item.type || '').toLowerCase();
          const visibility = String(item.visibility || '')
                                .toLowerCase();

          return type === 'short' &&
                 visibility === 'public' &&
                 isHttpUrl(item.videoUrl);
        });

        if (realShorts.length === 0) {
          showEmpty(
            'जब कोई सार्वजनिक Short अपलोड होगा, वह यहाँ दिखाई देगा।',
            true
          );
          return;
        }

        statusBox.textContent = '';
        realShorts.forEach(renderShort);

      } catch (error) {
        console.error('BTube Shorts load error:', error);
        statusBox.textContent =
          'Shorts लोड नहीं हो पाए। इंटरनेट, Firebase कनेक्शन और Firestore Rules जाँचें।';
      }
    }

    loadShorts();
  </script>
</body>
</html>
