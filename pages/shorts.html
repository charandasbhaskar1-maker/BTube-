<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Shorts - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#000; color:#fff; overflow:hidden; height:100vh; width:100vw; }

        .shorts-container { height:100vh; width:100vw; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; }
        .shorts-container::-webkit-scrollbar { display:none; }

        .short-slide { height:100vh; width:100vw; scroll-snap-align:start; position:relative; display:flex; align-items:center; justify-content:center; background:#000; }
        video { width:100%; height:100%; object-fit:cover; }

        /* Top Bar */
        .top-bar { position:absolute; top:12px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; z-index:50; }
        .brand-shorts { font-size:18px; font-weight:800; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.8); }

        /* Right Action Bar */
        .action-column { position:absolute; right:12px; bottom:80px; display:flex; flex-direction:column; gap:18px; align-items:center; z-index:50; }
        .action-item { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; font-weight:700; cursor:pointer; }
        .action-btn { width:44px; height:44px; border-radius:50%; background:rgba(30,30,30,0.6); display:flex; align-items:center; justify-content:center; backdrop-filter:blur(5px); }
        .action-btn svg { width:22px; height:22px; fill:#fff; }

        /* Bottom Info Overlay */
        .meta-overlay { position:absolute; bottom:64px; left:16px; right:70px; z-index:50; display:flex; flex-direction:column; gap:8px; }
        .ch-line { display:flex; align-items:center; gap:8px; }
        .ch-avatar { width:32px; height:32px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; border:1px solid #fff; }
        .ch-name { font-size:14px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,0.8); }
        .sub-pill { background:#fff; color:#000; border:none; padding:4px 12px; border-radius:14px; font-size:12px; font-weight:800; cursor:pointer; }
        .short-caption { font-size:13px; line-height:1.3; font-weight:500; text-shadow:0 1px 3px rgba(0,0,0,0.8); }

        /* Bottom Nav */
        .bottom-nav { position:fixed; bottom:0; left:0; width:100%; height:50px; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:space-around; z-index:100; border-top:1px solid rgba(255,255,255,0.1); }
        .nav-item { display:flex; flex-direction:column; align-items:center; font-size:10px; color:#aaa; text-decoration:none; gap:2px; }
        .nav-item.active { color:#fff; font-weight:700; }
        .nav-item svg { width:20px; height:20px; fill:currentColor; }

        .loader { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); font-size:14px; color:#aaa; }
    </style>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <div class="top-bar">
        <div class="brand-shorts">Shorts</div>
        <a href="upload.html" style="color:#fff; text-decoration:none;">
            <svg viewBox="0 0 24 24" style="width:24px; height:24px; fill:#fff;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </a>
    </div>

    <div class="shorts-container" id="shortsContainer">
        <div class="loader">Loading real shorts...</div>
    </div>

    <!-- Navigation -->
    <nav class="bottom-nav">
        <a href="../frontend/index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
        <a href="shorts.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg><span>Shorts</span></a>
        <a href="upload.html" class="nav-item" style="color:#e50914;"><svg viewBox="0 0 24 24" style="fill:#e50914;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Create</span></a>
        <a href="subscriptions.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg><span>Subscriptions</span></a>
        <a href="profile.html" class="nav-item"><div style="width:20px; height:20px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff;">CB</div><span>You</span></a>
    </nav>

    <script>
        const FALLBACK_SHORT = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";

        window.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('shortsContainer');
            
            // Real Firestore Shorts Fetch
            const allItems = await window.BTubeAPI.getFeed('short');
            
            if (!allItems || allItems.length === 0) {
                container.innerHTML = `
                    <div class="short-slide">
                        <div style="text-align:center; padding:20px;">
                            <h3 style="margin-bottom:10px;">Abhi koi Short nahi hai</h3>
                            <p style="font-size:13px; color:#aaa; margin-bottom:20px;">Apna pehla Chhattisgarhi short video upload karein!</p>
                            <a href="upload.html" style="background:#e50914; color:#fff; padding:10px 24px; border-radius:20px; text-decoration:none; font-weight:700;">+ Create Short</a>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            allItems.forEach((s, idx) => {
                const streamUrl = s.videoUrl || FALLBACK_SHORT;
                const slide = document.createElement('div');
                slide.className = 'short-slide';

                slide.innerHTML = `
                    <video playsinline loop preload="metadata" src="${streamUrl}"></video>

                    <div class="meta-overlay">
                        <div class="ch-line">
                            <div class="ch-avatar">${(s.channel || 'CB').substring(0,2).toUpperCase()}</div>
                            <span class="ch-name">@${(s.channel || 'creator').replace(/\s+/g, '').toLowerCase()}</span>
                            <button class="sub-pill" onclick="this.innerText = this.innerText === 'Subscribe' ? 'Subscribed' : 'Subscribe'">Subscribe</button>
                        </div>
                        <div class="short-caption">${s.title}</div>
                    </div>

                    <div class="action-column">
                        <div class="action-item" onclick="toggleShortLike(this)">
                            <div class="action-btn">
                                <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                            </div>
                            <span>14K</span>
                        </div>
                        <div class="action-item">
                            <div class="action-btn">
                                <svg viewBox="0 0 24 24"><path d="M15 4v7H5.17l-.59.59-.58.58V4h11m1-2H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1V3c0-.55-.45-1-1-1z"/></svg>
                            </div>
                            <span>Comments</span>
                        </div>
                        <div class="action-item" onclick="navigator.share ? navigator.share({title:'${s.title}', url:window.location.href}) : alert('Link copied!')">
                            <div class="action-btn">
                                <svg viewBox="0 0 24 24"><path d="M11.73 3L5.8 8.94l5.93 5.93v-3.95c4.78 0 8.12 1.53 10.51 4.93-.95-4.78-3.82-9.56-10.51-10.9V3z"/></svg>
                            </div>
                            <span>Share</span>
                        </div>
                    </div>
                `;

                container.appendChild(slide);
            });

            // Auto-play active short on scroll
            setupIntersectionObserver();
        });

        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (!video) return;
                    if (entry.isIntersecting) {
                        video.play().catch(() => {
                            video.muted = true;
                            video.play();
                        });
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, { threshold: 0.65 });

            document.querySelectorAll('.short-slide').forEach(slide => observer.observe(slide));
        }

        function toggleShortLike(el) {
            const svg = el.querySelector('svg');
            svg.style.fill = svg.style.fill === 'rgb(229, 9, 20)' ? '#fff' : '#e50914';
        }
    </script>
</body>
</html>
