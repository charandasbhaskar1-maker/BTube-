<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Shorts - BTube</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#000; color:#fff; overflow:hidden; height:100vh; width:100vw; }

        .shorts-container { height:100vh; width:100vw; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; }
        .shorts-container::-webkit-scrollbar { display:none; }

        .short-slide { height:100vh; width:100vw; scroll-snap-align:start; position:relative; display:flex; align-items:center; justify-content:center; background:#000; }
        video { width:100%; height:100%; object-fit:cover; }

        /* Top Bar */
        .top-bar { position:absolute; top:12px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; z-index:50; }
        .brand-shorts { font-size:19px; font-weight:800; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.8); }
        .top-right-tools { display:flex; align-items:center; gap:16px; }

        /* Right Action Bar */
        .action-column { position:absolute; right:10px; bottom:66px; display:flex; flex-direction:column; gap:14px; align-items:center; z-index:50; }
        .action-item { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; font-weight:700; cursor:pointer; }
        .action-btn { width:44px; height:44px; border-radius:50%; background:rgba(30,30,30,0.55); display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px); transition:transform 0.15s ease; }
        .action-btn:active { transform:scale(0.9); }
        .action-btn svg { width:22px; height:22px; fill:#fff; }

        /* Super Thanks Special Button */
        .action-item.super-thanks-item .action-btn { background:linear-gradient(135deg, rgba(62,166,255,0.4) 0%, rgba(229,9,20,0.5) 100%); border:1px solid rgba(255,255,255,0.4); }
        .action-item.super-thanks-item svg { fill:#ffd700; }

        /* Bottom Info Overlay */
        .meta-overlay { position:absolute; bottom:64px; left:14px; right:74px; z-index:50; display:flex; flex-direction:column; gap:8px; }
        .ch-line { display:flex; align-items:center; gap:8px; }
        .ch-avatar { width:34px; height:34px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; border:1px solid #fff; overflow:hidden; flex-shrink:0; }
        .ch-avatar img { width:100%; height:100%; object-fit:cover; }
        .ch-name { font-size:14px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,0.8); }
        .sub-pill { background:#fff; color:#000; border:none; padding:4px 12px; border-radius:14px; font-size:12px; font-weight:800; cursor:pointer; }
        .sub-pill.subscribed { background:rgba(255,255,255,0.25); color:#fff; }
        .short-caption { font-size:13px; line-height:1.35; font-weight:500; text-shadow:0 1px 3px rgba(0,0,0,0.8); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }

        .audio-disc-row { display:flex; align-items:center; gap:6px; font-size:11px; color:#ddd; font-weight:600; text-shadow:0 1px 3px rgba(0,0,0,0.8); }
        .audio-disc-row svg { width:14px; height:14px; fill:#fff; }

        /* Super Thanks Bottom Sheet Modal */
        .sheet-scrim { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:3000; display:none; align-items:flex-end; }
        .sheet-scrim.open { display:flex; }
        .super-thanks-sheet { width:100%; background:#1c1c1c; border-top-left-radius:16px; border-top-right-radius:16px; padding:16px 16px 26px; display:flex; flex-direction:column; gap:14px; box-shadow:0 -6px 24px rgba(0,0,0,0.9); animation:slideUp 0.2s ease-out; }
        @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }

        .sheet-drag { width:36px; height:4px; background:#444; border-radius:2px; margin:0 auto 4px; }
        .st-header { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #282828; padding-bottom:10px; }
        .st-title { font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px; }
        .st-close { background:none; border:none; color:#aaa; font-size:20px; cursor:pointer; }

        .st-chip-row { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:4px 0; }
        .st-chip-row::-webkit-scrollbar { display:none; }
        .st-chip { background:#272727; border:1px solid #383838; color:#fff; border-radius:18px; padding:8px 16px; font-size:13px; font-weight:800; cursor:pointer; white-space:nowrap; }
        .st-chip.active { background:#ffd700; color:#000; border-color:#ffd700; }

        .st-msg-box { width:100%; background:#121212; border:1px solid #333; border-radius:10px; padding:10px 12px; color:#fff; font-size:13px; outline:none; resize:none; }
        .btn-buy-send { background:#ffd700; color:#000; border:none; padding:12px; border-radius:24px; font-size:14px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }

        /* Comments Sheet */
        .comments-sheet { width:100%; height:60vh; background:#181818; border-top-left-radius:16px; border-top-right-radius:16px; padding:14px 16px 20px; display:flex; flex-direction:column; gap:10px; }
        .comments-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:4px; }
        .comment-item { display:flex; gap:10px; font-size:12px; }
        .c-user-av { width:28px; height:28px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; flex-shrink:0; }
        .c-body { display:flex; flex-direction:column; gap:2px; flex:1; }
        .c-user { font-weight:700; color:#aaa; font-size:11px; }
        .c-text { color:#eee; font-size:13px; line-height:1.3; }

        .c-input-bar { display:flex; gap:8px; border-top:1px solid #282828; padding-top:8px; }
        .c-input { flex:1; background:#242424; border:1px solid #333; border-radius:20px; padding:8px 14px; color:#fff; font-size:13px; outline:none; }
        .c-send-btn { background:#3ea6ff; border:none; color:#000; font-weight:800; font-size:12px; padding:8px 14px; border-radius:16px; cursor:pointer; }

        /* Bottom Nav */
        .bottom-nav { position:fixed; bottom:0; left:0; width:100%; height:52px; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:space-around; z-index:100; border-top:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(10px); }
        .nav-item { display:flex; flex-direction:column; align-items:center; font-size:10px; color:#aaa; text-decoration:none; gap:2px; }
        .nav-item.active { color:#fff; font-weight:700; }
        .nav-item svg { width:22px; height:22px; fill:currentColor; }

        .loader { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); font-size:14px; color:#aaa; }
    </style>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <header class="top-bar">
        <div class="brand-shorts">Shorts</div>
        <div class="top-right-tools">
            <a href="search.html" style="color:#fff; text-decoration:none;">
                <svg viewBox="0 0 24 24" style="width:22px; height:22px; fill:#fff;"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </a>
            <a href="upload.html?type=short" style="color:#fff; text-decoration:none;">
                <svg viewBox="0 0 24 24" style="width:24px; height:24px; fill:#fff;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </a>
        </div>
    </header>

    <main class="shorts-container" id="shortsContainer">
        <div class="loader">Loading real shorts...</div>
    </main>

    <!-- Super Thanks Bottom Sheet -->
    <div class="sheet-scrim" id="superThanksModal" onclick="if(event.target===this) closeSuperThanks()">
        <div class="super-thanks-sheet">
            <div class="sheet-drag"></div>
            <div class="st-header">
                <span class="st-title">
                    <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#ffd700;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    Send Super Thanks
                </span>
                <button class="st-close" onclick="closeSuperThanks()">✕</button>
            </div>
            <div style="font-size:12px; color:#aaa;">Support <strong id="stCreatorName" style="color:#fff;">Creator</strong> directly with a highlighted comment!</div>
            
            <div class="st-chip-row">
                <button class="st-chip active" onclick="setStAmount(20, this)">₹20</button>
                <button class="st-chip" onclick="setStAmount(50, this)">₹50</button>
                <button class="st-chip" onclick="setStAmount(100, this)">₹100</button>
                <button class="st-chip" onclick="setStAmount(500, this)">₹500</button>
            </div>

            <textarea id="stCommentInput" class="st-msg-box" rows="2" placeholder="Write a supportive comment..."></textarea>
            
            <button class="btn-buy-send" onclick="submitSuperThanks()">
                <span id="stPayLabel">Buy and Send (₹20)</span>
            </button>
        </div>
    </div>

    <!-- Comments Sheet -->
    <div class="sheet-scrim" id="commentsModal" onclick="if(event.target===this) closeComments()">
        <div class="comments-sheet">
            <div class="sheet-drag"></div>
            <div class="st-header">
                <span class="st-title">Comments</span>
                <button class="st-close" onclick="closeComments()">✕</button>
            </div>
            <div class="comments-list" id="commentsListBody"></div>
            <div class="c-input-bar">
                <input type="text" id="shortCommentInput" class="c-input" placeholder="Add a comment..." onkeydown="if(event.key==='Enter') sendShortComment()">
                <button class="c-send-btn" onclick="sendShortComment()">Post</button>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="bottom-nav">
        <a href="../frontend/index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
        <a href="shorts.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg><span>Shorts</span></a>
        <a href="upload.html?type=short" class="nav-item" style="color:#e50914;"><svg viewBox="0 0 24 24" style="fill:#e50914;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Create</span></a>
        <a href="subscriptions.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg><span>Subscriptions</span></a>
        <a href="profile.html" class="nav-item"><div style="width:20px; height:20px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff; overflow:hidden;" id="navAvatar">BT</div><span>You</span></a>
    </nav>

    <script>
        const FALLBACK_SHORT = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
        const FAN_FUNDING_CREATOR_SHARE = 0.70;
        const FAN_FUNDING_PLATFORM_FEE = 0.30;

        let activeShortId = null;
        let activeShortCreator = 'Creator';
        let currentStAmount = 20;

        window.addEventListener('DOMContentLoaded', async () => {
            syncNavAvatar();
            const container = document.getElementById('shortsContainer');
            
            let allItems = [];
            if (window.BTubeAPI && typeof window.BTubeAPI.getFeed === 'function') {
                allItems = await window.BTubeAPI.getFeed('short');
            }
            
            if (!allItems || allItems.length === 0) {
                container.innerHTML = `
                    <div class="short-slide">
                        <div style="text-align:center; padding:20px;">
                            <h3 style="margin-bottom:8px; font-size:18px;">No Shorts Uploaded Yet</h3>
                            <p style="font-size:13px; color:#aaa; margin-bottom:20px;">Upload vertical short videos to entertain your audience!</p>
                            <a href="upload.html?type=short" style="background:#e50914; color:#fff; padding:10px 24px; border-radius:24px; text-decoration:none; font-weight:700;">+ Create Short</a>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            allItems.forEach((s) => {
                const streamUrl = s.videoUrl || FALLBACK_SHORT;
                const slide = document.createElement('div');
                slide.className = 'short-slide';
                slide.setAttribute('data-id', s.id);
                slide.setAttribute('data-creator', s.channel || 'Creator');

                const isMonetized = s.monetized || (s.subscribers && s.subscribers >= 500) || true;
                const avatarChar = (s.channel || 'B').substring(0, 2).toUpperCase();

                slide.innerHTML = `
                    <video playsinline loop preload="metadata" src="${streamUrl}" onclick="togglePlayPause(this)"></video>

                    <div class="meta-overlay">
                        <div class="ch-line">
                            <div class="ch-avatar">${s.channelAvatar ? `<img src="${s.channelAvatar}">` : avatarChar}</div>
                            <span class="ch-name">@${(s.channel || 'creator').replace(/\s+/g, '').toLowerCase()}</span>
                            <button class="sub-pill" onclick="toggleSub(this, '${s.channelId || s.channel}')">Subscribe</button>
                        </div>
                        <div class="short-caption">${s.title || ''}</div>
                        <div class="audio-disc-row">
                            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                            <span>Original sound • ${(s.channel || 'Creator')}</span>
                        </div>
                    </div>

                    <div class="action-column">
                        <!-- Like -->
                        <div class="action-item" onclick="toggleShortLike(this, '${s.id}')">
                            <div class="action-btn">
                                <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                            </div>
                            <span class="like-counter">${s.likes || 'Like'}</span>
                        </div>

                        <!-- Dislike -->
                        <div class="action-item" onclick="toggleShortDislike(this)">
                            <div class="action-btn">
                                <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
                            </div>
                            <span>Dislike</span>
                        </div>

                        <!-- Comments -->
                        <div class="action-item" onclick="openComments('${s.id}')">
                            <div class="action-btn">
                                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
                            </div>
                            <span>Comments</span>
                        </div>

                        <!-- Super Thanks (Monetized YPP Feature) -->
                        ${isMonetized ? `
                        <div class="action-item super-thanks-item" onclick="openSuperThanks('${s.id}', '${s.channel || 'Creator'}')">
                            <div class="action-btn">
                                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </div>
                            <span>Thanks</span>
                        </div>
                        ` : ''}

                        <!-- Share -->
                        <div class="action-item" onclick="shareShort('${s.title || 'Short'}')">
                            <div class="action-btn">
                                <svg viewBox="0 0 24 24"><path d="M11.73 3L5.8 8.94l5.93 5.93v-3.95c4.78 0 8.12 1.53 10.51 4.93-.95-4.78-3.82-9.56-10.51-10.9V3z"/></svg>
                            </div>
                            <span>Share</span>
                        </div>

                        <!-- Remix -->
                        <div class="action-item">
                            <div class="action-btn">
                                <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                            </div>
                            <span>Remix</span>
                        </div>
                    </div>
                `;

                container.appendChild(slide);
            });

            setupIntersectionObserver();
        });

        function syncNavAvatar() {
            const authUser = window.BTubeAPI ? window.BTubeAPI.getAuthUser() : JSON.parse(localStorage.getItem('btube_user') || 'null');
            const botAv = document.getElementById('navAvatar');
            if (authUser && botAv) {
                if (authUser.photo) {
                    botAv.innerHTML = `<img src="${authUser.photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                } else {
                    botAv.innerText = (authUser.name || 'BT').substring(0, 2).toUpperCase();
                }
            }
        }

        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (!video) return;
                    if (entry.isIntersecting) {
                        video.play().catch(() => {
                            video.muted = true;
                            video.play();
                        });
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, { threshold: 0.65 });

            document.querySelectorAll('.short-slide').forEach(slide => observer.observe(slide));
        }

        function togglePlayPause(video) {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        function toggleShortLike(el, id) {
            const svg = el.querySelector('svg');
            const isLiked = svg.style.fill === 'rgb(229, 9, 20)';
            svg.style.fill = isLiked ? '#fff' : '#e50914';

            let likedIds = JSON.parse(localStorage.getItem('btube_liked_ids') || '[]');
            if (!isLiked) {
                if (!likedIds.some(i => i.id === id)) {
                    likedIds.unshift({ id: id, title: 'Short Video', thumb: 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800' });
                }
            } else {
                likedIds = likedIds.filter(i => i.id !== id);
            }
            localStorage.setItem('btube_liked_ids', JSON.stringify(likedIds));
        }

        function toggleShortDislike(el) {
            const svg = el.querySelector('svg');
            svg.style.fill = svg.style.fill === 'rgb(62, 166, 255)' ? '#fff' : '#3ea6ff';
        }

        function toggleSub(btn, chKey) {
            if (btn.classList.contains('subscribed')) {
                btn.classList.remove('subscribed');
                btn.innerText = 'Subscribe';
            } else {
                btn.classList.add('subscribed');
                btn.innerText = 'Subscribed';
            }
        }

        function shareShort(title) {
            if (navigator.share) {
                navigator.share({ title: title, url: window.location.href }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Short link copied!");
            }
        }

        /* Super Thanks Flow with 70/30 Revenue Split */
        function openSuperThanks(shortId, creator) {
            activeShortId = shortId;
            activeShortCreator = creator;
            document.getElementById('stCreatorName').innerText = creator;
            document.getElementById('superThanksModal').classList.add('open');
        }

        function closeSuperThanks() {
            document.getElementById('superThanksModal').classList.remove('open');
        }

        function setStAmount(amt, btn) {
            currentStAmount = amt;
            document.querySelectorAll('.st-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('stPayLabel').innerText = `Buy and Send (₹${amt})`;
        }

        function getSuperThanksColor(amount) {
            if (amount >= 500) return '#e62117';
            if (amount >= 100) return '#ff7700';
            if (amount >= 50)  return '#ffcc00';
            return '#00bfa5';
        }

        function submitSuperThanks() {
            const comment = document.getElementById('stCommentInput').value.trim();
            const grossAmount = Number(currentStAmount);

            // Official YPP Fan Funding Split: 70% Creator / 30% Platform Fee
            const creatorNet = Number((grossAmount * FAN_FUNDING_CREATOR_SHARE).toFixed(2));
            const platformCut = Number((grossAmount * FAN_FUNDING_PLATFORM_FEE).toFixed(2));

            const authUser = window.BTubeAPI ? window.BTubeAPI.getAuthUser() : JSON.parse(localStorage.getItem('btube_user') || 'null');
            const senderName = authUser?.name || 'Viewer';
            const txId = 'TXN_' + Date.now();

            // 1. Creator Studio Wallet Update
            const creatorKey = `btube_creator_wallet_${activeShortCreator}`;
            let creatorWallet = JSON.parse(localStorage.getItem(creatorKey) || JSON.stringify({
                totalEarned: 0,
                pendingPayout: 0,
                transactions: []
            }));

            creatorWallet.totalEarned += creatorNet;
            creatorWallet.pendingPayout += creatorNet;
            creatorWallet.transactions.unshift({
                txId,
                type: 'SUPER_THANKS',
                videoId: activeShortId,
                gross: grossAmount,
                creatorNet: creatorNet,
                platformCut: platformCut,
                sender: senderName,
                createdAt: new Date().toISOString()
            });
            localStorage.setItem(creatorKey, JSON.stringify(creatorWallet));

            // 2. Platform Treasury Update
            let platformTreasury = JSON.parse(localStorage.getItem('btube_platform_treasury') || JSON.stringify({
                totalPlatformFees: 0,
                transactions: []
            }));
            platformTreasury.totalPlatformFees += platformCut;
            platformTreasury.transactions.unshift({
                txId,
                videoId: activeShortId,
                creator: activeShortCreator,
                gross: grossAmount,
                fee: platformCut,
                createdAt: new Date().toISOString()
            });
            localStorage.setItem('btube_platform_treasury', JSON.stringify(platformTreasury));

            // 3. Highlighted Super Thanks Comment
            const commentsKey = `btube_comments_${activeShortId}`;
            const comments = JSON.parse(localStorage.getItem(commentsKey) || '[]');
            comments.unshift({
                id: 'c_' + Date.now(),
                author: senderName,
                text: comment || 'Sent Super Thanks! 🎉',
                isSuperThanks: true,
                superThanksAmount: grossAmount,
                currency: '₹',
                badgeColor: getSuperThanksColor(grossAmount),
                createdAt: new Date().toISOString()
            });
            localStorage.setItem(commentsKey, JSON.stringify(comments));

            closeSuperThanks();
            document.getElementById('stCommentInput').value = '';

            alert(
                `🎉 Super Thanks Sent: ₹${grossAmount}\n` +
                `------------------------------------\n` +
                `• Creator Share (70%): ₹${creatorNet}\n` +
                `• BTube Platform Fee (30%): ₹${platformCut}\n` +
                `Transaction ID: ${txId}`
            );
        }

        /* Comments Sheet Flow */
        function openComments(shortId) {
            activeShortId = shortId;
            renderShortComments(shortId);
            document.getElementById('commentsModal').classList.add('open');
        }

        function closeComments() {
            document.getElementById('commentsModal').classList.remove('open');
        }

        function renderShortComments(id) {
            const list = document.getElementById('commentsListBody');
            const comments = JSON.parse(localStorage.getItem(`btube_comments_${id}`) || '[]');
            list.innerHTML = '';

            if (comments.length === 0) {
                list.innerHTML = `<div style="text-align:center; padding:30px; color:#777; font-size:12px;">No comments yet. Be the first to comment!</div>`;
                return;
            }

            comments.forEach(c => {
                const item = document.createElement('div');
                item.className = 'comment-item';

                if (c.isSuperThanks) {
                    item.style.cssText = `border: 1px solid ${c.badgeColor}; background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 10px; width:100%;`;
                    item.innerHTML = `
                        <div style="width:100%;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <div class="c-user-av" style="background:${c.badgeColor}; color:#000;">${c.author.substring(0,2).toUpperCase()}</div>
                                    <span style="font-weight:700; color:#fff;">${c.author}</span>
                                </div>
                                <span style="background:${c.badgeColor}; color:#000; font-size:11px; font-weight:900; padding:2px 8px; border-radius:12px;">
                                    ₹${c.superThanksAmount}
                                </span>
                            </div>
                            <div style="font-size:13px; color:#fff; line-height:1.4;">${c.text}</div>
                        </div>
                    `;
                } else {
                    item.innerHTML = `
                        <div class="c-user-av">${c.author.substring(0,2).toUpperCase()}</div>
                        <div class="c-body">
                            <span class="c-user">${c.author}</span>
                            <span class="c-text">${c.text}</span>
                        </div>
                    `;
                }
                list.appendChild(item);
            });
        }

        function sendShortComment() {
            const inp = document.getElementById('shortCommentInput');
            const txt = inp.value.trim();
            if (!txt) return;

            const commentsKey = `btube_comments_${activeShortId}`;
            const comments = JSON.parse(localStorage.getItem(commentsKey) || '[]');
            const authUser = window.BTubeAPI ? window.BTubeAPI.getAuthUser() : null;
            const author = authUser?.name || 'Viewer';

            comments.unshift({ id: 'c_' + Date.now(), author: author, text: txt, isSuperThanks: false });
            localStorage.setItem(commentsKey, JSON.stringify(comments));

            inp.value = '';
            renderShortComments(activeShortId);
        }
    </script>
</body>
</html>
