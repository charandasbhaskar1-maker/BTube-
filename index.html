<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTube - Bharat Tube</title>
    
    <!-- Meta Refresh for Instant Redirect -->
    <meta http-equiv="refresh" content="0; url=frontend/index.html">
    
    <!-- Theme & App Background Color -->
    <meta name="theme-color" content="#0f0f0f">
    <link rel="canonical" href="frontend/index.html">

    <script>
        // Instant Client-side Redirection without polluting History Stack
        window.location.replace("frontend/index.html");
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .redirect-box {
            text-align: center;
        }
        .redirect-box a {
            color: #ff0000;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Fallback if Auto-Redirect is delayed or JS is disabled -->
    <div class="redirect-box">
        <p>Loading BTube...</p>
        <p><small>If you are not redirected automatically, <a href="frontend/index.html">click here</a>.</small></p>
    </div>
</body>
</html>
