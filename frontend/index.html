<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>BTube</title>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:70px; overflow-x:hidden; }

        /* Header */
        .app-header { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; position:sticky; top:0; background:#0f0f0f; z-index:100; border-bottom:1px solid #1c1c1c; }
        .logo-box { display:flex; align-items:center; gap:6px; text-decoration:none; color:#fff; font-size:19px; font-weight:800; letter-spacing:-0.5px; }
        .logo-icon { width:28px; height:20px; background:#e50914; border-radius:6px; display:flex; align-items:center; justify-content:center; }
        .logo-icon svg { width:14px; height:14px; fill:#fff; }
        .hdr-actions { display:flex; align-items:center; gap:16px; }
        .btn-hdr { background:none; border:none; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; text-decoration:none; }
        .btn-hdr svg { width:22px; height:22px; fill:#fff; }
        .user-chip-avatar { width:28px; height:28px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff; overflow:hidden; cursor:pointer; }
        .user-chip-avatar img { width:100%; height:100%; object-fit:cover; }

        /* Categories */
        .category-bar { display:flex; gap:8px; padding:10px 16px; overflow-x:auto; scrollbar-width:none; position:sticky; top:52px; background:#0f0f0f; z-index:90; }
        .category-bar::-webkit-scrollbar { display:none; }
        .chip { background:#222; color:#fff; border:none; padding:7px 14px; border-radius:18px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; }
        .chip.active { background:#fff; color:#000; }

        /* Video Feed */
        .video-feed { display:flex; flex-direction:column; gap:18px; }
        .video-card { display:flex; flex-direction:column; cursor:pointer; text-decoration:none; color:inherit; }
        .thumb-wrapper { width:100%; aspect-ratio:16/9; background:#1c1c1c; position:relative; overflow:hidden; }
        .thumb-wrapper img { width:100%; height:100%; object-fit:cover; }
        .badge-time { position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.85); font-size:11px; font-weight:700; padding:2px 5px; border-radius:4px; }

        .details-wrapper { display:flex; gap:12px; padding:12px 16px 0; align-items:flex-start; justify-content:space-between; }
        .card-main-info { display:flex; gap:12px; flex:1; min-width:0; }
        .channel-avatar { width:38px; height:38px; border-radius:50%; background:#2a2a2a; overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; }
        .channel-avatar img { width:100%; height:100%; object-fit:cover; }
        .meta-col { display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
        .video-title { font-size:14px; font-weight:700; line-height:1.35; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; }
        .video-sub-meta { font-size:12px; color:#aaa; }

        /* Bottom Nav */
        .bottom-nav { position:fixed; bottom:0; left:0; width:100%; height:52px; background:#0f0f0f; display:flex; align-items:center; justify-content:space-around; border-top:1px solid #222; z-index:1000; }
        .nav-btn { display:flex; flex-direction:column; align-items:center; font-size:10px; color:#aaa; text-decoration:none; gap:2px; cursor:pointer; }
        .nav-btn.active { color:#fff; font-weight:700; }
        .nav-btn svg { width:22px; height:22px; fill:currentColor; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <a href="index.html" class="logo-box">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <span>BTube</span>
        </a>
        <div class="hdr-actions">
            <a href="../pages/notifications.html" class="btn-hdr">
                <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            </a>
            <div class="user-chip-avatar" id="topNavAvatar" onclick="window.location.href='../pages/profile.html'">
                BT
            </div>
        </div>
    </header>

    <!-- Filter Chips -->
    <div class="category-bar">
        <button class="chip active" onclick="setCategoryFilter('all', this)">All</button>
        <button class="chip" onclick="setCategoryFilter('video', this)">Videos</button>
        <button class="chip" onclick="setCategoryFilter('short', this)">Shorts</button>
    </div>

    <!-- Feed Container -->
    <main class="video-feed" id="mainVideoFeed"></main>

    <!-- Bottom Navigation (Direct ../pages/ linking) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-btn active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="../pages/shorts.html" class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
            <span>Shorts</span>
        </a>
        <a href="../pages/upload.html" class="nav-btn" style="color:#e50914;">
            <svg viewBox="0 0 24 24" style="fill:#e50914;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span>Create</span>
        </a>
        <a href="../pages/subscriptions.html" class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg>
            <span>Subscriptions</span>
        </a>
        <a href="../pages/profile.html" class="nav-btn">
            <div style="width:20px; height:20px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff;" id="bottomNavAvatar">BT</div>
            <span>You</span>
        </a>
    </nav>

    <script>
        let currentFilter = 'all';
        let allCloudVideos = [];

        window.addEventListener('DOMContentLoaded', async () => {
            await refreshFeed();
        });

        async function refreshFeed() {
            if (window.BTubeAPI && typeof window.BTubeAPI.getFeed === 'function') {
                try {
                    allCloudVideos = await window.BTubeAPI.getFeed('all');
                } catch(e) {
                    console.error("Feed error:", e);
                }
            }
            renderFeedList();
        }

        function setCategoryFilter(type, el) {
            currentFilter = type;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderFeedList();
        }

        function openVideo(vidId, videoUrl, isShort) {
            if (isShort) {
                window.location.href = `../pages/shorts.html?id=${encodeURIComponent(vidId)}`;
            } else {
                window.location.href = `../pages/watch.html?id=${encodeURIComponent(vidId)}&videoUrl=${encodeURIComponent(videoUrl || '')}`;
            }
        }

        function renderFeedList() {
            const feedContainer = document.getElementById('mainVideoFeed');
            feedContainer.innerHTML = '';

            let filtered = allCloudVideos;
            if (currentFilter !== 'all') {
                filtered = filtered.filter(v => {
                    const isShort = (v.type === 'short' || v.is_shorts === true);
                    return currentFilter === 'short' ? isShort : !isShort;
                });
            }

            if (!filtered || filtered.length === 0) {
                feedContainer.innerHTML = `
                    <div style="text-align:center; padding:60px 20px; color:#aaa;">
                        <h3>No videos found</h3>
                        <p style="margin-top:8px;">Feed is empty.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(v => {
                const isShort = (v.type === 'short' || v.is_shorts === true);
                const vidId = v.id || v.video_id || 'vid_default';
                const videoStreamUrl = v.videoUrl || v.video_url || '';
                const thumbSrc = v.thumb || v.thumbnail_url || 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800';
                const channelName = v.channel || v.channel_name || 'BTube Creator';
                const viewsCount = v.views || v.views_count || 0;

                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => openVideo(vidId, videoStreamUrl, isShort);

                card.innerHTML = `
                    <div class="thumb-wrapper">
                        <img src="${thumbSrc}">
                        <span class="badge-time">${isShort ? 'SHORT' : (v.duration || '03:45')}</span>
                    </div>
                    <div class="details-wrapper">
                        <div class="card-main-info">
                            <div class="channel-avatar">${channelName.substring(0, 2).toUpperCase()}</div>
                            <div class="meta-col">
                                <h3 class="video-title">${v.title}</h3>
                                <div class="video-sub-meta">${channelName} • ${viewsCount} views</div>
                            </div>
                        </div>
                    </div>
                `;
                feedContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
