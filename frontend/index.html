<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>BTube</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0f0f0f;
            color: #ffffff;
            padding-bottom: 70px;
            overflow-x: hidden;
        }

        /* Top Header */
        .app-header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            background: #0f0f0f;
            z-index: 1000;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #ffffff;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            width: 28px;
            height: 20px;
            background: #e50914;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 14px;
            height: 14px;
            fill: #ffffff;
        }

        .hdr-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-hdr {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-hdr svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .user-chip-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #7952b3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
            overflow: hidden;
            cursor: pointer;
        }

        .user-chip-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Search Input */
        .search-container {
            padding: 0 16px 8px;
        }

        .search-box-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            border-radius: 22px;
            padding: 8px 16px;
        }

        .search-box-pill svg {
            width: 16px;
            height: 16px;
            fill: #777777;
            flex-shrink: 0;
        }

        .search-input-field {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            width: 100%;
        }

        .search-input-field::placeholder {
            color: #888888;
        }

        /* Categories */
        .category-bar {
            display: flex;
            gap: 8px;
            padding: 6px 16px 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: #222222;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .chip.active {
            background: #ffffff;
            color: #000000;
        }

        /* Feed */
        .video-feed {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .video-card {
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .thumb-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #1c1c1c;
            position: relative;
            overflow: hidden;
        }

        .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-time {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.85);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .details-wrapper {
            display: flex;
            gap: 12px;
            padding: 12px 16px 0;
            align-items: flex-start;
        }

        .card-main-info {
            display: flex;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .channel-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #2a2a2a;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
        }

        .channel-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .meta-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        .video-title {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .video-sub-meta {
            font-size: 12px;
            color: #aaaaaa;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 52px;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid #1c1c1c;
            z-index: 1000;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #aaaaaa;
            text-decoration: none;
            gap: 3px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .nav-btn.active {
            color: #ffffff;
            font-weight: 700;
        }

        .nav-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .nav-create-btn {
            width: 34px;
            height: 34px;
            border: 1px solid #444444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-create-btn svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
        }

        .nav-avatar-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #7952b3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 800;
            color: #ffffff;
            overflow: hidden;
        }

        .nav-avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="logo-box" onclick="routeTo('index.html')" style="cursor:pointer;">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <span>BTube</span>
        </div>
        <div class="hdr-actions">
            <button class="btn-hdr" onclick="routeTo('pages/search.html')">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button class="btn-hdr" onclick="routeTo('pages/notifications.html')">
                <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            </button>
            <div class="user-chip-avatar" id="topNavAvatar" onclick="routeTo('pages/profile.html')">
                K
            </div>
        </div>
    </header>

    <!-- Search Input -->
    <div class="search-container">
        <div class="search-box-pill">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" class="search-input-field" placeholder="Search videos and Shorts" oninput="handleSearch(this.value)">
        </div>
    </div>

    <!-- Category Chips -->
    <div class="category-bar">
        <button class="chip active" onclick="setCategoryFilter('all', this)">All</button>
        <button class="chip" onclick="setCategoryFilter('video', this)">Videos</button>
        <button class="chip" onclick="setCategoryFilter('short', this)">Shorts</button>
    </div>

    <!-- Main Feed -->
    <main class="video-feed" id="mainVideoFeed"></main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="routeTo('index.html')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </button>
        <button class="nav-btn" onclick="routeTo('pages/shorts.html')">
            <svg viewBox="0 0 24 24"><path d="M10 14.65v-5.3L15 12l-5 2.65zm7.77-4.33c-.77-.32-1.2-.5-1.2-.5l1.1-.46c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43z"/></svg>
            <span>Shorts</span>
        </button>
        <button class="nav-btn" onclick="routeTo('pages/upload.html')">
            <div class="nav-create-btn">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </div>
            <span>Create</span>
        </button>
        <button class="nav-btn" onclick="routeTo('pages/subscriptions.html')">
            <svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg>
            <span>Subscriptions</span>
        </button>
        <button class="nav-btn" onclick="routeTo('pages/profile.html')">
            <div class="nav-avatar-circle" id="bottomNavAvatar">K</div>
            <span>You</span>
        </button>
    </nav>

    <script>
        // Exact Path Router (GitHub Pages Safe Navigation)
        function routeTo(relativePath) {
            const loc = window.location;
            let currentPath = loc.pathname;
            
            // Agar index.html par hain to directory nikal lein
            if (currentPath.endsWith('.html')) {
                currentPath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
            } else if (!currentPath.endsWith('/')) {
                currentPath += '/';
            }

            // Target URL create karein
            window.location.href = loc.origin + currentPath + relativePath;
        }

        // Live Channel Identity Sync
        function syncChannelIdentity() {
            let ch = null;
            try {
                const u = JSON.parse(localStorage.getItem('btube_user') || 'null');
                if (u) {
                    const activeId = localStorage.getItem('btube_active_channel_id_' + u.uid);
                    const list = JSON.parse(localStorage.getItem('btube_channels_' + u.uid) || '[]');
                    ch = list.find(c => c.id === activeId) || list[0];
                    if (!ch) ch = { name: u.name, avatar: u.photo };
                }
                if (!ch) ch = JSON.parse(localStorage.getItem('btube_active_channel') || 'null');
            } catch(e) {}

            const name = (ch && ch.name) ? ch.name : 'Karan Bhaskar';
            const initial = name.substring(0, 1).toUpperCase();
            const avatarImg = (ch && ch.avatar) ? ch.avatar : '';

            const topAv = document.getElementById('topNavAvatar');
            const botAv = document.getElementById('bottomNavAvatar');

            if (avatarImg) {
                const imgTag = `<img src="${avatarImg}">`;
                if (topAv) topAv.innerHTML = imgTag;
                if (botAv) botAv.innerHTML = imgTag;
            } else {
                if (topAv) topAv.innerText = initial;
                if (botAv) botAv.innerText = initial;
            }
        }

        // Videos List
        const FALLBACK_VIDEOS = [
            {
                id: "vid_welcome_01",
                title: "Welcome to BTube - India's PWA Video Platform",
                channel: "Karan Bhaskar",
                avatar: "",
                thumb: "https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800",
                videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
                duration: "03:45",
                views: 1200,
                type: "video"
            },
            {
                id: "short_welcome_01",
                title: "First Look at BTube Shorts #btube #shorts",
                channel: "Karan Bhaskar",
                avatar: "",
                thumb: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600",
                videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                duration: "00:45",
                views: 3500,
                type: "short"
            }
        ];

        let currentFilter = 'all';
        let searchQuery = '';
        let feedVideos = [];

        function loadFeed() {
            try {
                feedVideos = JSON.parse(localStorage.getItem('btube_uploaded_videos') || '[]');
            } catch(e) {}

            if (!feedVideos || feedVideos.length === 0) {
                feedVideos = FALLBACK_VIDEOS;
            }

            renderFeed();
        }

        function setCategoryFilter(type, el) {
            currentFilter = type;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            if (el) el.classList.add('active');
            renderFeed();
        }

        function handleSearch(val) {
            searchQuery = val.toLowerCase().trim();
            renderFeed();
        }

        function renderFeed() {
            const feedContainer = document.getElementById('mainVideoFeed');
            feedContainer.innerHTML = '';

            let list = feedVideos;

            if (currentFilter !== 'all') {
                list = list.filter(v => (v.type || (v.is_shorts ? 'short' : 'video')).toLowerCase() === currentFilter);
            }

            if (searchQuery) {
                list = list.filter(v => (v.title || '').toLowerCase().includes(searchQuery) || (v.channel || '').toLowerCase().includes(searchQuery));
            }

            list.forEach(v => {
                const isShort = (v.type === 'short' || v.is_shorts === true);
                const vidId = v.id || 'vid_sample';
                const videoStreamUrl = v.videoUrl || '';
                const thumbSrc = v.thumb || 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800';
                const chName = v.channel || 'Karan Bhaskar';
                const initial = chName.substring(0, 1).toUpperCase();

                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => {
                    if (isShort) {
                        routeTo(`pages/shorts.html?id=${encodeURIComponent(vidId)}`);
                    } else {
                        routeTo(`pages/watch.html?id=${encodeURIComponent(vidId)}&videoUrl=${encodeURIComponent(videoStreamUrl)}`);
                    }
                };

                card.innerHTML = `
                    <div class="thumb-wrapper">
                        <img src="${thumbSrc}" loading="lazy">
                        <span class="badge-time">${isShort ? 'SHORT' : (v.duration || '03:45')}</span>
                    </div>
                    <div class="details-wrapper">
                        <div class="card-main-info">
                            <div class="channel-avatar">
                                ${v.avatar ? `<img src="${v.avatar}">` : initial}
                            </div>
                            <div class="meta-col">
                                <h3 class="video-title">${v.title}</h3>
                                <div class="video-sub-meta">${chName} • ${v.views || 0} views</div>
                            </div>
                        </div>
                    </div>
                `;
                feedContainer.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            syncChannelIdentity();
            loadFeed();
        });

        window.addEventListener('storage', () => {
            syncChannelIdentity();
        });
    </script>
</body>
</html>
