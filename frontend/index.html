
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="description" content="BTube par videos aur Shorts dekhein, upload karein aur apne creators ko follow karein.">

  <title>BTube</title>

  <link rel="icon" type="image/png" href="./assets/Icon _ 192.png">
  <link rel="apple-touch-icon" href="./assets/Icon _ 192.png">
  <link rel="manifest" href="./manifest.json">

  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f0f;
      --panel: #181818;
      --line: #303030;
      --text: #f5f5f5;
      --muted: #aaa;
      --accent: #ff0033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      padding-bottom: 76px;
    }

    button, a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      cursor: pointer;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 58px;
      padding: 0 14px;
      background: var(--bg);
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand-mark {
      width: 31px;
      height: 23px;
      background: var(--accent);
      border-radius: 7px;
      display: grid;
      place-items: center;
    }

    .brand-mark svg {
      width: 15px;
      height: 15px;
      fill: white;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .icon-link {
      display: grid;
      place-items: center;
      min-width: 28px;
      min-height: 36px;
      font-size: 22px;
    }

    .avatar {
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: #5e35b1;
      display: grid;
      place-items: center;
      font-weight: bold;
    }

    .search-row {
      padding: 10px 14px;
    }

    .search-button {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #333;
      background: #202020;
      border-radius: 24px;
      text-align: left;
      color: #bbb;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 14px 14px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      border: 0;
      background: #272727;
      color: #eee;
      border-radius: 8px;
      padding: 9px 15px;
    }

    .category.active {
      background: #f1f1f1;
      color: #111;
      font-weight: 700;
    }

    .feed {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
    }

    .video-card {
      min-width: 0;
    }

    .thumbnail-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #222;
      overflow: hidden;
    }

    .thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-info {
      display: flex;
      gap: 11px;
      padding: 11px 13px 0;
    }

    .channel-avatar {
      flex: 0 0 39px;
      width: 39px;
      height: 39px;
      border-radius: 50%;
      background: #333;
      display: grid;
      place-items: center;
      font-weight: bold;
    }

    .video-details {
      min-width: 0;
      flex: 1;
    }

    .video-title {
      margin: 0 0 7px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .video-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .empty-state {
      padding: 45px 22px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state h2 {
      color: var(--text);
      font-size: 19px;
    }

    .primary-button {
      display: inline-block;
      border: 0;
      border-radius: 22px;
      padding: 11px 19px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      margin-top: 12px;
    }

    .status {
      padding: 10px 15px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .bottom-nav {
      position: fixed;
      z-index: 20;
      bottom: 0;
      left: 0;
      right: 0;
      height: 66px;
      padding-bottom: env(safe-area-inset-bottom);
      background: #101010;
      border-top: 1px solid #303030;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      color: #ddd;
      font-size: 10px;
    }

    .nav-icon {
      font-size: 21px;
      line-height: 1;
    }

    .create-button {
      width: 43px;
      height: 34px;
      border: 1px solid #777;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 25px;
    }

    .error-message {
      color: #ff8a8a;
      font-size: 13px;
      padding: 12px;
      text-align: center;
    }

    @media (min-width: 700px) {
      .feed {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 26px 18px;
        padding: 0 18px;
      }

      .thumbnail-wrap {
        border-radius: 12px;
      }
    }

    @media (min-width: 1050px) {
      .feed {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="BTube Home">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5v14l11-7z"></path>
        </svg>
      </span>
      <span>BTube</span>
    </a>

    <div class="top-actions">
      <a class="icon-link" href="./pages/search.html" aria-label="Search">⌕</a>
      <a class="icon-link" href="./pages/notifications.html" aria-label="Notifications">♧</a>
      <a href="./pages/profile.html" aria-label="Profile">
        <span class="avatar">B</span>
      </a>
    </div>
  </header>

  <div class="search-row">
    <a class="search-button" href="./pages/search.html">⌕ &nbsp; Search videos and Shorts</a>
  </div>

  <nav class="categories" aria-label="Video categories">
    <button class="category active" data-filter="all">All</button>
    <button class="category" data-filter="videos">Videos</button>
    <button class="category" data-filter="shorts">Shorts</button>
  </nav>

  <main>
    <div id="status" class="status">BTube feed load ho raha hai...</div>
    <section id="mainVideoFeed" class="feed" aria-label="Videos"></section>

    <section id="emptyState" class="empty-state" hidden>
      <div style="font-size:42px">▶</div>
      <h2>Abhi koi video nahi hai</h2>
      <p>Videos aur Shorts upload hone ke baad yahan dikhai denge.</p>
      <a class="primary-button" href="./pages/upload.html">Upload Video</a>
    </section>

    <div id="errorMessage" class="error-message" hidden></div>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-item" href="./index.html">
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </a>
    <a class="nav-item" href="./pages/shorts.html">
      <span class="nav-icon">▣</span>
      <span>Shorts</span>
    </a>
    <a class="nav-item" href="./pages/upload.html">
      <span class="create-button">+</span>
      <span>Create</span>
    </a>
    <a class="nav-item" href="./pages/subscriptions.html">
      <span class="nav-icon">▤</span>
      <span>Subscriptions</span>
    </a>
    <a class="nav-item" href="./pages/profile.html">
      <span class="nav-icon">●</span>
      <span>You</span>
    </a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="./assets/js/api-client.js"></script>

  <script>
    (() => {
      const feed = document.getElementById("mainVideoFeed");
      const status = document.getElementById("status");
      const emptyState = document.getElementById("emptyState");
      const errorMessage = document.getElementById("errorMessage");
      const categoryButtons = document.querySelectorAll("[data-filter]");

      let allVideos = [];
      let currentFilter = "all";

      function firstValue(item, keys, fallback = "") {
        for (const key of keys) {
          if (item && item[key] !== undefined && item[key] !== null && item[key] !== "") {
            return item[key];
          }
        }
        return fallback;
      }

      function isShort(item) {
        const type = String(firstValue(item, ["type", "contentType", "category"], "")).toLowerCase();
        return type === "short" || type === "shorts" || item.isShort === true;
      }

      function videoUrl(item) {
        return firstValue(item, ["videoUrl", "videoURL", "video_url", "url", "playbackUrl"], "");
      }

      function thumbnailUrl(item) {
        return firstValue(item, ["thumbnailUrl", "thumbnail", "thumbnailURL", "thumbnail_url", "coverUrl"], "");
      }

      function safeText(value) {
        return String(value == null ? "" : value);
      }

      function makeCard(item) {
        const id = firstValue(item, ["id", "videoId", "videoID"], "");
        const title = safeText(firstValue(item, ["title", "name"], "Untitled video"));
        const channel = safeText(firstValue(item, ["channelName", "creatorName", "username", "channel", "author"], "BTube Creator"));
        const views = firstValue(item, ["views", "viewCount"], 0);
        const thumb = thumbnailUrl(item);
        const url = videoUrl(item);
        const short = isShort(item);

        const card = document.createElement("article");
        card.className = "video-card";

        const link = document.createElement("a");
        const destination = short ? "./pages/shorts.html" : "./pages/watch.html";
        const params = new URLSearchParams();
        if (id) params.set("id", id);
        if (url) params.set("videoUrl", url);
        link.href = destination + (params.toString() ? "?" + params.toString() : "");

        const thumbWrap = document.createElement("div");
        thumbWrap.className = "thumbnail-wrap";

        if (thumb) {
          const image = document.createElement("img");
          image.className = "thumbnail";
          image.src = thumb;
          image.alt = title;
          image.loading = "lazy";
          image.onerror = () => {
            image.remove();
            thumbWrap.textContent = "▶";
            thumbWrap.style.display = "grid";
            thumbWrap.style.placeItems = "center";
            thumbWrap.style.fontSize = "42px";
          };
          thumbWrap.appendChild(image);
        } else {
          thumbWrap.textContent = short ? "▶ Shorts" : "▶";
          thumbWrap.style.display = "grid";
          thumbWrap.style.placeItems = "center";
          thumbWrap.style.fontSize = "24px";
        }

        link.appendChild(thumbWrap);

        const info = document.createElement("div");
        info.className = "video-info";

        const avatar = document.createElement("div");
        avatar.className = "channel-avatar";
        avatar.textContent = channel.trim().charAt(0).toUpperCase() || "B";

        const details = document.createElement("div");
        details.className = "video-details";

        const titleEl = document.createElement("h3");
        titleEl.className = "video-title";
        titleEl.textContent = title;

        const meta = document.createElement("div");
        meta.className = "video-meta";
        meta.textContent = channel + " · " + views + " views";

        details.appendChild(titleEl);
        details.appendChild(meta);
        info.appendChild(avatar);
        info.appendChild(details);

        card.appendChild(link);
        card.appendChild(info);
        return card;
      }

      function renderFeed() {
        feed.replaceChildren();

        const filtered = allVideos.filter(item => {
          if (currentFilter === "shorts") return isShort(item);
          if (currentFilter === "videos") return !isShort(item);
          return true;
        });

        filtered.forEach(item => feed.appendChild(makeCard(item)));

        emptyState.hidden = filtered.length > 0;
        feed.hidden = filtered.length === 0;
        status.textContent = filtered.length
          ? filtered.length + " item(s)"
          : "";

        if (allVideos.length === 0) {
          emptyState.querySelector("h2").textContent = "Abhi koi video nahi hai";
          emptyState.querySelector("p").textContent =
            "Videos aur Shorts upload hone ke baad yahan dikhai denge.";
        } else if (filtered.length === 0) {
          emptyState.querySelector("h2").textContent = "Is category mein abhi kuch nahi hai";
          emptyState.querySelector("p").textContent = "Doosri category select karein.";
        }
      }

      categoryButtons.forEach(button => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          categoryButtons.forEach(btn => btn.classList.toggle("active", btn === button));
          renderFeed();
        });
      });

      async function refreshFeed() {
        status.textContent = "BTube feed load ho raha hai...";
        errorMessage.hidden = true;
        emptyState.hidden = true;
        feed.hidden = false;

        try {
          if (!window.BTubeAPI || typeof window.BTubeAPI.getFeed !== "function") {
            throw new Error("BTube API client load nahi hua. assets/js/api-client.js check karein.");
          }

          const response = await window.BTubeAPI.getFeed("all");
          const items = Array.isArray(response)
            ? response
            : (response && Array.isArray(response.videos) ? response.videos
            : (response && Array.isArray(response.items) ? response.items : []));

          allVideos = items;
          renderFeed();
        } catch (error) {
          console.error("BTube feed error:", error);
          allVideos = [];
          feed.replaceChildren();
          feed.hidden = true;
          emptyState.hidden = false;
          emptyState.querySelector("h2").textContent = "Feed load nahi ho saka";
          emptyState.querySelector("p").textContent =
            "Internet connection aur Firebase/API configuration check karein.";
          status.textContent = "";
          errorMessage.textContent = error && error.message
            ? error.message
            : "Feed load karte samay error aaya.";
          errorMessage.hidden = false;
        }
      }

      refreshFeed();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(error => {
            console.warn("Service worker register nahi hua:", error);
          });
        });
      }
    })();
  </script>
</body>
</html>
