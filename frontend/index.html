<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BTube - Bharat Tube</title>

    <link rel="manifest" href="/manifest.json">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#0f0f0f; color:#fff; padding-bottom:70px; overflow-x:hidden; }

        /* Header */
        .app-header { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; position:sticky; top:0; background:#0f0f0f; z-index:100; border-bottom:1px solid #1c1c1c; }
        .logo-box { display:flex; align-items:center; gap:6px; text-decoration:none; color:#fff; font-size:19px; font-weight:800; letter-spacing:-0.5px; }
        .logo-icon { width:28px; height:20px; background:#e50914; border-radius:6px; display:flex; align-items:center; justify-content:center; }
        .logo-icon svg { width:14px; height:14px; fill:#fff; }
        
        .hdr-actions { display:flex; align-items:center; gap:16px; }
        .btn-hdr { background:none; border:none; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .btn-hdr svg { width:22px; height:22px; fill:#fff; }
        .user-chip-avatar { width:28px; height:28px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff; overflow:hidden; cursor:pointer; }
        .user-chip-avatar img { width:100%; height:100%; object-fit:cover; }

        /* Inline Search Bar Drawer */
        .search-drawer { display:none; padding:8px 16px; background:#181818; border-bottom:1px solid #282828; }
        .search-drawer.active { display:flex; gap:8px; }
        .search-input { flex:1; background:#0f0f0f; border:1px solid #333; color:#fff; padding:8px 14px; border-radius:20px; font-size:14px; outline:none; }
        .btn-search-close { background:none; border:none; color:#aaa; font-size:14px; cursor:pointer; }

        /* Refresh Indicator */
        .refresh-spinner-bar { display:none; justify-content:center; align-items:center; padding:10px 0; background:#0f0f0f; }
        .spin-circle { width:24px; height:24px; border:3px solid #222; border-top-color:#e50914; border-radius:50%; animation:spin 0.6s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* Categories */
        .category-bar { display:flex; gap:8px; padding:10px 16px; overflow-x:auto; scrollbar-width:none; position:sticky; top:52px; background:#0f0f0f; z-index:90; }
        .category-bar::-webkit-scrollbar { display:none; }
        .chip { background:#222; color:#fff; border:none; padding:7px 14px; border-radius:18px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; }
        .chip.active { background:#fff; color:#000; }

        /* Video Feed */
        .video-feed { display:flex; flex-direction:column; gap:18px; }
        .video-card { display:flex; flex-direction:column; cursor:pointer; }
        .thumb-wrapper { width:100%; aspect-ratio:16/9; background:#1c1c1c; position:relative; overflow:hidden; }
        .thumb-wrapper img { width:100%; height:100%; object-fit:cover; }
        .badge-time { position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.85); font-size:11px; font-weight:700; padding:2px 5px; border-radius:4px; }

        .details-wrapper { display:flex; gap:12px; padding:12px 16px 0; align-items:flex-start; justify-content:space-between; }
        .card-main-info { display:flex; gap:12px; flex:1; min-width:0; }
        .channel-avatar { width:38px; height:38px; border-radius:50%; background:#2a2a2a; overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; }
        .channel-avatar img { width:100%; height:100%; object-fit:cover; }
        .meta-col { display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
        .video-title { font-size:14px; font-weight:700; line-height:1.35; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
        .video-sub-meta { font-size:12px; color:#aaa; }

        .btn-card-dots { background:none; border:none; color:#aaa; padding:2px 0 2px 8px; cursor:pointer; display:flex; align-items:center; }
        .btn-card-dots svg { width:18px; height:18px; fill:#aaa; }

        /* Empty State */
        .empty-feed { text-align:center; padding:70px 24px; color:#aaa; display:flex; flex-direction:column; align-items:center; gap:12px; }
        .empty-feed svg { width:56px; height:56px; fill:#555; }
        .empty-feed h3 { font-size:18px; font-weight:800; color:#fff; }
        .empty-feed p { font-size:13px; color:#777; max-width:280px; line-height:1.4; }
        .btn-feed-upload { background:#e50914; color:#fff; padding:10px 22px; border-radius:24px; text-decoration:none; font-size:14px; font-weight:700; margin-top:6px; }

        /* Bottom Nav */
        .bottom-nav { position:fixed; bottom:0; left:0; width:100%; height:52px; background:#0f0f0f; display:flex; align-items:center; justify-content:space-around; border-top:1px solid #222; z-index:1000; }
        .nav-btn { display:flex; flex-direction:column; align-items:center; font-size:10px; color:#aaa; text-decoration:none; gap:2px; }
        .nav-btn.active { color:#fff; font-weight:700; }
        .nav-btn svg { width:22px; height:22px; fill:currentColor; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="/assets/js/api-client.js"></script>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <a href="index.html" class="logo-box">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <span>BTube</span>
        </a>
        <div class="hdr-actions">
            <button class="btn-hdr" onclick="toggleSearch()">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <a href="pages/notifications.html" class="btn-hdr">
                <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            </a>
            <button class="btn-hdr" onclick="refreshFeed(true)">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
            <div class="user-chip-avatar" id="topNavAvatar" onclick="window.location.href='pages/profile.html'">
                BT
            </div>
        </div>
    </header>

    <!-- Search Bar Drawer -->
    <div class="search-drawer" id="searchDrawer">
        <input type="text" id="searchInput" class="search-input" placeholder="Search BTube videos & channels..." oninput="handleSearch(this.value)">
        <button class="btn-search-close" onclick="toggleSearch()">Cancel</button>
    </div>

    <!-- Refresh Spinner -->
    <div class="refresh-spinner-bar" id="refreshSpinner">
        <div class="spin-circle"></div>
    </div>

    <!-- Filter Chips -->
    <div class="category-bar">
        <button class="chip active" onclick="setCategoryFilter('all', this)">All</button>
        <button class="chip" onclick="setCategoryFilter('video', this)">Videos</button>
        <button class="chip" onclick="setCategoryFilter('short', this)">Shorts</button>
    </div>

    <!-- Feed Container -->
    <main class="video-feed" id="mainVideoFeed"></main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-btn active"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
        <a href="pages/shorts.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg><span>Shorts</span></a>
        <a href="pages/upload.html" class="nav-btn" style="color:#e50914;"><svg viewBox="0 0 24 24" style="fill:#e50914;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Create</span></a>
        <a href="pages/subscriptions.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg><span>Subscriptions</span></a>
        <a href="pages/profile.html" class="nav-btn"><div style="width:20px; height:20px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff;" id="bottomNavAvatar">BT</div><span>You</span></a>
    </nav>

    <script>
        let currentFilter = 'all';
        let allCloudVideos = [];
        let searchQuery = '';

        window.addEventListener('DOMContentLoaded', async () => {
            syncHeaderAvatar();
            await refreshFeed(false);
            setupPullToRefresh();
        });

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(()=>{});
            });
        }

        function toggleSearch() {
            const drawer = document.getElementById('searchDrawer');
            const input = document.getElementById('searchInput');
            drawer.classList.toggle('active');
            if (drawer.classList.contains('active')) {
                input.focus();
            } else {
                input.value = '';
                searchQuery = '';
                renderFeedList();
            }
        }

        function handleSearch(val) {
            searchQuery = val.toLowerCase().trim();
            renderFeedList();
        }

        function syncHeaderAvatar() {
            const authUser = window.BTubeAPI ? window.BTubeAPI.getAuthUser() : JSON.parse(localStorage.getItem('btube_user') || 'null');
            const topAv = document.getElementById('topNavAvatar');
            const botAv = document.getElementById('bottomNavAvatar');

            if (authUser) {
                const photo = authUser.photo || '';
                const initial = (authUser.name || 'BT').substring(0, 2).toUpperCase();
                if (photo) {
                    topAv.innerHTML = `<img src="${photo}">`;
                    botAv.innerHTML = `<img src="${photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                } else {
                    topAv.innerText = initial;
                    botAv.innerText = initial;
                }
            }
        }

        async function refreshFeed(showSpinner = true) {
            const spinner = document.getElementById('refreshSpinner');
            if (showSpinner) {
                spinner.style.display = 'flex';
                await new Promise(r => setTimeout(r, 300));
            }

            allCloudVideos = [];
            if (window.BTubeAPI && typeof window.BTubeAPI.getFeed === 'function') {
                try {
                    allCloudVideos = await window.BTubeAPI.getFeed('all');
                } catch(e) {
                    console.error("Feed error:", e);
                }
            }

            renderFeedList();
            spinner.style.display = 'none';
        }

        function setCategoryFilter(type, el) {
            currentFilter = type;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderFeedList();
        }

        function renderFeedList() {
            const feedContainer = document.getElementById('mainVideoFeed');
            feedContainer.innerHTML = '';

            let filtered = allCloudVideos;

            // 1. Filter by Chip
            if (currentFilter !== 'all') {
                filtered = filtered.filter(v => {
                    const isShort = (v.type === 'short' || v.is_shorts === true);
                    return currentFilter === 'short' ? isShort : !isShort;
                });
            }

            // 2. Filter by Search Query
            if (searchQuery) {
                filtered = filtered.filter(v => {
                    const title = (v.title || '').toLowerCase();
                    const channel = (v.channel || v.channel_name || '').toLowerCase();
                    return title.includes(searchQuery) || channel.includes(searchQuery);
                });
            }

            if (!filtered || filtered.length === 0) {
                feedContainer.innerHTML = `
                    <div class="empty-feed">
                        <svg viewBox="0 0 24 24"><path d="M10 18v-6l5 3-5 3zm7-15H7c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7V5h10v14z"/></svg>
                        <h3>No videos found</h3>
                        <p>${searchQuery ? 'No results matched your search.' : 'Be the first creator to upload a video or Short.'}</p>
                        <a href="pages/upload.html" class="btn-feed-upload">+ Upload first video</a>
                    </div>
                `;
                return;
            }

            filtered.forEach(v => {
                const isShort = (v.type === 'short' || v.is_shorts === true);
                const card = document.createElement('article');
                card.className = 'video-card';
                
                const vidId = v.id || v.video_id;
                const videoStreamUrl = v.videoUrl || v.video_url || '';
                
                card.onclick = () => {
                    if (isShort) {
                        window.location.href = `pages/shorts.html?id=${vidId}`;
                    } else {
                        window.location.href = `pages/watch.html?id=${vidId}&videoUrl=${encodeURIComponent(videoStreamUrl)}`;
                    }
                };

                const avatarSrc = v.channelAvatar || v.avatar || '';
                const channelName = v.channel || v.channel_name || 'BTube Creator';
                const initial = channelName.substring(0, 2).toUpperCase();
                const thumbSrc = v.thumb || v.thumbnail_url || 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800';
                const viewsCount = v.views || v.views_count || 0;

                card.innerHTML = `
                    <div class="thumb-wrapper">
                        <img src="${thumbSrc}" loading="lazy">
                        <span class="badge-time">${isShort ? 'SHORT' : (v.duration || '03:45')}</span>
                    </div>
                    <div class="details-wrapper">
                        <div class="card-main-info">
                            <div class="channel-avatar">
                                ${avatarSrc ? `<img src="${avatarSrc}">` : initial}
                            </div>
                            <div class="meta-col">
                                <h3 class="video-title">${v.title}</h3>
                                <div class="video-sub-meta">${channelName} • ${viewsCount} views</div>
                            </div>
                        </div>
                        <button class="btn-card-dots" onclick="event.stopPropagation(); alert('Options: Share, Save, Not interested')">
                            <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                        </button>
                    </div>
                `;
                feedContainer.appendChild(card);
            });
        }

        function setupPullToRefresh() {
            let startY = 0;
            window.addEventListener('touchstart', (e) => {
                if (window.scrollY === 0) startY = e.touches[0].pageY;
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                const y = e.touches[0].pageY;
                if (window.scrollY === 0 && y - startY > 100) {
                    startY = 9999;
                    refreshFeed(true);
                }
            }, { passive: true });
        }
    </script>
</body>
</html>
