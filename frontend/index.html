<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>BTube - Watch Videos</title>

<style>
:root {
    --bg:#0f0f0f;
    --panel:#181818;
    --hover:#272727;
    --text:#f7f7f7;
    --muted:#aaa;
    --red:#ff0033;
    --border:#292929;
}
* {
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Roboto,"Segoe UI",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}
body {
    background:var(--bg);
    color:var(--text);
    padding-bottom:82px;
    overflow-x:hidden;
}
button,a { font:inherit; }
button { cursor:pointer; }
a { color:inherit; text-decoration:none; }

/* Header */
.app-header {
    height:58px;
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:rgba(15,15,15,.97);
    border-bottom:1px solid #202020;
}
.logo-box {
    display:flex;
    align-items:center;
    gap:8px;
    font-size:22px;
    font-weight:850;
    letter-spacing:-.7px;
}
.logo-icon {
    height:25px;
    width:35px;
    border-radius:7px;
    background:var(--red);
    display:grid;
    place-items:center;
}
.logo-icon svg {
    width:19px;
    height:19px;
    fill:white;
}
.hdr-actions {
    display:flex;
    align-items:center;
    gap:20px;
}
.icon-btn {
    display:grid;
    place-items:center;
    border:0;
    background:transparent;
    color:white;
    width:30px;
    height:38px;
}
.icon-btn svg {
    width:23px;
    height:23px;
    fill:currentColor;
}
.avatar {
    width:34px;
    height:34px;
    flex-shrink:0;
    border-radius:50%;
    background:#d90025;
    color:white;
    font-size:13px;
    font-weight:800;
    display:grid;
    place-items:center;
    overflow:hidden;
}
.avatar img {
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Categories */
.category-bar {
    display:flex;
    gap:9px;
    padding:12px 16px;
    overflow-x:auto;
    scrollbar-width:none;
    position:sticky;
    top:58px;
    z-index:90;
    background:var(--bg);
}
.category-bar::-webkit-scrollbar { display:none; }
.chip {
    border:0;
    background:#272727;
    color:#f5f5f5;
    padding:9px 16px;
    border-radius:9px;
    white-space:nowrap;
    font-size:14px;
    font-weight:600;
}
.chip.active {
    background:#f1f1f1;
    color:#111;
}

/* Feed */
.video-feed {
    display:flex;
    flex-direction:column;
    gap:25px;
}
.video-card {
    width:100%;
    cursor:pointer;
}
.thumb-wrapper {
    width:100%;
    aspect-ratio:16/9;
    background:#202020;
    position:relative;
    overflow:hidden;
}
.thumb-wrapper img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .25s;
}
.video-card:active .thumb-wrapper img {
    transform:scale(1.015);
}
.badge-time {
    position:absolute;
    right:9px;
    bottom:9px;
    background:rgba(0,0,0,.85);
    color:white;
    padding:4px 6px;
    font-size:11px;
    font-weight:750;
    border-radius:4px;
}
.details-wrapper {
    display:flex;
    gap:12px;
    padding:12px 14px 0;
}
.channel-avatar {
    width:40px;
    height:40px;
    border-radius:50%;
    flex-shrink:0;
    overflow:hidden;
    background:#292929;
    display:grid;
    place-items:center;
    font-weight:800;
    font-size:13px;
}
.channel-avatar img {
    width:100%;
    height:100%;
    object-fit:cover;
}
.meta-col { flex:1; min-width:0; }
.video-title {
    font-size:15px;
    font-weight:700;
    line-height:1.4;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    overflow-wrap:anywhere;
}
.video-sub-meta {
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
    line-height:1.5;
}
.more-btn {
    width:28px;
    height:30px;
    border:0;
    color:white;
    background:none;
    font-size:21px;
    flex-shrink:0;
}

/* Loading and empty states */
.state-box {
    text-align:center;
    padding:65px 22px;
    color:var(--muted);
}
.state-box h3 {
    color:white;
    margin-bottom:9px;
    font-size:18px;
}
.state-box p {
    font-size:14px;
    line-height:1.6;
}
.retry-btn {
    margin-top:17px;
    padding:10px 18px;
    border:0;
    border-radius:22px;
    background:white;
    color:black;
    font-weight:700;
}
.loader {
    width:30px;
    height:30px;
    margin:0 auto 15px;
    border:3px solid #333;
    border-top-color:white;
    border-radius:50%;
    animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* Bottom navigation */
.bottom-nav {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:calc(64px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(15,15,15,.98);
    border-top:1px solid #292929;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:1000;
}
.nav-btn {
    flex:1;
    min-width:0;
    height:58px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#aaa;
    font-size:11px;
}
.nav-btn.active {
    color:white;
    font-weight:700;
}
.nav-btn svg {
    width:23px;
    height:23px;
    fill:currentColor;
}
.create-icon {
    color:var(--red);
    font-size:32px;
    line-height:24px;
    font-weight:400;
}

/* Wider screens */
@media (min-width:700px) {
    .app-header { padding:0 28px; }
    .category-bar { padding-left:28px; }
    .video-feed {
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:30px 18px;
        padding:10px 22px;
    }
    .thumb-wrapper { border-radius:12px; }
}
@media (min-width:1050px) {
    .video-feed {
        grid-template-columns:repeat(3,minmax(0,1fr));
        padding:14px 28px;
    }
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="../assets/js/api-client.js"></script>
</head>

<body>

<header class="app-header">
    <a href="index.html" class="logo-box" aria-label="BTube Home">
        <span class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </span>
        <span>BTube</span>
    </a>

    <div class="hdr-actions">
        <a href="../pages/notifications.html" class="icon-btn" aria-label="Notifications">
            <svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5a6 6 0 0 0-5-5.91V4a1 1 0 0 0-2 0v1.09A6 6 0 0 0 6 11v5l-2 2v1h16v-1z"/></svg>
        </a>
        <a href="../pages/profile.html" class="avatar" id="topNavAvatar">BT</a>
    </div>
</header>

<div class="category-bar" aria-label="Video categories">
    <button class="chip active" data-filter="all" onclick="setCategoryFilter('all',this)">All</button>
    <button class="chip" data-filter="today" onclick="setCategoryFilter('today',this)">Today</button>
    <button class="chip" data-filter="video" onclick="setCategoryFilter('video',this)">Videos</button>
    <button class="chip" data-filter="short" onclick="setCategoryFilter('short',this)">Shorts</button>
</div>

<main class="video-feed" id="mainVideoFeed" aria-live="polite">
    <div class="state-box">
        <div class="loader"></div>
        <p>Loading videos...</p>
    </div>
</main>

<nav class="bottom-nav">
    <a href="index.html" class="nav-btn active">
        <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v9h6v-6h2v6h6v-9h3z"/></svg>
        <span>Home</span>
    </a>
    <a href="../pages/shorts.html" class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M17.8 10.2 15.9 9.4l1-.5a3.5 3.5 0 0 0-3.1-6.3L7 5.9a3.5 3.5 0 0 0-.1 6.3l1.9.8-1 .5a3.5 3.5 0 0 0 3.1 6.3l6.8-3.3a3.5 3.5 0 0 0 .1-6.3ZM10 15V9l5 3z"/></svg>
        <span>Shorts</span>
    </a>
    <a href="../pages/upload.html" class="nav-btn">
        <span class="create-icon">+</span>
        <span>Create</span>
    </a>
    <a href="../pages/subscriptions.html" class="nav-btn">
        <svg viewBox="0 0 24 24"><path d="M4 3h16v3H4zm-2 5h20v12H2zm7 2v8l7-4z"/></svg>
        <span>Subscriptions</span>
    </a>
    <a href="../pages/profile.html" class="nav-btn">
        <span class="avatar" id="bottomNavAvatar" style="width:25px;height:25px;font-size:10px">BT</span>
        <span>You</span>
    </a>
</nav>

<script>
'use strict';

let currentFilter = 'all';
let allCloudVideos = [];
let feedLoaded = false;

const DEFAULT_THUMB =
    'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=900';

window.addEventListener('DOMContentLoaded', refreshFeed);

async function refreshFeed() {
    const feed = document.getElementById('mainVideoFeed');

    feed.innerHTML = `
        <div class="state-box">
            <div class="loader"></div>
            <p>Loading videos...</p>
        </div>`;

    try {
        if (!window.BTubeAPI ||
            typeof window.BTubeAPI.getFeed !== 'function') {
            throw new Error('BTubeAPI.getFeed उपलब्ध नहीं है।');
        }

        const result = await window.BTubeAPI.getFeed('all');

        allCloudVideos = Array.isArray(result) ? result :
            (Array.isArray(result?.videos) ? result.videos : []);

        feedLoaded = true;
        renderFeedList();
    } catch (error) {
        console.error('BTube feed error:', error);

        feed.innerHTML = `
            <div class="state-box">
                <h3>वीडियो लोड नहीं हो सके</h3>
                <p>इंटरनेट कनेक्शन और BTube API की जाँच करें।</p>
                <button class="retry-btn" onclick="refreshFeed()">
                    फिर से कोशिश करें
                </button>
            </div>`;
    }
}

function setCategoryFilter(type, button) {
    currentFilter = type;

    document.querySelectorAll('.chip').forEach(chip => {
        chip.classList.toggle('active', chip === button);
    });

    renderFeedList();
}

function isShortVideo(video) {
    return video.type === 'short' ||
        video.type === 'shorts' ||
        video.is_shorts === true ||
        video.isShort === true;
}

function getVideoId(video) {
    return video.id || video.video_id || video.videoId || '';
}

function getVideoUrl(video) {
    return video.video_url ||
        video.videoUrl ||
        video.playback_url ||
        video.playbackUrl ||
        '';
}

function getThumbnail(video) {
    return video.thumbnail_url ||
        video.thumbnailUrl ||
        video.thumb ||
        video.thumbnail ||
        DEFAULT_THUMB;
}

function isUploadedToday(video) {
    const rawDate = video.created_at ||
        video.createdAt ||
        video.uploaded_at ||
        video.uploadedAt;

    if (!rawDate) return false;

    const date = rawDate.toDate
        ? rawDate.toDate()
        : new Date(rawDate);

    if (Number.isNaN(date.getTime())) return false;

    const now = new Date();

    return date.getFullYear() === now.getFullYear() &&
        date.getMonth() === now.getMonth() &&
        date.getDate() === now.getDate();
}

function openVideo(id, url, short) {
    if (!id) {
        alert('इस वीडियो की ID उपलब्ध नहीं है।');
        return;
    }

    if (short) {
        window.location.href =
            '../pages/shorts.html?id=' + encodeURIComponent(id);
        return;
    }

    window.location.href =
        '../pages/watch.html?id=' + encodeURIComponent(id) +
        '&videoUrl=' + encodeURIComponent(url || '');
}

function makeText(tag, className, value) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    element.textContent = value == null ? '' : String(value);
    return element;
}

function renderFeedList() {
    const feed = document.getElementById('mainVideoFeed');
    feed.replaceChildren();

    let videos = allCloudVideos.filter(v => v && typeof v === 'object');

    if (currentFilter === 'short') {
        videos = videos.filter(isShortVideo);
    } else if (currentFilter === 'video') {
        videos = videos.filter(v => !isShortVideo(v));
    } else if (currentFilter === 'today') {
        videos = videos.filter(isUploadedToday);
    }

    if (videos.length === 0) {
        const box = makeText('div', 'state-box', '');
        box.appendChild(makeText('h3', '', 'अभी कोई वीडियो नहीं है'));
        box.appendChild(makeText(
            'p', '', currentFilter === 'today'
                ? 'आज अपलोड किए गए वीडियो यहाँ दिखाई देंगे।'
                : 'नए वीडियो अपलोड होने पर यहाँ दिखाई देंगे।'
        ));

        if (!feedLoaded) {
            box.appendChild(makeText('p', '', 'वीडियो लोड हो रहे हैं...'));
        }

        feed.appendChild(box);
        return;
    }

    videos.forEach(video => {
        const id = getVideoId(video);
        const short = isShortVideo(video);
        const url = getVideoUrl(video);
        const title = video.title || 'Untitled video';
        const channel = video.channel_name ||
            video.channelName ||
            video.channel ||
            'BTube Creator';

        const views = Number(video.views_count ?? video.views ?? 0);
        const duration = video.duration || '';

        const card = makeText('article', 'video-card', '');
        card.setAttribute('role', 'link');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', title);

        card.addEventListener('click', () => openVideo(id, url, short));
        card.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                openVideo(id, url, short);
            }
        });

        const thumb = makeText('div', 'thumb-wrapper', '');
        const image = document.createElement('img');
        image.src = getThumbnail(video);
        image.alt = title;
        image.loading = 'lazy';
        image.onerror = () => {
            image.onerror = null;
            image.src = DEFAULT_THUMB;
        };

        thumb.appendChild(image);

        const badge = makeText(
            'span',
            'badge-time',
            short ? 'SHORT' : duration
        );
        if (badge.textContent) thumb.appendChild(badge);

        const details = makeText('div', 'details-wrapper', '');
        const mainInfo = makeText('div', 'card-main-info', '');
        mainInfo.style.cssText = 'display:flex;gap:12px;flex:1;min-width:0';

        const avatar = makeText(
            'div',
            'channel-avatar',
            String(channel).trim().slice(0, 2).toUpperCase() || 'BT'
        );

        const channelPhoto = video.channel_avatar ||
            video.channelAvatar ||
            video.avatar_url ||
            video.avatarUrl ||
            '';

        if (channelPhoto) {
            const avatarImg = document.createElement('img');
            avatarImg.src = channelPhoto;
            avatarImg.alt = '';
            avatarImg.onerror = () => avatarImg.remove();
            avatar.replaceChildren(avatarImg);
        }

        const meta = makeText('div', 'meta-col', '');
        meta.appendChild(makeText('h3', 'video-title', title));

        const viewLabel = views.toLocaleString('en-IN') +
            (views === 1 ? ' view' : ' views');

        meta.appendChild(makeText(
            'div',
            'video-sub-meta',
            channel + ' • ' + viewLabel
        ));

        mainInfo.append(avatar, meta);
        details.appendChild(mainInfo);

        const more = makeText('button', 'more-btn', '⋮');
        more.type = 'button';
        more.setAttribute('aria-label', 'More options');
        more.addEventListener('click', event => {
            event.stopPropagation();
        });

        details.appendChild(more);
        card.append(thumb, details);
        feed.appendChild(card);
    });
}
</script>

</body>
</html>
