<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>BTube</title>
    <link rel="stylesheet" href="style.css">

    <!-- PWA Setup -->
    <link rel="manifest" href="../manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../assets/js/api-client.js"></script>

    <style>
        .feed-loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 0;
            color: #aaa;
            font-size: 13px;
            gap: 10px;
        }
        .empty-feed-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            gap: 12px;
            color: #888888;
        }
        .empty-feed-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #1c1c1c;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .empty-feed-icon svg {
            width: 32px;
            height: 32px;
            fill: #e50914;
        }
        .btn-first-upload {
            background: #e50914;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <!-- 1. TOP HEADER -->
    <header class="bt-header">
        <a href="index.html" class="bt-brand">
            <svg viewBox="0 0 32 24" class="bt-logo-svg">
                <rect width="32" height="24" rx="7" fill="#FF0000"/>
                <path d="M 9 5.5 L 16 5.5 C 18.2 5.5 19.8 6.8 19.8 8.8 C 19.8 10.2 18.9 11.3 17.5 11.8 C 19.2 12.3 20.2 13.6 20.2 15.2 C 20.2 17.4 18.4 18.5 16 18.5 L 9 18.5 Z" fill="#ffffff" fill-rule="evenodd"/>
                <path d="M 12 7.8 L 12 11 L 15.5 9.4 Z" fill="#FF0000"/>
                <path d="M 12 13 L 12 16.2 L 15.8 14.6 Z" fill="#FF0000"/>
            </svg>
            <span class="bt-brand-text">B<span>Tube</span></span>
        </a>

        <div class="bt-header-icons">
            <a href="../pages/cast.html" class="header-icon-btn">
                <svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            </a>
            <a href="../pages/notifications.html" class="header-icon-btn">
                <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            </a>
            <a href="../pages/search.html" class="header-icon-btn">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </a>
        </div>
    </header>

    <!-- 2. CATEGORY CHIPS -->
    <nav class="category-tray">
        <button class="cat-pill active" onclick="filterFeed('All', this)">All</button>
        <button class="cat-pill" onclick="filterFeed('Music', this)">Music</button>
        <button class="cat-pill" onclick="filterFeed('Chhattisgarhi', this)">Chhattisgarhi</button>
        <button class="cat-pill" onclick="filterFeed('Vlogs', this)">Vlogs</button>
        <button class="cat-pill" onclick="filterFeed('Tech', this)">Tech</button>
    </nav>

    <!-- 3. REAL VIDEO & SHORTS FEED AREA -->
    <main class="video-stream-feed" id="videoFeedArea">

        <!-- Realtime Loader -->
        <div class="feed-loading-spinner" id="feedLoading">
            <span>Loading videos from Cloud Firestore...</span>
        </div>

        <!-- Real Shorts Shelf (Dynamic from Firebase) -->
        <section class="shorts-shelf" id="shortsContainer" style="display:none;">
            <div class="shorts-shelf-title">
                <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
                <span>Shorts</span>
            </div>
            <div class="shorts-slider" id="dynamicShortsSlider"></div>
        </section>

        <!-- Real Long Videos List -->
        <div id="dynamicVideosContainer"></div>

        <!-- Empty State (Only if Cloud Database has 0 videos) -->
        <div class="empty-feed-state" id="emptyStateBox">
            <div class="empty-feed-icon">
                <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </div>
            <h3 style="color:#ffffff; font-size:16px;">No Real Videos Yet</h3>
            <p style="font-size:12px;">All dummy videos have been removed. Upload real videos to your Firebase cloud!</p>
            <a href="../pages/upload.html" class="btn-first-upload">+ Upload Video</a>
        </div>

    </main>

    <!-- 4. BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav-bar">
        <a href="index.html" class="nav-tab-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="../pages/shorts.html" class="nav-tab-item">
            <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
            <span>Shorts</span>
        </a>
        <a href="../pages/upload.html" class="nav-plus-circle">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </a>
        <a href="../pages/subscriptions.html" class="nav-tab-item">
            <svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg>
            <span>Subscriptions</span>
        </a>
        <a href="../pages/profile.html" class="nav-tab-item">
            <div id="bottomNavInits" style="width:22px; height:22px; border-radius:50%; background:#e50914; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff;">CB</div>
            <span>You</span>
        </a>
    </nav>

    <script>
        let allRealFeedItems = [];

        window.addEventListener('DOMContentLoaded', async () => {
            // Channel Avatar Initial Sync
            const savedName = localStorage.getItem('btube_channel_name') || 'Charandas Bhaskar';
            const parts = savedName.trim().split(' ');
            let inits = parts[0][0];
            if (parts.length > 1) inits += parts[1][0];
            const bottomNavInits = document.getElementById('bottomNavInits');
            if (bottomNavInits) bottomNavInits.innerText = inits.toUpperCase();

            // Fetch Real Videos from Firebase
            await loadFirebaseRealFeed();
        });

        async function loadFirebaseRealFeed() {
            const loading = document.getElementById('feedLoading');
            const vContainer = document.getElementById('dynamicVideosContainer');
            const sShelf = document.getElementById('shortsContainer');
            const sSlider = document.getElementById('dynamicShortsSlider');
            const emptyBox = document.getElementById('emptyStateBox');

            try {
                // Fetch directly via window.BTubeAPI from Firestore
                allRealFeedItems = await window.BTubeAPI.getFeed('all');
                loading.style.display = 'none';

                if (!allRealFeedItems || allRealFeedItems.length === 0) {
                    emptyBox.style.display = 'flex';
                    return;
                }

                emptyBox.style.display = 'none';
                vContainer.innerHTML = '';
                sSlider.innerHTML = '';

                const realLongVideos = allRealFeedItems.filter(i => (i.type || 'video') === 'video');
                const realShorts = allRealFeedItems.filter(i => (i.type || 'video') === 'short');

                // 1. Render Real Shorts Shelf
                if (realShorts.length > 0) {
                    sShelf.style.display = 'block';
                    realShorts.forEach(s => {
                        const card = document.createElement('a');
                        card.className = 'short-card';
                        card.href = `../pages/shorts.html?id=${s.id}`;
                        card.innerHTML = `
                            <img src="${s.thumb || 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=600'}" alt="${s.title}">
                            <div class="short-card-overlay">
                                <span class="short-card-title">${s.title}</span>
                                <span class="short-card-views">${s.views || 0} views</span>
                            </div>
                        `;
                        sSlider.appendChild(card);
                    });
                } else {
                    sShelf.style.display = 'none';
                }

                // 2. Render Real Long Videos
                realLongVideos.forEach(v => {
                    if (v.visibility === 'Private') return;

                    const chName = v.channel || 'Charandas Bhaskar';
                    const chInits = chName.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
                    const watchUrl = `../pages/watch.html?id=${v.id}&videoUrl=${encodeURIComponent(v.videoUrl || '')}&title=${encodeURIComponent(v.title || '')}&channel=${encodeURIComponent(chName)}`;

                    const videoCard = document.createElement('article');
                    videoCard.className = 'feed-video-card';
                    videoCard.setAttribute('data-cat', `All ${v.category || 'Chhattisgarhi Music'}`);
                    videoCard.innerHTML = `
                        <a href="${watchUrl}" class="video-thumb-frame">
                            <img src="${v.thumb || 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=800'}" alt="${v.title}">
                            <span class="duration-tag">${v.duration || '03:15'}</span>
                        </a>
                        <div class="video-details-row">
                            <a href="../pages/channel.html" class="creator-circle-avatar" style="background:#e50914; text-decoration:none;">${chInits}</a>
                            <div class="details-column">
                                <a href="${watchUrl}" class="card-title-text" style="text-decoration:none; color:#fff;">
                                    ${v.title}
                                </a>
                                <span class="card-meta-text">${chName} • ${v.views || 0} views • Realtime</span>
                            </div>
                        </div>
                    `;
                    vContainer.appendChild(videoCard);
                });

            } catch (err) {
                loading.innerText = 'Failed to load cloud feed. Please check connection.';
            }
        }

        function filterFeed(cat, btn) {
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');

            const cards = document.querySelectorAll('.feed-video-card');
            cards.forEach(card => {
                const itemCat = card.getAttribute('data-cat') || '';
                if (cat === 'All' || itemCat.toLowerCase().includes(cat.toLowerCase())) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
