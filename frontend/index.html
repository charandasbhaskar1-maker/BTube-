<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <title>BTube</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="../assets/js/api-client.js"></script>

  <style>
    .bt-state {
      padding: 48px 20px;
      text-align: center;
      color: #aaa;
      line-height: 1.6;
    }
    .bt-state h3 { color: #fff; }
    .bt-button {
      display: inline-block;
      padding: 11px 20px;
      margin-top: 12px;
      border-radius: 22px;
      color: white;
      background: #e50914;
      text-decoration: none;
      font-weight: 700;
    }
    .bt-video-card { margin-bottom: 24px; }
    .bt-thumb {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #181818;
      object-fit: contain;
      border-radius: 10px;
    }
    .bt-video-info {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 4px;
    }
    .bt-avatar {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e50914;
      color: white;
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .bt-title {
      display: block;
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .bt-meta {
      display: block;
      margin-top: 6px;
      color: #aaa;
      font-size: 12px;
    }
    .bt-shorts-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 0 20px;
    }
    .bt-short-card {
      display: block;
      flex: 0 0 145px;
      color: white;
      text-decoration: none;
    }
    .bt-short-thumb {
      width: 145px;
      height: 230px;
      border-radius: 10px;
      background: #181818;
      object-fit: contain;
    }
    .bt-short-title {
      display: block;
      padding-top: 8px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .bt-error { color: #ffb4b4; }
  </style>
</head>
<body>
  <header class="bt-header">
    <a href="index.html" class="bt-brand">
      <svg viewBox="0 0 32 24" class="bt-logo-svg" aria-hidden="true">
        <rect width="32" height="24" rx="7" fill="#FF0000"/>
        <path d="M9 5.5h7c2.2 0 3.8 1.3 3.8 3.3 0 1.4-.9 2.5-2.3 3 1.7.5 2.7 1.8 2.7 3.4 0 2.2-1.8 3.3-4.2 3.3H9z" fill="#fff"/>
        <path d="M12 7.8V11l3.5-1.6zM12 13v3.2l3.8-1.6z" fill="#f00"/>
      </svg>
      <span class="bt-brand-text">B<span>Tube</span></span>
    </a>
    <div class="bt-header-icons">
      <a href="../pages/cast.html" class="header-icon-btn" aria-label="Cast">Cast</a>
      <a href="../pages/notifications.html" class="header-icon-btn" aria-label="Notifications">♧</a>
      <a href="../pages/search.html" class="header-icon-btn" aria-label="Search">⌕</a>
    </div>
  </header>

  <nav class="category-tray" aria-label="Video categories">
    <button class="cat-pill active" onclick="filterFeed('All',this)">All</button>
    <button class="cat-pill" onclick="filterFeed('Music',this)">Music</button>
    <button class="cat-pill" onclick="filterFeed('Chhattisgarhi',this)">Chhattisgarhi</button>
    <button class="cat-pill" onclick="filterFeed('Vlogs',this)">Vlogs</button>
    <button class="cat-pill" onclick="filterFeed('Tech',this)">Tech</button>
  </nav>

  <main class="video-stream-feed" id="videoFeedArea">
    <div class="bt-state" id="feedLoading">Firebase से वीडियो लोड हो रहे हैं…</div>

    <section id="shortsContainer" style="display:none;padding:0 12px;">
      <h3>Shorts</h3>
      <div id="dynamicShortsSlider" class="bt-shorts-row"></div>
    </section>

    <div id="dynamicVideosContainer" style="padding:0 12px;"></div>

    <div class="bt-state" id="emptyStateBox" style="display:none;">
      <h3>अभी कोई वीडियो नहीं है</h3>
      <p>Firebase में असली वीडियो अपलोड होने के बाद वे यहाँ दिखाई देंगे।</p>
      <a href="../pages/upload-video.html" class="bt-button">+ वीडियो अपलोड करें</a>
    </div>

    <div class="bt-state" id="errorStateBox" style="display:none;">
      <h3>वीडियो लोड नहीं हो पाए</h3>
      <p id="errorMessage" class="bt-error">इंटरनेट या Firebase सेटिंग जाँचें।</p>
      <button class="bt-button" onclick="loadFirebaseRealFeed()">दोबारा कोशिश करें</button>
    </div>
  </main>

  <nav class="bottom-nav-bar">
    <a href="index.html" class="nav-tab-item active"><span>⌂</span><span>Home</span></a>
    <a href="../pages/shorts.html" class="nav-tab-item"><span>▶</span><span>Shorts</span></a>
    <a href="../pages/upload-video.html" class="nav-plus-circle" aria-label="Upload">+</a>
    <a href="../pages/subscriptions.html" class="nav-tab-item"><span>▤</span><span>Subscriptions</span></a>
    <a href="../pages/profile.html" class="nav-tab-item"><span>●</span><span>You</span></a>
  </nav>

  <script>
    let allRealFeedItems = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadFirebaseRealFeed();
    });

    function makeText(tag, className, value) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      el.textContent = value == null ? '' : String(value);
      return el;
    }

    function safeVideoUrl(url) {
      try {
        const parsed = new URL(url, location.href);
        return parsed.protocol === 'https:' || parsed.protocol === 'http:';
      } catch (_) {
        return false;
      }
    }

    function makeThumbnail(item, isShort) {
      const img = document.createElement('img');
      img.className = isShort ? 'bt-short-thumb' : 'bt-thumb';
      img.alt = item.title || 'Video thumbnail';
      img.loading = 'lazy';

      // नकली/demo thumbnail का उपयोग नहीं किया जाता।
      if (item.thumb && safeVideoUrl(item.thumb)) {
        img.src = item.thumb;
      } else {
        img.alt = 'इस वीडियो का thumbnail उपलब्ध नहीं है';
      }
      return img;
    }

    function makeWatchUrl(item) {
      return '../pages/watch.html?id=' + encodeURIComponent(item.id);
    }

    function renderShort(item) {
      if (!item.id || !safeVideoUrl(item.videoUrl)) return null;

      const card = document.createElement('a');
      card.className = 'bt-short-card';
      card.href = '../pages/shorts.html?id=' + encodeURIComponent(item.id);
      card.appendChild(makeThumbnail(item, true));
      card.appendChild(makeText('span', 'bt-short-title', item.title || 'बिना शीर्षक'));
      return card;
    }

    function renderVideo(item) {
      if (!item.id || !safeVideoUrl(item.videoUrl)) return null;
      if (String(item.visibility || 'Public').toLowerCase() !== 'public') return null;

      const category = String(item.category || item.description || '');
      const card = document.createElement('article');
      card.className = 'bt-video-card feed-video-card';
      card.dataset.cat = 'all ' + category.toLowerCase();

      const link = document.createElement('a');
      link.href = makeWatchUrl(item);
      link.appendChild(makeThumbnail(item, false));
      card.appendChild(link);

      const info = document.createElement('div');
      info.className = 'bt-video-info';

      const channel = String(item.channel || 'BTube Creator');
      const avatar = makeText('div', 'bt-avatar',
        channel.trim().split(/\s+/).map(part => part[0] || '').join('').slice(0,2).toUpperCase()
      );

      const details = document.createElement('div');
      details.style.minWidth = '0';
      const title = makeText('a', 'bt-title', item.title || 'बिना शीर्षक');
      title.href = makeWatchUrl(item);

      const meta = makeText('span', 'bt-meta',
        channel + ' • ' + Number(item.views || 0) + ' views'
      );

      details.append(title, meta);
      info.append(avatar, details);
      card.appendChild(info);
      return card;
    }

    async function loadFirebaseRealFeed() {
      const loading = document.getElementById('feedLoading');
      const videoContainer = document.getElementById('dynamicVideosContainer');
      const shortsContainer = document.getElementById('shortsContainer');
      const shortsSlider = document.getElementById('dynamicShortsSlider');
      const empty = document.getElementById('emptyStateBox');
      const error = document.getElementById('errorStateBox');

      loading.style.display = 'block';
      empty.style.display = 'none';
      error.style.display = 'none';
      videoContainer.replaceChildren();
      shortsSlider.replaceChildren();
      shortsContainer.style.display = 'none';

      try {
        if (!window.BTubeAPI || typeof window.BTubeAPI.getFeed !== 'function') {
          throw new Error('BTube API लोड नहीं हुआ।');
        }

        allRealFeedItems = await window.BTubeAPI.getFeed('all');
        if (!Array.isArray(allRealFeedItems)) allRealFeedItems = [];

        const shorts = allRealFeedItems.filter(item =>
          String(item.type || 'video').toLowerCase() === 'short'
        );
        const videos = allRealFeedItems.filter(item =>
          String(item.type || 'video').toLowerCase() !== 'short'
        );

        shorts.forEach(item => {
          const card = renderShort(item);
          if (card) shortsSlider.appendChild(card);
        });

        if (shortsSlider.childElementCount) {
          shortsContainer.style.display = 'block';
        }

        videos.forEach(item => {
          const card = renderVideo(item);
          if (card) videoContainer.appendChild(card);
        });

        loading.style.display = 'none';
        if (!shortsSlider.childElementCount && !videoContainer.childElementCount) {
          empty.style.display = 'flex';
        }
      } catch (err) {
        loading.style.display = 'none';
        error.style.display = 'block';
        document.getElementById('errorMessage').textContent =
          'Firebase से वीडियो नहीं आए। Firebase SDK, Firestore Rules और नेटवर्क जाँचें।';
        console.error('BTube feed error:', err);
      }
    }

    function filterFeed(category, button) {
      document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
      button.classList.add('active');

      document.querySelectorAll('.feed-video-card').forEach(card => {
        const itemCategory = card.dataset.cat || '';
        card.style.display =
          category === 'All' || itemCategory.includes(category.toLowerCase())
            ? ''
            : 'none';
      });
    }
  </script>
</body>
</html>
